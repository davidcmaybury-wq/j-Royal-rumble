<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>J! Royal Rumble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* The clue face.
   ITC Korinna Bold is what the show used and is licensed, so this is Bitter at
   700 — the closest free slab serif: heavy, slightly rounded slabs, generous
   x-height. All caps, white on the board blue, with a tight black shadow the
   way the studio cards carried one. */
.btext{font-family:"Bitter",Georgia,serif;font-weight:700;text-transform:uppercase;
color:#FFFFFF;letter-spacing:.012em;
text-shadow:2px 2px 0 #000000,1px 1px 0 #000000,0 1px 2px #00000099}

:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;
--chalk:#EEEBE1;--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;
-webkit-font-smoothing:antialiased;user-select:none}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.mq{font-family:"Anton",Impact,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);height:100dvh;max-width:520px;margin:0 auto;position:relative;transition:background .5s}
.app.soon{background:linear-gradient(180deg,#2A1D06 0%,#0A0E1C 46%)}
.app.soon1{background:linear-gradient(180deg,#4A2E06 0%,#0A0E1C 52%)}
.callup{background:var(--brass);color:#0A0E1C;text-align:center;padding:9px 12px;
font:400 15px/1.25 "Anton",Impact,sans-serif;letter-spacing:.06em}
.callup.p{animation:cpulse 1s ease-in-out infinite}
@keyframes cpulse{0%,100%{opacity:1}50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.callup.p{animation:none}}

/* join */
.join{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.join h1{font:400 clamp(30px,9vw,46px)/1 "Anton",Impact,sans-serif;margin:0;color:var(--brass)}
.brandmark{margin-bottom:2px;filter:drop-shadow(0 6px 18px #0009)}
.pic{width:92px;height:92px;border-radius:50%;border:2px dashed var(--line);display:flex;
align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--panel);flex:none}
.pic:hover{border-color:var(--brass)}
.pic.set{border-style:solid;border-color:var(--brass)}
.picinner{color:var(--slate);font-size:22px;line-height:1.1;text-align:center}
.pict{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.idrow{display:flex;gap:14px;align-items:center;justify-content:center}
.tokbtn{width:92px;height:92px;border-radius:50%;border:2px solid var(--line);
background:var(--panel);display:flex;align-items:center;justify-content:center;
cursor:pointer;padding:0;flex:none}
.tokbtn:hover{border-color:var(--brass)}
.tokbtn svg{border-radius:50%;display:block}
.tokhint{font-size:11.5px;color:var(--slate);text-align:center;margin-top:-4px}
.tokask{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.tokpick{position:fixed;inset:0;background:#0A0E1CF0;z-index:70;display:flex;
align-items:center;justify-content:center;padding:16px}
.tpbox{background:var(--panel);border:1px solid var(--brass);border-radius:10px;
padding:14px;width:100%;max-width:390px;max-height:88vh;overflow:auto}
.tpbox h3{margin:0 0 10px;font:400 17px "IBM Plex Sans",sans-serif}
.tpgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.tpgrid button{padding:0;border:1px solid transparent;border-radius:50%;background:none;cursor:pointer;line-height:0}
.tpgrid button:hover,.tpgrid button.on{border-color:var(--brass)}
.tprow{display:flex;gap:8px;justify-content:center;margin:12px 0 4px}
.tprow button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.tprow button.on{border-color:var(--chalk)}
.join .sub{font-size:13px;color:var(--slate);max-width:30ch}
.join .code4{font-family:"IBM Plex Mono",monospace;font-size:30px;letter-spacing:.34em;
text-indent:.34em;max-width:220px;color:var(--brass)}
.join input{width:100%;max-width:300px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);color:var(--chalk);font:400 17px "IBM Plex Sans",sans-serif;text-align:center}
.join input::placeholder{color:var(--slate)}
.rules{text-align:left;max-width:340px;background:var(--panel);border:1px solid var(--line);
border-radius:var(--r);padding:14px 16px;margin-top:4px}
.rules .rt{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.rules ul{margin:0;padding-left:17px}
.rules li{font-size:12.5px;line-height:1.5;color:var(--slate);margin-bottom:6px}
.rules li b{color:var(--chalk);font-weight:400}
.rules .rf{font-size:11.5px;color:var(--slate);border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
.join{justify-content:flex-start;padding-top:34px;overflow-y:auto}
.join button{padding:13px 34px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:16px}
.join button:disabled{opacity:.35;border-color:var(--line);color:var(--slate);cursor:default}
.err{font-size:13px;color:var(--alarm)}

/* header */
.hd{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
.hd .dr{font-size:19px;color:var(--brass);line-height:1}
.hd .nm{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{margin-left:auto;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--slate);white-space:nowrap}
.badge.live{color:var(--live);border-color:#2C6B4F}
.badge.queued{color:var(--brass);border-color:#6B5420}
.badge.out{color:var(--alarm);border-color:#6B2C26}
.dot{width:6px;height:6px;border-radius:50%;background:var(--alarm);flex:none}
.dot.on{background:var(--live)}

/* meter */
.meter{padding:16px 15px 14px;text-align:center;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.meter .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate)}
.score{font-size:clamp(46px,16vw,72px);line-height:.95;margin:2px 0 4px;transition:color .2s}
.score.dn{color:var(--alarm)}.score.up{color:var(--live)}
.ceil{font-size:11.5px;color:var(--slate)}
.ceil b{color:var(--brass);font-weight:400}
.delta{position:absolute;right:16px;top:46%;font-size:21px;opacity:0}
.delta.go{animation:fly 1.1s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(6px)}22%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.cd .n{font-size:clamp(52px,19vw,80px);line-height:.9;color:var(--brass);display:block}
.cd .sub{font-size:12px;color:var(--slate);margin-top:3px}

/* buzzer */
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;min-height:0}
.buzz{width:min(64vw,230px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:5px;background:#161D33;border:3px solid var(--line);
color:var(--slate);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
transition:transform .06s,background .12s,border-color .12s;box-shadow:inset 0 -5px 0 #0006}
.buzz .big{font-size:clamp(23px,6.5vw,32px);letter-spacing:.04em;line-height:1}
.buzz.armed{background:#1E2A4C;border-color:var(--brass);color:var(--brass);
animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:inset 0 -5px 0 #0006,0 0 0 0 #D6A93F00}50%{box-shadow:inset 0 -5px 0 #0006,0 0 0 12px #D6A93F14}}
.buzz.armed:active{transform:scale(.965)}
.buzz.sent{background:#17402F;border-color:#2C6B4F;color:var(--live)}
.buzz.early{background:#3E1A17;border-color:var(--alarm);color:var(--alarm);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.buzz.locked{background:#12162A;border-color:#241A1A;color:#5A3A38}
.buzz.spec{background:#171F38;border-color:#3A4670;color:var(--slate)}
.buzz.spec:active{transform:scale(.965)}
@media (prefers-reduced-motion:reduce){.buzz.armed,.buzz.early,.delta.go{animation:none}}
.fb{text-align:center;min-height:54px}
.fb .t{font-size:25px;line-height:1.1}
.fb .t .u{font-size:13px;color:var(--slate)}
.fb .p{font-size:13px;color:var(--slate);margin-top:2px}
.fb .p b{color:var(--chalk);font-weight:500}
.fb .warn{font-size:13px;color:var(--alarm)}
.mech{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 10px}
.mbtn{padding:8px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;color:var(--slate)}
.mbtn:hover{color:var(--chalk);border-color:var(--slate)}
.mbtn.cooling{opacity:.5;border-style:dashed}
.mbtn.on{border-color:var(--brass);color:var(--brass);background:#3A2E0C}
.mbtn .k{opacity:.55;margin-left:5px;font-size:10.5px}
.mbtn:disabled{opacity:.3;cursor:default}
.lastarm{font-size:10.5px;color:var(--brass);font-family:"IBM Plex Mono",monospace;
display:block;width:100%;margin-top:2px;text-align:center}
.bonus{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:80;
text-align:center;pointer-events:none;animation:bonusin .32s cubic-bezier(.2,.9,.3,1),
bonusout .5s ease-in 1.7s forwards}
@keyframes bonusin{from{opacity:0;transform:translate(-50%,-30%) scale(.85)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes bonusout{to{opacity:0;transform:translate(-50%,-62%) scale(1.04)}}
.bonus .bg{display:block;font-size:clamp(46px,15vw,86px);line-height:1;color:var(--brass);
text-shadow:0 0 28px #D6A93F55}
.bonus .bs{display:block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;
color:var(--slate);margin-top:6px}
.bonus.swept .bg{color:#FFD877}
.bonus.saved .bg{color:var(--live)}
/* Full mode puts the board beside the buzzer. The buzzer keeps a fixed width so
   it does not shrink into something harder to hit. */
body.full .app{max-width:none}
body.full #root{display:grid;grid-template-columns:minmax(360px,420px) minmax(0,1fr);
gap:18px;align-items:start;max-width:1500px;margin:0 auto}
.board{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
padding:16px;min-height:60vh}
.bwait{color:var(--slate);text-align:center;padding:40px 0}
.bcorner{position:fixed;right:16px;bottom:16px;z-index:60;opacity:0;transform:translateY(10px);
transition:opacity .18s ease,transform .18s ease;pointer-events:none;text-align:center}
.bcorner.on{opacity:1;transform:none}
.bcorner svg{display:block;border-radius:6px;border:2px solid var(--line)}
.bcap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px;color:var(--slate)}
.bcap.entry{color:var(--live)}
.bcap.toss{color:var(--alarm)}
@media (prefers-reduced-motion:reduce){.bcorner{transition:none}}
.bgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;
background:linear-gradient(160deg,#8E8578,#6E675C 55%,#57514A);padding:8px;border-radius:6px;
box-shadow:inset 0 1px 0 #B5AC9C,inset 0 -2px 4px #00000066}
/* Fixed height, and the text shrinks rather than the card growing. A long
   category made one column taller than the rest and pushed its whole stack
   down; in a narrow window the titles simply overflowed the card. */
.bcat{height:46px;display:grid;place-items:center;overflow:hidden;
font-size:clamp(7px,0.85vw,10.5px);line-height:1.15;text-transform:uppercase;letter-spacing:.03em;
text-align:center;color:#1C2242;font-weight:700;
background:linear-gradient(175deg,#EFE9DC,#CFC7B6);border:2px solid #3A352C;border-radius:3px;
padding:4px 3px;margin-bottom:6px;
box-shadow:inset 0 1px 0 #FFFFFFAA,inset 0 -2px 3px #00000033}
.bcat span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bcell{position:relative;border-radius:5px;border:2px solid #26221C;text-align:center;
padding:11px 2px;margin-bottom:6px;overflow:hidden;
background:radial-gradient(ellipse 90% 75% at 50% 40%,#2B2BE0 0%,#1717C2 52%,#0B0B93 100%);
box-shadow:inset 0 0 10px #000A4ACC;
font-family:"Anton",Impact,sans-serif;font-size:14px;letter-spacing:.05em;
color:#FFF;text-shadow:0 0 5px #9A9AFF,0 1px 1px #000060}
.bcell.played{background:radial-gradient(ellipse 90% 75% at 50% 40%,#2222C8 0%,#1212A8 55%,#0A0A85 100%);
color:transparent;text-shadow:none}
.bcol{min-width:0;display:grid;grid-template-rows:auto repeat(5,1fr)}
.brow .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The clue on the board's own blue, in the 4:3 the monitors were. */
.bclue{aspect-ratio:4/3;width:100%;display:grid;place-items:center;align-content:center;
text-align:center;padding:24px;gap:14px;border-radius:6px;border:3px solid #26221C;
background:radial-gradient(ellipse 90% 75% at 50% 40%,#2B2BE0 0%,#1717C2 52%,#0B0B93 100%);
box-shadow:inset 0 0 40px #000A4A99}
.bmeta{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#AFC0E8}
.btext{font-size:clamp(17px,2.1vw,26px);line-height:1.3;margin-top:12px;max-width:26ch}
.bring{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.brow{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:4px 2px;
font-size:13.5px;align-items:center}
.brow .bd{color:var(--slate);font-family:"IBM Plex Mono",monospace;font-size:11px;text-align:right}
.brow .bs{color:var(--brass)}
/* On the sign-in card the surrounding form is full width, and a full-width
   button next to a small Join looked like the primary action. */
.joinmusic{max-width:300px;margin-left:auto;margin-right:auto}
.fullbtn{display:block;width:100%;margin-top:12px;padding:10px;border:1px solid var(--line);
border-radius:var(--r);background:none;color:var(--slate);cursor:pointer;font-size:13px}
.fullbtn:hover{border-color:var(--brass);color:var(--chalk)}
.fullbtn.on{border-color:var(--brass);color:var(--brass)}
.fullbtn .fh{display:block;font-size:10.5px;opacity:.75;margin-top:3px}
.sheet{position:fixed;inset:0;background:#050810CC;display:grid;place-items:center;
z-index:90;padding:16px}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
padding:20px;max-width:440px;width:100%;max-height:86vh;overflow:auto}
.sbox h3{font-size:16px;font-weight:500;margin-bottom:4px}
.snote{font-size:12.5px;color:var(--slate);line-height:1.5;margin-bottom:14px}
.smood{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
margin:14px 0 7px}
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.schip{padding:10px;border:1px solid var(--line);border-radius:var(--r);background:none;
color:var(--chalk);font-size:13.5px;cursor:pointer;text-align:left}
.schip:hover{border-color:var(--brass)}
.schip.on{border-color:var(--brass);color:var(--brass);background:#241B08}
.sbox input[type=text]{width:100%;padding:10px;background:var(--ink);color:var(--chalk);
border:1px solid var(--line);border-radius:var(--r);font-size:14px}
.sbox input.bad{border-color:var(--alarm)}
.srow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--slate)}
.srow input{width:74px;padding:7px;background:var(--ink);color:var(--chalk);
border:1px solid var(--line);border-radius:var(--r)}
.sbtns{display:flex;gap:8px;margin-top:18px}
.sbtns button{flex:1;padding:11px;border:1px solid var(--line);border-radius:var(--r);
background:none;color:var(--slate);cursor:pointer}
.sbtns .prim{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:500}
.backhome{display:block;text-align:center;margin-top:14px;color:var(--slate);
font-size:13.5px;text-decoration:none}
.backhome:hover{color:var(--brass)}
.homebtn{display:block;text-align:center;margin:16px auto 0;max-width:280px;
padding:12px;border:1px solid var(--line);border-radius:var(--r);color:var(--slate);
text-decoration:none;font-size:14px}
.homebtn:hover{border-color:var(--brass);color:var(--brass)}
.fullno{margin-top:12px;font-size:11.5px;color:var(--slate);line-height:1.5;text-align:center}
.watchlink{display:block;text-align:center;margin-top:14px;color:var(--brass);
text-decoration:none;font-size:13px;border-bottom:1px solid #6A4509;
padding-bottom:2px;width:fit-content;margin-left:auto;margin-right:auto}
.watchlink:hover{border-bottom-color:var(--brass)}
.watchlink.small{font-size:11.5px;margin-top:10px;opacity:.75}
.lagbox{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;
padding:8px 12px;border:1px solid var(--line);border-radius:20px;margin-top:2px}
.lagbox .lt{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.lagbox .lg{width:24px;height:24px;border:1px solid var(--line);border-radius:var(--r);color:var(--slate);font-size:15px;line-height:1}
.lagbox .lg:hover{border-color:var(--brass);color:var(--brass)}
.lagbox .lv{width:58px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:3px 5px;font-size:13px;text-align:center;font-family:"IBM Plex Mono",monospace}
.lagbox .lh{width:100%;text-align:center;font-size:10.5px;color:var(--slate)}
.lockon{border-color:var(--alarm)!important;color:var(--alarm)!important;background:#3E1A17!important}
.hunted{background:var(--alarm);color:#0A0E1C;text-align:center;padding:7px 12px;
font:400 13px/1.2 "Anton",Impact,sans-serif;letter-spacing:.1em;animation:hpulse .9s ease-in-out infinite}
@keyframes hpulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.hunted{animation:none}}
.picker{position:fixed;inset:0;background:#0A0E1CEE;z-index:50;display:flex;align-items:center;
justify-content:center;padding:18px}
.pbox{background:var(--panel);border:1px solid var(--brass);border-radius:10px;padding:16px;width:100%;max-width:380px}
.pbox h3{margin:0 0 4px;font:400 17px "IBM Plex Sans",sans-serif}
.pbox .sub2{font-size:12px;color:var(--slate);margin-bottom:12px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:var(--r);
background:var(--ink);margin-bottom:5px;font-size:14px;border:1px solid transparent}
.prow:hover{border-color:var(--brass)}
.prow .n{width:20px;color:var(--brass);font-family:"IBM Plex Mono",monospace}
.prow .sc2{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--slate)}
.prow.cur{border-color:var(--alarm)}
.pbox input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:9px 11px;font:400 15px "IBM Plex Mono",monospace;margin-top:8px}
.pbox .go2{width:100%;margin-top:9px;padding:10px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r)}

/* out takeover */
.gone{position:absolute;inset:0;background:#0A0E1CF7;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:6px;z-index:20;padding:20px;text-align:center}
.gone .h{font-size:clamp(36px,11vw,54px);color:var(--alarm);line-height:1}
.gone .s{font-size:14px;color:var(--slate);max-width:26ch}
.gone .st{display:flex;gap:22px;margin-top:14px}
.gone .st .v{font-size:23px}
.gone .st .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}

/* results */
.results{position:fixed;inset:0;background:#0A0E1CF8;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.rbox{background:var(--panel);border-top:1px solid var(--brass);width:100%;max-width:520px;max-height:94dvh;display:flex;flex-direction:column;overflow:hidden}
.champ{padding:16px 18px 13px;border-bottom:1px solid var(--line);text-align:center}
.champ .lbl{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
.champ .cn{font-size:clamp(29px,10vw,42px);line-height:1.05;margin:3px 0}
.champ .cs{font-size:11.5px;color:var(--slate)}
.champ.you .cn{color:var(--brass)}
.mine{padding:11px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.mine .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:block}
.mine .v{font-size:20px}
.mine .pos{margin-left:auto;text-align:right}
.rec{padding:9px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;font-size:12px;color:var(--slate)}
.rec .v{margin-left:auto;font-size:19px;color:var(--brass)}
.chart{margin:0 12px;background:var(--ink);border-radius:var(--r);padding:6px 2px}
.tabs{display:flex;gap:4px;padding:9px 12px 0}
.tabs button{padding:6px 13px;font-size:12px;color:var(--slate);border:1px solid var(--line);
border-bottom:none;border-radius:var(--r) var(--r) 0 0;background:var(--ink)}
.tabs button.on{color:var(--brass);background:var(--panel);border-color:var(--brass)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.results table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.results th{position:sticky;top:0;background:var(--panel);text-align:right;padding:8px 9px;font-weight:500;
font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);cursor:pointer;
white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
.results th.s{color:var(--brass)}
.results td{padding:6px 9px;text-align:right;border-bottom:1px solid #1A2237;white-space:nowrap}
.results th:nth-child(2),.results td:nth-child(2){text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
.results tr.win td{color:var(--brass)}
.results tr.me td,.results tr.me td:nth-child(2){background:#243259;color:var(--chalk)}
.rfoot{padding:11px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--slate);text-align:center}
</style>
</head>
<body>
<div id="root"></div>
<p class="sr" id="sr" aria-live="assertive"></p>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { socket, setGameId, gameId, myToken, saveToken, armAt, disarm, attemptBuzz,
         lockoutRemaining, startLatencyReports, syncClock,
         getLag, setLag, fmt, ord } from '/rumble.js';
import { scoreChart } from '/chart.js';
// The line-art weapons are gone: everyone sees wrestlers now, including the
// player themselves.
import { avatar, distinctLook } from '/wrestlers.js';
import { animation as tossAnimation, SECONDS as TOSS_SECONDS } from '/toss.js';
import { markFull } from '/brand.js';
import * as sfx from '/sound.js';

// /j/CODE prefills the code; /join leaves it blank. Either way the player
// confirms it, so a stray link can't drop somebody into the wrong room.
setGameId((location.pathname.split('/')[2] || '').toUpperCase());

let V = null, prev = null, joined = false, joinErr = '';
let lastCountdown = null;
let armTimer = null, armed = false, early = false, earlyTimer = null;
const root = document.getElementById('root');

// The lag trim, which a player reported as doing nothing.
//
// It works — 0, 100 and 1000ms all arm exactly when they should. What it lacked
// was any sign of it: the lights on the shared screen arrive at the same moment
// whatever you set, because the trim only moves your own buzzer, and at a large
// positive value every press lands before your arm and becomes a lockout rather
// than a slow buzz. Both read as "nothing happened".
// Entrance music. Plays through whichever screen in the room has sound on, so
// there is nothing to hear on this device — the picker says so rather than
// leaving somebody tapping preview and wondering.
let myTheme = null, themeList = null;
try { myTheme = JSON.parse(localStorage.getItem('rumble:theme') || 'null'); } catch (e) {}

function themeLabel() {
  if (!myTheme) return 'Pick your entrance music';
  if (myTheme.kind === 'youtube') return 'Your music: a YouTube clip';
  if (myTheme.kind === 'url') return 'Your music: a link';
  const t = (themeList || []).find((x) => x.key === myTheme.key);
  return 'Your music: ' + (t ? t.title : myTheme.key);
}

async function openMusic() {
  let chosen = null;
  if (!themeList) {
    try { themeList = (await (await fetch('/api/themes')).json()).themes || []; }
    catch { themeList = []; }
  }
  const byMood = {};
  for (const t of themeList) (byMood[t.mood] ??= []).push(t);
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="sbox">
    <h3>Entrance music</h3>
    <p class="snote">Plays on the screen with sound turned on when you walk in.
      You will not hear it on this device.</p>
    ${Object.entries(byMood).map(([mood, list]) => `<div class="smood">${mood}</div>
      <div class="sgrid">${list.map((t) => `<button data-key="${t.key}"
        class="schip${myTheme && myTheme.key === t.key ? ' on' : ''}">${t.title}</button>`).join('')}</div>`).join('')}
    <div class="smood">Your own</div>
    <input type="text" id="tlink" placeholder="Paste a YouTube link"
           value="${myTheme && myTheme.kind === 'youtube'
             ? 'https://youtu.be/' + myTheme.id : ''}" autocomplete="off">
    <div class="srow"><label>Start at</label>
      <input type="number" id="tstart" min="0" value="${myTheme?.start || 0}"> seconds</div>
    <p class="snote" style="margin:14px 0 0">Tap a theme to hear it. Nothing is
      saved until you press Save.</p>
    <div class="sbtns">
      <button id="tnone">No music</button>
      <button id="tsave" class="prim">Save</button>
    </div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = (ev) => { if (ev.target === el) el.remove(); };

  // Clicking a chip plays it here, on this device, so you can hear what you are
  // choosing. The room only ever hears it on the screen with sound enabled, but
  // picking blind was silly.
  let preview = null;
  const stopPreview = () => { if (preview) { preview.pause(); preview = null; } };
  for (const b of el.querySelectorAll('.schip')) {
    b.onclick = () => {
      for (const o of el.querySelectorAll('.schip')) o.classList.remove('on');
      b.classList.add('on');
      stopPreview();
      preview = new Audio(`/audio/themes/${b.dataset.key}.mp3`);
      preview.volume = 0.8;
      preview.play().catch(() => {});
      chosen = { kind: 'library', key: b.dataset.key };
    };
  }
  el.addEventListener('remove', stopPreview);
  const origRemove = el.remove.bind(el);
  el.remove = () => { stopPreview(); origRemove(); };
  el.querySelector('#tnone').onclick = () => save(null, el);
  el.querySelector('#tsave').onclick = () => {
    // A library pick made by ear wins over a stale link in the box.
    if (chosen) return save(chosen, el);
    const raw = el.querySelector('#tlink').value.trim();
    if (!raw) return save(null, el);
    const id = (raw.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/) || [])[1];
    if (!id) { el.querySelector('#tlink').classList.add('bad'); return; }
    save({ kind: 'youtube', id, start: +el.querySelector('#tstart').value || 0 }, el);
  };
}

function save(theme, el) {
  // Before joining there is no match on the server to attach a theme to, so
  // hold it here and send it with the join. Asking the server produced a bare
  // "no match" on every choice made from the sign-in card.
  if (!myToken()) {
    myTheme = theme;
    try { localStorage.setItem('rumble:theme', JSON.stringify(theme)); } catch (e) {}
    el.remove();
    renderJoin();      // the sign-in card carries the label too
    return;
  }
  socket.emit('set-theme', { theme }, (r) => {
    if (r && r.ok) { myTheme = r.theme; el.remove(); render(); }
    else if (r && r.error) alert(r.error);
  });
}

// --- stables --------------------------------------------------------------

const stableName = (id) => ((V.stables || []).find((s2) => s2.id === id) || {}).name || 'your stable';

function stableSheet() {
  const list = V.stables || [];
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="sbox">
    <h3>Stables</h3>
    <p class="snote">In a stable, the damage you do lands only on people outside
      it — your side pays nothing. Leaving again means betrayal.</p>
    ${list.length ? `<div class="smood">Join one</div><div class="sgrid">
      ${list.map((s2) => `<button class="schip" data-join="${s2.id}">${s2.name}
        <span class="fh">${s2.members.length} in</span></button>`).join('')}</div>` : ''}
    <div class="smood">Start your own</div>
    <input type="text" id="stname" placeholder="Name it" maxlength="24" autocomplete="off">
    <div class="err" id="sterr"></div>
    <div class="sbtns"><button id="stcancel">Never mind</button>
      <button id="stmake" class="prim">Found it</button></div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = (ev) => { if (ev.target === el) el.remove(); };
  el.querySelector('#stcancel').onclick = () => el.remove();
  for (const b of el.querySelectorAll('[data-join]')) {
    b.onclick = () => socket.emit('join-stable', { id: b.dataset.join }, (r) => {
      if (r && r.error) el.querySelector('#sterr').textContent = r.error;
      else { el.remove(); say(`You are with ${r.name}`); }
    });
  }
  el.querySelector('#stmake').onclick = () => {
    const nm = el.querySelector('#stname').value.trim();
    socket.emit('make-stable', { name: nm }, (r) => {
      if (r && r.error) el.querySelector('#sterr').textContent = r.error;
      else { el.remove(); say(`${r.name} is yours`); }
    });
  };
  el.querySelector('#stname').focus();
}

function betraySheet(you) {
  const list = (V.stables || []).filter((s2) => s2.id !== you.stable);
  const mine = (V.stables || []).find((s2) => s2.id === you.stable);
  const others = (mine ? mine.members : []).filter((mm) => mm.token !== you.token
    && mm.state === 'live');
  const each = others.length ? Math.round((you.score || 0) / others.length) : 0;
  const el = document.createElement('div');
  el.className = 'sheet';
  el.innerHTML = `<div class="sbox">
    <h3>Betray ${stableName(you.stable)}?</h3>
    <p class="snote">${others.length
      ? `Your whole stack — ${(you.score || 0).toLocaleString()} — is split among
         the ${others.length} you walk out on, ${each.toLocaleString()} each.
         You leave with nothing.`
      : 'There is nobody left in it, so this costs you nothing.'}</p>
    ${list.length ? `<div class="smood">Go to</div><div class="sgrid">
      ${list.map((s2) => `<button class="schip" data-to="${s2.id}">${s2.name}</button>`).join('')}
      </div>` : ''}
    <div class="err" id="bterr"></div>
    <div class="sbtns"><button id="btcancel">Stay loyal</button>
      <button id="btstag" class="prim">Go stag</button></div>
  </div>`;
  document.body.appendChild(el);
  el.onclick = (ev) => { if (ev.target === el) el.remove(); };
  const go = (id) => socket.emit('betray', { id }, (r) => {
    if (r && r.error) el.querySelector('#bterr').textContent = r.error;
    else { el.remove(); say(r.to ? `You are with ${r.toName} now` : 'You are on your own'); }
  });
  el.querySelector('#btcancel').onclick = () => el.remove();
  el.querySelector('#btstag').onclick = () => go(null);
  for (const b of el.querySelectorAll('[data-to]')) b.onclick = () => go(b.dataset.to);
}

function lagHint() {
  const v = getLag();
  if (v === 0) return 'buzzing too early? raise this';
  if (v > 0) {
    return `your buzzer arms ${v}ms after the lights`
      + (v >= 400 ? ' \u2014 that is a lot; presses before then are lockouts' : '');
  }
  return `your buzzer arms ${-v}ms before the lights`;
}

// Shown after each arm so the trim is observably doing something.
function noteArm(waitMs) {
  const el = document.getElementById('lastarm');
  if (!el) return;
  el.textContent = getLag() === 0 ? ''
    : `last clue: armed ${Math.round(waitMs)}ms after the signal`;
}

// Full mode: the board alongside the buzzer, for a player who is not looking at
// a shared screen.
//
// Desktop only, deliberately. A Jeopardy! board at phone width is unreadable,
// and the buzzer is the thing that has to work on a phone — asking it to also
// render a six-column board during a race is the wrong trade on the device
// where 150ms decides the match.
// Gated on width, and on the primary pointer NOT being coarse — which excludes
// phones and tablets without also excluding anything unusual. Testing for
// `pointer: fine` instead looked equivalent and was not: a browser that reports
// no pointer at all fails it, and the feature vanishes with no explanation.
const CAN_FULL = window.matchMedia('(min-width: 900px)').matches
  && !window.matchMedia('(pointer: coarse)').matches;
let full = CAN_FULL && localStorage.getItem('rumble-full') === '1';

// An escape hatch, because the setting is remembered per device: if full mode
// ever renders badly the toggle to turn it off is inside the thing that broke.
// Adding ?light to the address forces light mode and forgets the preference.
if (/[?&]light\b/.test(location.search)) {
  full = false;
  localStorage.setItem('rumble-full', '0');
}
let W = null;                       // the watch view, when full mode is on

// Entrances and tosses in full mode, worked out by diffing the board feed the
// same way the watch screen does. A player with the board up should see
// somebody thrown out of the ring, not just a number change.
let prevRing = null, cornerTimer = null;

function boardCorner(kind, caption, who) {
  let box = document.getElementById('bcorner');
  if (!box) {
    box = document.createElement('div');
    box.id = 'bcorner'; box.className = 'bcorner';
    document.body.appendChild(box);
  }
  clearTimeout(cornerTimer);
  box.innerHTML = tossAnimation(kind, 140, who || {})
    + `<div class="bcap ${kind}">${caption}</div>`;
  box.classList.add('on');
  cornerTimer = setTimeout(() => box.classList.remove('on'),
    TOSS_SECONDS[kind] * 1000 + 700);
}

function detectRing(next) {
  const live = next.live || [];
  if (!prevRing) { prevRing = live; return; }
  const was = new Map(prevRing.map((p) => [p.token, p]));
  const now = new Map(live.map((p) => [p.token, p]));
  const gone = prevRing.filter((p) => !now.has(p.token));
  const came = live.filter((p) => !was.has(p.token));
  if (gone.length) {
    boardCorner('toss', gone.length === 1 ? `${gone[0].name} is out`
      : `${gone.length} out at once`, { victim: gone[0].look || null });
  } else if (came.length) {
    boardCorner('entry', came.length === 1 ? `${came[0].name} enters`
      : `${came.length} enter`, { entrant: came[0].look || null });
  }
  prevRing = live;
}

socket.on('watch-state', (s2) => { detectRing(s2); W = s2; paintBoard(); });

// Once we know who we are, honour a full-mode preference from a previous
// session — the label alone was not enough to actually get the board.
let fullApplied = false;
socket.on('state', () => {
  if (!fullApplied && myToken()) { fullApplied = true; applyStoredFull(); }
});

// Applied on load as well as on click. The stored preference set the label to
// "Hide the board" while no board had been asked for, so the first press
// appeared to do nothing.
function applyStoredFull() {
  if (!full) return;
  document.body.classList.add('full');
  socket.emit('want-board', { on: true });
}

function setFull(on) {
  full = !!on && CAN_FULL;
  localStorage.setItem('rumble-full', full ? '1' : '0');
  socket.emit('want-board', { on: full });
  if (!full) W = null;
  document.body.classList.toggle('full', full);
  render();
}

const money = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString();

function boardHtml() {
  if (!full) return '';
  if (!W) return '<aside class="board"><div class="bwait">Loading the board...</div></aside>';
  const cols = (W.board || []).map((c) => '<div class="bcol">'
    + `<div class="bcat" title="${c.title}"><span>${c.title}</span></div>`
    // Same as the console: keep the value so the cell keeps its size, and let
    // .gone make it transparent.
    // 'played', not 'gone': .gone already exists on this page as the
    // full-screen overlay for an eliminated player, and a cell that inherited
    // position:absolute;inset:0 turned the whole window solid blue.
    + c.clues.map((x) => `<div class="bcell${x.revealed ? ' played' : ''}">`
        + '$' + x.value + '</div>').join('')
    + '</div>').join('');
  const ring = (W.live || []).map((p) => `<div class="brow">`
    + `<span class="bd">${p.draw}</span><span class="bn">${p.name}</span>`
    + `<span class="bs num">${money(p.score)}</span></div>`).join('');
  const clue = W.clue
    ? `<div class="bclue"><div class="bmeta">${W.clue.category} &middot; $${W.clue.value}</div>`
      + `<div class="btext">${W.clue.text || ''}</div></div>`
    : '';
  return `<aside class="board">${clue || '<div class="bgrid">' + cols + '</div>'}
    <div class="bring">${ring}</div></aside>`;
}

function paintBoard() {
  const el = document.querySelector('.board');
  if (el) el.outerHTML = boardHtml();
}
const say = (m) => { document.getElementById('sr').textContent = m; };

// ---------------- join ----------------
function renderJoin() {
  root.innerHTML = `<div class="join">
    <div class="brandmark">${markFull(104)}</div>
    <div class="sub">Enter the room code your host read out, and the name you want on the board.</div>
    <input id="cd" class="code4" placeholder="CODE" maxlength="4" autocomplete="off"
      autocapitalize="characters" spellcheck="false" value="${gameId() || ''}">
    <div class="idrow">
      <label class="pic" id="piclab">
        <input type="file" id="pic" accept="image/*" hidden>
        <span class="picinner" id="picinner">+<br><span class="pict">photo</span></span>
      </label>
      <button class="tokbtn" id="tokbtn" type="button"></button>
    </div>
    <div class="tokhint">Pick a token, or add a photo of your own.</div>
    <input id="nm" placeholder="Your name" maxlength="18" autocomplete="off" autocapitalize="words">
    <button id="go" disabled>Join</button>
    <button class="fullbtn joinmusic" id="musicjoin" type="button">${themeLabel()}
      <span class="fh">plays on the shared screen when you walk in</span></button>
    <a class="backhome" href="/">&larr; Back</a>
    ${joinErr ? `<div class="err">${joinErr}</div>` : ''}
    <div class="rules">
      <div class="rt">How it works</div>
      <ul>
        <li>Three players start. More come in as the match goes on — you'll see a countdown to your entry.</li>
        <li>Get a clue right and <b>every other player pays you</b> its value. You collect from all of them.</li>
        <li>Get it wrong and you lose the value and sit out the rest of that clue. Someone else can still take it — and you'd pay them too.</li>
        <li>If nobody gets it, everyone loses half.</li>
        <li>Drop below zero and you're out. Zero is still alive.</li>
        <li>There's a score ceiling, and it falls as the match goes on.</li>
        <li>Last one standing wins. Everything else is for bragging.</li>
      </ul>
      <div class="rf">Buzz with the big button or the space bar. Buzzing before the lights costs you 250&nbsp;ms.</div>
    </div>
    <div class="sub" style="font-size:11.5px">Keep this page open — it's your buzzer.</div>
  </div>`;
  const cd = document.getElementById('cd'), nm = document.getElementById('nm'), go = document.getElementById('go');
  const saved = localStorage.getItem(`rumble:name`);
  if (saved) nm.value = saved;
  const ok = () => cd.value.trim().length === 4 && nm.value.trim().length > 0;
  const sync = () => { go.disabled = !ok(); };
  cd.oninput = () => { cd.value = cd.value.toUpperCase().replace(/[^A-Z]/g, ''); sync(); };
  nm.oninput = sync; sync();
  [cd, nm].forEach((el) => el.onkeydown = (e) => { if (e.key === 'Enter' && ok()) go.click(); });
  go.onclick = () => {
    setGameId(cd.value.trim().toUpperCase());
    const name = nm.value.trim();
    try { localStorage.setItem('rumble:name', name); } catch (e) {}
    doJoin(name);
  };
  // A token is assigned from the player's own id, so everyone starts with one
  // rather than a blank circle. They can change it, and the choice sticks.
  // The server assigns one on join and settles collisions, so the local copy
  // is only a preference to ask for — never the last word.
  try {
    const saved = JSON.parse(localStorage.getItem('rumble:art') || 'null');
    if (saved && saved.art) myArt = saved;
  } catch (e) {}
  // Deliberately left null when the player has no saved choice. Defaulting to
  // TOKEN_NAMES[0] meant every first-timer *asked* the server for a crowbar,
  // and the server politely gave each of them a crowbar in a different colour —
  // so a field of three showed three crowbars when 24 shapes were free. Say
  // nothing and the server's own assignment stands.
  paintToken();
  document.getElementById('tokbtn').onclick = pickToken;
  const mj = document.getElementById('musicjoin');
  // Choosing before the match starts is the natural moment — you are already
  // fiddling with your name and your wrestler.
  if (mj) mj.onclick = openMusic;

  const cached = localStorage.getItem('rumble:avatar');
  if (cached) setPicPreview(cached);
  document.getElementById('pic').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    try {
      const url = await squareThumb(f, 128);
      try { localStorage.setItem('rumble:avatar', url); } catch (err) {}
      setPicPreview(url);
    } catch (err) { joinErr = "couldn't read that image"; sfx.preload();
renderJoin(); }
  };
  setTimeout(() => (cd.value ? nm : cd).focus(), 60);
}

let myArt = null;      // kept only so old saved preferences load without error

// The wrestler is chosen before joining, so a player picks their own figure
// rather than being handed one. The server still has the last word — it keeps
// looks distinct across the room — but it starts from this.
let myLook = null;
try { myLook = JSON.parse(localStorage.getItem('rumble:look') || 'null'); } catch (e) {}
if (!myLook) myLook = distinctLook(String(Math.random()), []);

function paintToken() {
  const b = document.getElementById('tokbtn');
  if (!b) return;
  // The wrestler, not a weapon. The line-art tokens were what players saw
  // while everyone else — the console, the watch screen, the animations — saw
  // wrestlers, so a player never recognised their own figure being thrown out
  // of the ring.
  const look = (V && V.you && V.you.look) || myLook;
  b.innerHTML = look ? avatar(look, 84) : '<span class="tokask">pick</span>';
}

function pickToken() {
  // One tap, another wrestler. A grid of every possible combination would be
  // thousands of tiles; rerolling until you like one is the same job in less
  // space, and the server keeps it distinct from everybody else's.
  const b = document.getElementById('tokbtn');
  // Before joining there is no server to ask, so roll it here.
  // myToken is a function; calling it is the difference between "not joined"
  // and "always truthy".
  if (!myToken()) {
    myLook = distinctLook(String(Math.random()), [myLook]);
    try { localStorage.setItem('rumble:look', JSON.stringify(myLook)); } catch (e) {}
    return paintToken();
  }
  if (b) b.classList.add('rolling');
  socket.emit('reroll-look', {}, (r) => {
    if (b) b.classList.remove('rolling');
    if (r && r.look) {
      myLook = r.look;
      try { localStorage.setItem('rumble:look', JSON.stringify(myLook)); } catch (e) {}
      paintToken();
    }
  });
}

function setPicPreview(url) {
  const lab = document.getElementById('piclab');
  if (!lab) return;
  lab.classList.add('set');
  lab.innerHTML = `<input type="file" id="pic" accept="image/*" hidden><img src="${url}" alt="">`;
  lab.querySelector('#pic').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const u = await squareThumb(f, 128);
    try { localStorage.setItem('rumble:avatar', u); } catch (err) {}
    setPicPreview(u);
  };
}

// Phone cameras produce multi-megabyte images. Crop to a square and scale to
// 128px on the device, so what crosses the wire is a few kilobytes.
function squareThumb(file, size) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}

function doJoin(name) {
  socket.emit('join', { gameId: gameId(), token: myToken(), name, look: myLook,
    theme: myTheme }, (r) => {
    if (r && r.error) { joinErr = r.error; joined = false; return sfx.preload();
renderJoin(); }
    if (r && r.token) saveToken(r.token);
    joined = true; joinErr = '';
    sfx.unlock();
    // Their own confirmation that they are in the room.
    // Deliberately no sound here. Arriving at your own join is not an event
    // the room needs marking; the cues belong to the match, not the menus.
    const av = localStorage.getItem('rumble:avatar');
    if (av) socket.emit('avatar', { dataUrl: av });
    // Only ask for something the player actually chose.
    if (myArt) socket.emit('token-art', myArt, (settled) => {
      if (settled && settled.art) {
        myArt = settled;
        try { localStorage.setItem('rumble:art', JSON.stringify(myArt)); } catch (e) {}
        paintToken();
      }
    });
    V = r.state; render();
    startLatencyReports();
  });
}

// ---------------- socket ----------------
socket.on('connect', () => {
  syncClock();
  // A stored token means we've joined this match before — rejoin silently so
  // a refresh or a dropped connection doesn't cost anyone their place.
  const t = myToken(), n = localStorage.getItem('rumble:name');
  if (gameId() && t && n) doJoin(n); else sfx.preload();
renderJoin();
});
socket.on('disconnect', () => { armed = false; disarm(); render(); });
socket.on('state', (v) => {
  prev = V; V = v;
  // The server assigns on arrival; reflect it without claiming it as a choice.
  if (v.you && v.you.tokenArt) paintToken();
  if (joined) { cues(); render(); }
});

socket.on('rumble-starting', () => sfx.unlock());

// Sound and colour are driven off state transitions, so a reconnect can't
// replay a horn that already sounded.
function cues() {
  const you = V.you || {}, was = prev && prev.you ? prev.you : null;
  if (!was) return;
  if (was.state === 'queued' && you.state === 'live') { sfx.play('entry'); lastCountdown = null; }
  if (was.state === 'live' && you.state === 'eliminated') sfx.chops(1);
  const n = you.state === 'queued' ? you.cluesToEntry : null;
  if (n !== null && n <= 3 && n >= 1 && n !== lastCountdown) {
    lastCountdown = n;
    sfx.play('count' + (4 - n));       // 3 clues out is the lowest tone
  }
  if (n === null || n > 3) lastCountdown = null;
}

socket.on('rumble-starting', (d) => {
  const o = document.createElement('div'); o.className = 'gone';
  o.innerHTML = `<div class="h mq" style="color:var(--brass)">HERE WE GO</div>
    <div class="s">${d.players} players. Three start, the rest come in every ${d.entryInterval} clues.
    Everyone enters with ${fmt(d.startScore)}.</div>`;
  o.onclick = () => o.remove();
  document.body.appendChild(o);
  setTimeout(() => o.remove(), 5000);
  say('The Rumble is beginning');
});

socket.on('clue-shown', () => { armed = false; early = false; disarm(); render(); });
socket.on('activate-buzzers', ({ at, lockout }) => {
  const waitMs = armAt(at, lockout);
  armed = false; early = false; render();
  clearTimeout(armTimer);
  armTimer = setTimeout(() => {
    armed = true; render(); noteArm(waitMs); say('Buzzers live');
  }, waitMs);
  // Say so up front too, rather than only after the wait.
  if (getLag() !== 0) noteArm(waitMs);
});

// ---------------- buzz ----------------
function press() {
  if (!V || !V.you) return;
  const r = attemptBuzz();
  if (r === 'early') {
    early = true; render();
    say(`Too early. Locked out ${V.lockout || 250} milliseconds.`);
    clearTimeout(earlyTimer);
    earlyTimer = setTimeout(() => {
      early = false; render();
      // The lights may have come on while the penalty was running.
      if (armed && V.buzzOpen) say('Buzzers live');
    }, lockoutRemaining() || (V.lockout || 250));
  } else if (r === 'sent') { render(); }
}
addEventListener('keydown', (e) => {
  if (!joined || document.querySelector('.results') || document.querySelector('.picker')) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (e.code === 'Space') { e.preventDefault(); press(); return; }
  const you = (V && V.you) || {}, M = (V && V.mechanics) || {};
  const k = (e.key || '').toLowerCase();
  // J to join or found, B to betray. Between clues only — switching sides
  // mid-race would let you see who had buzzed and pick a side accordingly.
  if (k === 'j' && M.stables && you.state === 'live' && !V.clueUp && !you.stable) {
    e.preventDefault(); return stableSheet();
  }
  if (k === 'b' && M.stables && you.state === 'live' && !V.clueUp && you.stable) {
    e.preventDefault(); return betraySheet(you);
  }

  if (k === 'r' && M.topRope && you.state === 'live' && !V.clueUp
      && (you.topRope || !(you.topRopeWait > 0))) {
    e.preventDefault(); socket.emit('top-rope', { on: !you.topRope });
  } else if (k === 't' && M.targeting && you.state === 'live') {
    e.preventDefault(); pickTarget(you);
  } else if (k === 'b' && M.bounties && you.state === 'queued') {
    e.preventDefault(); pickBounty(you);
  }
});

socket.on('targeted', ({ by }) => {
  sfx.play('lock');
  say(`${by} is aiming at you`);
});
// Your own longevity payment. This only ever fires for one person, so it can
// afford to be more than a flicker.
socket.on('resolved', (e) => {
  const mine = (e.longevity || []).find((g) => g.playerId === myToken());
  if (mine) flash(`+${fmt(mine.amount)}`, 'still standing', 'paid');
  if (e.sweep && e.sweep.playerId === myToken()) {
    flash(`+${fmt(e.sweep.bonus)}`, 'you swept ' + e.sweep.category, 'swept');
  }
  const saved = (e.saved || []).find((x) => x.playerId === myToken());
  if (saved) flash(fmt(saved.total), 'bought back in', 'saved');
});

function flash(big, small, kind) {
  document.querySelectorAll('.bonus').forEach((n) => n.remove());
  const d = document.createElement('div');
  d.className = 'bonus ' + kind;
  d.innerHTML = `<span class="bg mq num">${big}</span><span class="bs">${small}</span>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 2200);
}

socket.on('revived', ({ stake }) => {
  sfx.play('entry');
  say(`You are back in the queue with ${stake.toLocaleString()}`);
});

// ---------------- render ----------------
function render() {
  if (!joined || !V) return sfx.preload();
renderJoin();
  if (V.phase === 'over') return renderResults();
  const you = V.you || {};
  const st = you.state || 'lobby';

  const soon = st === 'queued' && you.cluesToEntry != null && you.cluesToEntry <= 3;
  root.innerHTML = `<div class="app${soon ? (you.cluesToEntry === 1 ? ' soon1' : ' soon') : ''}">
    ${soon ? `<div class="callup${you.cluesToEntry === 1 ? ' p' : ''}">ENTERING THE RING IN ${
      you.cluesToEntry} CLUE${you.cluesToEntry > 1 ? 'S' : ''}</div>` : ''}
    ${(you.targetedBy || []).length ? `<div class="hunted">${
      you.targetedBy.length > 1 ? `${you.targetedBy.length} PLAYERS ARE AIMING AT YOU`
        : `${you.targetedBy[0].toUpperCase()} IS AIMING AT YOU`}</div>` : ''}
    <header class="hd">
      ${st === 'lobby' ? '' : `<span class="dr mq num">${you.draw ?? ''}</span>`}
      <span class="nm">${you.name || ''}</span>
      <span class="dot ${socket.connected ? 'on' : ''}"></span>
      <span class="badge ${st === 'live' ? 'live' : st === 'queued' ? 'queued' : st === 'eliminated' ? 'out' : ''}">${
        st === 'live' ? 'In the ring' : st === 'queued' ? 'In the queue'
        : st === 'eliminated' ? 'Eliminated' : 'Waiting'}</span>
    </header>
    <section class="meter" id="meter"></section>
    <section class="pad">
      <button class="buzz" id="buzz"><span class="big mq" id="bzbig">WAIT</span><span id="bzsub"></span></button>
      <div class="fb" id="fb"></div>
      <div class="mech" id="mech"></div>
    </section>
  </div>${boardHtml()}`;

  renderMeter(st, you);
  renderBuzz(st, you);
  renderFb(you);
  document.getElementById('buzz').onpointerdown = (e) => { e.preventDefault(); press(); };
  renderMech(st, you);
  const fb2 = document.getElementById('fullbtn');
  if (fb2) fb2.onclick = () => setFull(!full);
  const mb = document.getElementById('musicbtn');
  if (mb) mb.onclick = openMusic;
  const sb = document.getElementById('m-stable');
  if (sb) sb.onclick = stableSheet;
  const bb = document.getElementById('m-betray');
  if (bb) bb.onclick = () => betraySheet(you);
  maybeGone(st, you);
}

function renderMeter(st, you) {
  const m = document.getElementById('meter');
  if (st === 'lobby') {
    m.innerHTML = `<div class="cd"><span class="k">Waiting to start</span>
      <span class="n mq num">${V.roster || 0}</span>
      <span class="sub">${V.roster === 1 ? 'player' : 'players'} in the lobby</span></div>
      <a class="watchlink" href="/watch/${gameId()}" target="_blank" rel="noopener">
        Open the board on another screen &#8599;</a>`;
  } else if (st === 'queued') {
    // The number is this player's own entry, not the next entry in the match.
    // Showing the queue position alongside it makes that unambiguous.
    const ahead = (you.queuePlace ?? 1) - 1;
    m.innerHTML = `<div class="cd"><span class="k">Clues until you're in</span>
      <span class="n mq num">${you.cluesToEntry ?? '—'}</span>
      <span class="sub">${ahead > 0
        ? `${ahead} ${ahead === 1 ? 'player goes' : 'players go'} in before you &middot; `
        : "you're next in &middot; "}you enter with ${fmt(you.entryStake)}</span></div>`;
  } else if (st === 'eliminated') {
    m.innerHTML = `<span class="k">You're out</span>
      <div class="score mq num">${you.tenure}</div>
      <div class="ceil">clues survived${you.pins ? ` · ${you.pins} toss out${you.pins > 1 ? 's' : ''}` : ''}</div>`;
  } else {
    m.innerHTML = `<span class="k">Your score</span>
      <div class="score mq num" id="sc">${fmt(you.score)}</div>
      <div class="ceil">Ceiling <b class="num">${fmt(V.ceiling)}</b>${you.capped ? " · you're capped" : ''}</div>
      <span class="delta mq num" id="delta"></span>`;
    flashScore(you);
  }
}

// The score bleeds on nearly every clue. Showing the delta is the whole
// emotional texture of this format, so it gets an animation of its own.
function flashScore(you) {
  const before = prev && prev.you ? prev.you.score : null;
  if (before == null || before === you.score) return;
  const d = you.score - before, el = document.getElementById('sc'), dl = document.getElementById('delta');
  if (!el || !dl) return;
  const cls = d < 0 ? 'dn' : 'up';
  el.classList.add(cls); setTimeout(() => el.classList.remove(cls), 450);
  dl.textContent = (d < 0 ? '−' : '+') + fmt(Math.abs(d));
  dl.style.color = d < 0 ? 'var(--alarm)' : 'var(--live)';
  dl.classList.remove('go'); void dl.offsetWidth; dl.classList.add('go');
}

function renderBuzz(st, you) {
  const b = document.getElementById('buzz'), big = document.getElementById('bzbig'), sub = document.getElementById('bzsub');
  b.className = 'buzz'; b.disabled = false; sub.textContent = '';
  const spectator = st !== 'live';
  if (st === 'lobby') { big.textContent = 'WAIT'; sub.textContent = 'match not started'; b.disabled = true; return; }
  if (you.lockedOut) { b.classList.add('locked'); big.textContent = 'LOCKED OUT';
    sub.textContent = 'you missed this clue'; b.disabled = true; return; }
  if (early) { b.classList.add('early'); big.textContent = 'TOO EARLY';
    sub.textContent = `${V.lockout || 250} ms penalty`; return; }
  if (V.myBuzz) { b.classList.add('sent'); big.textContent = spectator ? 'SENT' : 'IN';
    if (spectator) sub.textContent = 'warm-up only'; return; }
  if (armed && V.buzzOpen) { b.classList.add(spectator ? 'spec' : 'armed');
    big.textContent = 'BUZZ'; if (spectator) sub.textContent = 'not scored'; return; }
  if (spectator) { b.classList.add('spec'); big.textContent = 'WARM UP'; sub.textContent = 'not scored'; return; }
  big.textContent = 'WAIT'; sub.textContent = V.clueUp ? 'listen for the clue' : 'next clue coming';
}

function renderFb(you) {
  const fb = document.getElementById('fb');
  if (V.myBuzz) {
    const { ms, place, outOf } = V.myBuzz;
    const spectator = (you.state || '') !== 'live';
    fb.innerHTML = `<div class="t num">${ms.toFixed(1)}<span class="u"> ms</span></div>
      <div class="p">${place === 1 && !spectator ? '<b>You got in first</b>'
        : `<b>${ord(place)}</b> of ${outOf}${spectator ? " — if you'd been in" : ''}`}</div>`;
  } else if (you.lockedOut) {
    fb.innerHTML = `<div class="warn">Out of this clue. Your score drops when it resolves.</div>`;
  } else fb.innerHTML = '';
}

function renderMech(st, you) {
  const m = document.getElementById('mech');
  if (!m) return;
  const M = V.mechanics || {};
  const parts = [];
  if (M.topRope && st === 'live') {
    // Cooling down after a climb. Say how long rather than just greying out —
    // a dead button with no reason reads as a bug.
    const wait = you.topRopeWait || 0;
    const blocked = V.clueUp || (wait > 0 && !you.topRope);
    parts.push(`<button class="mbtn${you.topRope ? ' on' : ''}${wait > 0 && !you.topRope ? ' cooling' : ''}"
      id="m-rope" ${blocked ? 'disabled' : ''}>
      ${you.topRope ? 'ON THE TOP ROPE'
        : wait > 0 ? `Ropes ready in ${wait}`
        : 'Go to the top rope'}<span class="k">R</span></button>`);
  }
  if (M.targeting && st === 'live') {
    const t = (V.ring || []).find((x) => x.token === you.target);
    parts.push(`<button class="mbtn${you.target ? ' lockon' : ''}" id="m-target">
      ${t ? 'Aiming at ' + t.name : 'Take aim'}<span class="k">T</span></button>`);
  }
  if (M.bounties && st === 'queued' && (you.bountyCap - you.bountyPlaced) > 0) {
    parts.push(`<button class="mbtn" id="m-bounty">Place a bounty
      <span class="k">${(you.bountyCap - you.bountyPlaced).toLocaleString()} left</span></button>`);
  }
  if (M.bounties && you.bounty > 0) {
    parts.push(`<span class="mbtn lockon" style="cursor:default">
      ${you.bounty.toLocaleString()} on your head</span>`);
  }
  if (you.revivals > 0) {
    parts.push(`<span class="mbtn" style="cursor:default">Second life</span>`);
  }
  m.innerHTML = parts.join('') + `
    <div class="lagbox">
      <span class="lt">Lag compensation</span>
      <button class="lg" id="lag-">&minus;</button>
      <input class="lv" id="lagv" type="number" step="10" value="${getLag()}">
      <button class="lg" id="lag+">+</button>
      <span class="lt">ms</span>
      <span class="lh">${lagHint()}</span>
      <span class="lastarm" id="lastarm"></span>
    </div>
    ${M.stables && st === 'live' ? (you.stable
      ? `<button class="mbtn on" id="m-betray" ${V.clueUp ? 'disabled' : ''}>
           ${stableName(you.stable)}<span class="k">B</span></button>`
      : `<button class="mbtn" id="m-stable" ${V.clueUp ? 'disabled' : ''}>
           Join a stable<span class="k">J</span></button>`) : ''}
    <button class="fullbtn" id="musicbtn">
      ${themeLabel()}<span class="fh">entrance music</span></button>
    ${CAN_FULL ? `<button class="fullbtn${full ? ' on' : ''}" id="fullbtn">
      ${full ? 'Hide the board' : 'Show the board here'}
      <span class="fh">${full ? 'you are not sharing a screen'
        : 'for when nobody is screen-sharing'}</span></button>`
      : `<div class="fullno">The board needs a wider screen. On a phone, watch it
         on the shared screen or open the watch link on a laptop.</div>`}
    <a class="watchlink small" href="/watch/${gameId()}" target="_blank" rel="noopener">
      Open the board on another screen &#8599;</a>`;
  const q = (id) => document.getElementById(id);
  if (q('m-rope')) q('m-rope').onclick = () => {
    if (!you.topRope && (you.topRopeWait || 0) > 0) return;
    socket.emit('top-rope', { on: !you.topRope });
  };
  if (q('m-target')) q('m-target').onclick = () => pickTarget(you);
  if (q('m-bounty')) q('m-bounty').onclick = () => pickBounty(you);
  const lv = q('lagv');
  const applyLag = (v) => { setLag(v); renderMech(st, you); };
  if (q('lag-')) q('lag-').onclick = () => applyLag(getLag() - 10);
  if (q('lag+')) q('lag+').onclick = () => applyLag(getLag() + 10);
  if (lv) {
    lv.onchange = () => applyLag(Number(lv.value) || 0);
    lv.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); lv.blur(); } };
  }
}

// Numbered so it can be driven from the keyboard as well as tapped — the
// people on laptops will be faster with numbers.
function pickTarget(you) {
  const ring = (V.ring || []).filter((x) => x.token !== you.token);
  const el = document.createElement('div'); el.className = 'picker';
  el.innerHTML = `<div class="pbox"><h3>Take aim</h3>
    <div class="sub2">Win a clue and the whole pot comes out of them alone. Lose it to them and
    you pay the whole pot yourself.</div>
    ${ring.map((p, i) => `<button class="prow${you.target === p.token ? ' cur' : ''}" data-t="${p.token}">
      <span class="n">${i + 1}</span><span>${p.name}</span>
      <span class="sc2">${p.score.toLocaleString()}</span></button>`).join('')}
    <button class="prow" data-t=""><span class="n">0</span><span>Stop aiming</span></button></div>`;
  document.body.appendChild(el);
  const choose = (tok) => { socket.emit('set-target', { target: tok || null }); close(); };
  const close = () => { el.remove(); removeEventListener('keydown', key); };
  const key = (e) => {
    if (e.key === 'Escape') return close();
    const n = parseInt(e.key, 10);
    if (!isNaN(n)) { e.preventDefault(); choose(n === 0 ? '' : (ring[n - 1] || {}).token); }
  };
  addEventListener('keydown', key);
  el.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => choose(b.dataset.t));
  el.onclick = (e) => { if (e.target === el) close(); };
}

function pickBounty(you) {
  const ring = V.ring || [];
  const left = you.bountyCap - you.bountyPlaced;
  const el = document.createElement('div'); el.className = 'picker';
  el.innerHTML = `<div class="pbox"><h3>Place a bounty</h3>
    <div class="sub2">Paid out of your own stake, so you'll walk in lighter. Whoever knocks them
    out collects it. You have ${left.toLocaleString()} to spend.</div>
    ${ring.map((p, i) => `<button class="prow" data-t="${p.token}">
      <span class="n">${i + 1}</span><span>${p.name}</span>
      <span class="sc2">${p.score.toLocaleString()}${p.bounty ? ' \u00B7 ' + p.bounty.toLocaleString() + ' on' : ''}</span></button>`).join('')}
    <input type="number" id="bamt" placeholder="amount" value="${Math.min(500, left)}" min="1" max="${left}">
    <button class="go2" id="bgo">Place it</button></div>`;
  document.body.appendChild(el);
  let chosen = null;
  const close = () => el.remove();
  el.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => {
    chosen = b.dataset.t;
    el.querySelectorAll('.prow').forEach((x) => x.classList.remove('cur'));
    b.classList.add('cur');
  });
  el.querySelector('#bgo').onclick = () => {
    if (!chosen) return;
    const amt = Number(el.querySelector('#bamt').value);
    socket.emit('place-bounty', { target: chosen, amount: amt }, (r) => {
      if (r && r.error) { el.querySelector('.sub2').textContent = r.error;
        el.querySelector('.sub2').style.color = 'var(--alarm)'; }
      else close();
    });
  };
  el.onclick = (e) => { if (e.target === el) close(); };
}

let goneShown = false;
function maybeGone(st, you) {
  if (st !== 'eliminated' || goneShown) return;
  goneShown = true;
  const g = document.createElement('div'); g.className = 'gone';
  g.innerHTML = `<div class="h mq">ELIMINATED</div>
    <div class="s">Your score dropped below zero. You can keep buzzing to compare times, but nothing counts now.</div>
    <div class="st"><div><div class="v num">${you.tenure}</div><div class="k">clues survived</div></div>
    <div><div class="v num">${you.pins || 0}</div><div class="k">toss outs</div></div></div>`;
  g.onclick = () => g.remove();
  document.querySelector('.app').appendChild(g);
  setTimeout(() => g.remove(), 4600);
  say('You have been eliminated');
}

// ---------------- results ----------------
let rTab = 'match', rKey = 'tenure', rDir = -1;
const COLS = {
  match: [['draw','Draw'],['name','Player'],['tenure','Clues'],['outOrder','Out'],
    ['correct','Correct'],['missed','Missed'],['pins','Toss outs'],['drained','Drained'],['peak','Peak']],
  buzz: [['draw','Draw'],['name','Player'],['att','Attempts'],['early','Early'],
    ['won','Won'],['rate','Win rate'],['avg','Avg ms'],['best','Best ms']],
};
const val = (p, k) => k === 'rate' ? (p.att ? p.won / p.att : 0) : (p[k] ?? (k === 'outOrder' ? 999 : 0));
function cell(p, k) {
  if (k === 'name') return (p.winner ? '◆ ' : '') + p.name;
  if (k === 'outOrder') return p.outOrder ? ord(p.outOrder) : '—';
  if (k === 'rate') return p.att ? Math.round(p.won / p.att * 100) + '%' : '—';
  if (k === 'peak' || k === 'drained') return fmt(p[k]);
  if (k === 'avg' || k === 'best') return p[k] == null ? '—' : p[k].toFixed(1);
  return p[k];
}
function renderResults() {
  const rows = (V.standings || []).slice();
  const champ = rows.find((p) => p.winner);
  const me = rows.find((p) => p.token === (V.you && V.you.token));
  const cols = COLS[rTab];
  rows.sort((a, b) => {
    const x = val(a, rKey), y = val(b, rKey);
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * rDir || a.draw - b.draw;
  });
  const won = champ && me && champ.token === me.token;
  root.innerHTML = `<div class="results"><div class="rbox">
    <div class="champ${won ? ' you' : ''}">
      <div class="lbl">${won ? 'You are the last one standing' : 'Last one standing'}</div>
      <div class="cn mq">${champ ? champ.name : '—'}</div>
      <div class="cs">${champ ? `entry #${champ.draw} · ${champ.tenure} clues survived · ${champ.correct} correct · ${champ.pins} toss outs` : ''}</div>
    </div>
    ${!won && me ? `<div class="mine">
      <div><span class="k">You survived</span><span class="v num">${me.tenure} clues</span></div>
      <div class="pos"><span class="k">Went out</span><span class="v num">${me.outOrder ? ord(me.outOrder) : '—'}</span></div>
    </div>` : ''}
    ${V.fastest ? `<div class="rec"><span>Fastest buzz of the match</span>
      <span>${V.fastest.name}</span><span class="v num">${V.fastest.ms.toFixed(1)}</span></div>` : ''}
    ${V.history && V.history.length > 2 ? `<div class="chart">${
      scoreChart(V.history, V.draw || [], {
        winnerToken: champ && champ.token, meToken: V.you && V.you.token,
        width: 500, height: 190 })}</div>` : ''}
    <div class="tabs">
      <button data-t="match" class="${rTab === 'match' ? 'on' : ''}">Match</button>
      <button data-t="buzz" class="${rTab === 'buzz' ? 'on' : ''}">Buzzers</button></div>
    <div class="tw"><table><thead><tr>${cols.map(([k, lbl]) =>
      `<th data-k="${k}" class="${rKey === k ? 's' : ''}">${lbl}${rKey === k ? (rDir < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((p) => `<tr class="${p.winner ? 'win' : ''}${me && p.token === me.token ? ' me' : ''}">${
        cols.map(([k]) => `<td class="${k === 'name' ? '' : 'num'}">${cell(p, k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="rfoot">Tap a column to sort. Only the last one standing counts.</div>
    <a class="homebtn" href="/">Back to the front page</a>
  </div></div>`;
  root.querySelectorAll('th[data-k]').forEach((th) => th.onclick = () => {
    const k = th.dataset.k;
    if (k === rKey) rDir *= -1;
    else { rKey = k; rDir = (k === 'name' || k === 'draw' || k === 'best' || k === 'avg') ? 1 : -1; }
    renderResults();
  });
  root.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    if (b.dataset.t === rTab) return;
    rTab = b.dataset.t; rKey = rTab === 'match' ? 'tenure' : 'won'; rDir = -1; renderResults();
  });
  const mine = root.querySelector('tr.me');
  if (mine) mine.scrollIntoView({ block: 'center' });
}

sfx.preload();
sfx.armUnlock();
renderJoin();
</script>
</body>
</html>
