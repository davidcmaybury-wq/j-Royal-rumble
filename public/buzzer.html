<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>J! Royal Rumble — buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;
--chalk:#EEEBE1;--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:4px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;
-webkit-font-smoothing:antialiased;user-select:none}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.mq{font-family:"Anton",Impact,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.app{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;height:100dvh;max-width:520px;margin:0 auto}

/* header */
.hd{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel)}
.hd .dr{font-size:19px;color:var(--brass);line-height:1}
.hd .nm{font-size:15px;font-weight:500}
.badge{margin-left:auto;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--slate)}
.badge.live{color:var(--live);border-color:#2C6B4F}
.badge.queued{color:var(--brass);border-color:#6B5420}
.badge.out{color:var(--alarm);border-color:#6B2C26}

/* score / countdown block */
.meter{padding:16px 15px 14px;text-align:center;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.meter .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--slate)}
.score{font-size:clamp(48px,17vw,76px);line-height:.95;margin:2px 0 4px;transition:color .2s}
.score.dn{color:var(--alarm)}.score.up{color:var(--live)}
.ceil{font-size:11.5px;color:var(--slate)}
.ceil b{color:var(--brass);font-weight:400}
.delta{position:absolute;right:16px;top:50%;font-size:22px;opacity:0;transform:translateY(0)}
.delta.go{animation:fly 1s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(6px)}25%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.cd .n{font-size:clamp(56px,20vw,86px);line-height:.9;color:var(--brass);display:block}
.cd .sub{font-size:12px;color:var(--slate);margin-top:3px}

/* the buzzer */
.pad{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;min-height:0}
.buzz{width:min(66vw,240px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:5px;background:#161D33;border:3px solid var(--line);
color:var(--slate);font-size:15px;letter-spacing:.1em;text-transform:uppercase;transition:transform .06s,background .12s,border-color .12s;
box-shadow:inset 0 -5px 0 #0006}
.buzz .big{font-size:clamp(24px,7vw,34px);letter-spacing:.04em;line-height:1}
.buzz.armed{background:#1E2A4C;border-color:var(--brass);color:var(--brass);cursor:pointer;
animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:inset 0 -5px 0 #0006,0 0 0 0 #D6A93F00}50%{box-shadow:inset 0 -5px 0 #0006,0 0 0 12px #D6A93F14}}
.buzz.armed:active{transform:scale(.965)}
.buzz.sent{background:#17402F;border-color:#2C6B4F;color:var(--live)}
.buzz.early{background:#3E1A17;border-color:var(--alarm);color:var(--alarm);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.buzz.locked{background:#12162A;border-color:#241A1A;color:#5A3A38}
.buzz.spec{background:#171F38;border-color:#3A4670;color:var(--slate);cursor:pointer}
.buzz.spec:active{transform:scale(.965)}
@media (prefers-reduced-motion:reduce){.buzz.armed,.buzz.early,.delta.go{animation:none}}

.fb{text-align:center;min-height:52px}
.fb .t{font-size:26px;line-height:1.1}
.fb .t .u{font-size:13px;color:var(--slate)}
.fb .p{font-size:13px;color:var(--slate);margin-top:2px}
.fb .p b{color:var(--chalk);font-weight:500}
.fb .warn{font-size:13px;color:var(--alarm)}

/* out takeover */
.gone{position:absolute;inset:0;background:#0A0E1CF7;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:6px;z-index:20;padding:20px;text-align:center}
.gone .h{font-size:clamp(38px,11vw,58px);color:var(--alarm);line-height:1}
.gone .s{font-size:14px;color:var(--slate);max-width:26ch}
.gone .st{display:flex;gap:20px;margin-top:14px}
.gone .st div{text-align:center}
.gone .st .v{font-size:24px;color:var(--chalk)}
.gone .st .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}

.foot{border-top:1px solid var(--line);background:var(--panel);padding:8px 12px}
.proto{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.pb{padding:5px 9px;border:1px solid var(--line);border-radius:var(--r);font-size:11.5px;color:var(--slate)}
.pb:hover{color:var(--chalk);border-color:var(--slate)}
.results{position:fixed;inset:0;background:#0A0E1CF8;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.rbox{background:var(--panel);border-top:1px solid var(--brass);width:100%;max-width:520px;max-height:94dvh;display:flex;flex-direction:column;overflow:hidden}
.champ{padding:16px 18px 13px;border-bottom:1px solid var(--line);text-align:center}
.champ .lbl{font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass)}
.champ .cn{font-size:clamp(30px,10vw,44px);line-height:1.05;margin:3px 0}
.champ .cs{font-size:11.5px;color:var(--slate)}
.champ.you .cn{color:var(--brass)}
.mine{padding:11px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}
.mine .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:block}
.mine .v{font-size:20px}
.mine .pos{margin-left:auto;text-align:right}
.tabs{display:flex;gap:4px;padding:9px 12px 0}
.tabs button{padding:6px 13px;font-size:12px;color:var(--slate);border:1px solid var(--line);
border-bottom:none;border-radius:var(--r) var(--r) 0 0;background:var(--ink)}
.tabs button.on{color:var(--brass);background:var(--panel);border-color:var(--brass)}
.tw{overflow:auto;-webkit-overflow-scrolling:touch}
.results table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.results th{position:sticky;top:0;background:var(--panel);text-align:right;padding:8px 9px;font-weight:500;
font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);cursor:pointer;
white-space:nowrap;border-bottom:1px solid var(--line);z-index:2}
.results th.s{color:var(--brass)}
.results td{padding:6px 9px;text-align:right;border-bottom:1px solid #1A2237;white-space:nowrap}
.results th:nth-child(2),.results td:nth-child(2){text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
.results tr.win td{color:var(--brass)}
.results tr.me td{background:#243259;color:var(--chalk)}
.results tr.me td:nth-child(2){background:#243259}
.rfoot{padding:11px 16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--slate);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <span class="dr mq num" id="h-draw">14</span>
    <span class="nm" id="h-name">Weiss</span>
    <span class="badge" id="h-badge">—</span>
  </header>
  <section class="meter" id="meter"></section>
  <section class="pad">
    <button class="buzz" id="buzz" aria-live="off"><span class="big mq" id="bz-big">WAIT</span><span id="bz-sub"></span></button>
    <div class="fb" id="fb"></div>
  </section>
  <footer class="foot">
    <div class="proto">Prototype controls — not in the real app</div>
    <div class="btns" id="ctl"></div>
  </footer>
</div>
<p class="sr" id="sr" aria-live="assertive"></p>
<script>
const P={state:"live",draw:14,name:"Weiss",score:3450,ceiling:9120,cluesToEntry:3,
  armed:false,buzzed:null,lockedOut:false,early:false,armedAt:0,tenure:34,outOrder:7,place:5};
let lockTimer=null;

function setState(s){P.state=s;P.armed=false;P.buzzed=null;P.lockedOut=false;P.early=false;render()}

function arm(){
  P.armed=true;P.buzzed=null;P.early=false;P.armedAt=performance.now();
  if(P.lockedOut){render();return}
  render();
}
function disarm(){P.armed=false;render()}

function press(){
  if(P.lockedOut)return;
  if(P.buzzed)return;
  if(!P.armed){                                  // jumped the lights
    P.early=true;render();
    clearTimeout(lockTimer);
    lockTimer=setTimeout(()=>{P.early=false;render()},250);
    say("Too early. Locked out 250 milliseconds.");
    return;
  }
  const ms=Math.round((performance.now()-P.armedAt)*10)/10;
  // mock the field you're racing: 2-5 live opponents
  const field=Array.from({length:2+Math.floor(Math.random()*4)},()=>Math.round((320+Math.random()*1400)*10)/10);
  const faster=field.filter(t=>t<ms).length;
  P.buzzed={ms,place:faster+1,of:field.length+1,spectator:P.state!=="live"};
  say(`Buzzed ${ms.toFixed(1)} milliseconds, ${ord(P.buzzed.place)} of ${P.buzzed.of}`);
  render();
}

function drain(v){
  const el=document.getElementById("sc");
  P.score-=v;
  flash(el,"dn","−"+v.toLocaleString());
  if(P.score<0)setState("out");else render();
}
function gain(v){P.score=Math.min(P.score+v,P.ceiling);flash(document.getElementById("sc"),"up","+"+v.toLocaleString());render()}
function flash(el,cls,txt){
  if(!el)return;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),450);
  const d=document.getElementById("delta");
  if(d){d.textContent=txt;d.style.color=cls==="dn"?"var(--alarm)":"var(--live)";
    d.classList.remove("go");void d.offsetWidth;d.classList.add("go")}
}
const ord=n=>{const v=n%100;return n+(v>=11&&v<=13?"th":["th","st","nd","rd"][n%10]||"th")};
const say=m=>document.getElementById("sr").textContent=m;

function render(){
  document.getElementById("h-draw").textContent=P.draw;
  document.getElementById("h-name").textContent=P.name;
  const b=document.getElementById("h-badge");
  b.className="badge "+(P.state==="live"?"live":P.state==="queued"?"queued":"out");
  b.textContent=P.state==="live"?"In the ring":P.state==="queued"?"In the queue":"Eliminated";

  const m=document.getElementById("meter");
  if(P.state==="queued"){
    m.innerHTML=`<div class="cd"><span class="k">Clues until you're in</span>
      <span class="n mq num">${P.cluesToEntry}</span>
      <span class="sub">You enter at ${(3000).toLocaleString()} · warm up below</span></div>`;
  }else if(P.state==="out"){
    m.innerHTML=`<span class="k">Final score</span><div class="score mq num">0</div>
      <div class="ceil">Survived <b>${P.tenure}</b> clues · ${ord(P.outOrder)} out</div>`;
  }else{
    m.innerHTML=`<span class="k">Your score</span>
      <div class="score mq num" id="sc">${P.score.toLocaleString()}</div>
      <div class="ceil">Ceiling <b class="num">${P.ceiling.toLocaleString()}</b>${P.score>=P.ceiling?" · you're capped":""}</div>
      <span class="delta mq num" id="delta"></span>`;
  }

  const bz=document.getElementById("buzz"),big=document.getElementById("bz-big"),sub=document.getElementById("bz-sub");
  bz.className="buzz";bz.disabled=false;sub.textContent="";
  if(P.state==="out"||P.state==="queued"){
    if(P.buzzed){bz.classList.add("sent");big.textContent="SENT";sub.textContent="warm-up only"}
    else{bz.classList.add("spec");big.textContent="WARM UP";sub.textContent="not scored"}
  }else if(P.lockedOut){
    bz.classList.add("locked");big.textContent="LOCKED OUT";sub.textContent="you missed this clue";bz.disabled=true;
  }else if(P.early){
    bz.classList.add("early");big.textContent="TOO EARLY";sub.textContent="250 ms penalty";
  }else if(P.buzzed){
    bz.classList.add("sent");big.textContent="IN";sub.textContent="";
  }else if(P.armed){
    bz.classList.add("armed");big.textContent="BUZZ";sub.textContent="";
  }else{
    big.textContent="WAIT";sub.textContent="listen for the clue";
  }

  const fb=document.getElementById("fb");
  if(P.buzzed){
    const {ms,place,of,spectator}=P.buzzed;
    fb.innerHTML=`<div class="t num">${ms.toFixed(1)}<span class="u"> ms</span></div>
      <div class="p">${place===1&&!spectator?"<b>You got in first</b>":`<b>${ord(place)}</b> of ${of}${spectator?" — if you'd been in":""}`}</div>`;
  }else if(P.lockedOut){
    fb.innerHTML=`<div class="warn">You're out of this clue. Score drops when it resolves.</div>`;
  }else fb.innerHTML="";

  document.querySelectorAll(".gone").forEach(n=>n.remove());
  if(P.state==="out"&&!P.shown){
    const g=document.createElement("div");g.className="gone";
    g.innerHTML=`<div class="h mq">ELIMINATED</div>
      <div class="s">Your score dropped below zero. You can keep buzzing to compare times, but nothing you do counts now.</div>
      <div class="st"><div><div class="v num">${P.tenure}</div><div class="k">clues survived</div></div>
      <div><div class="v num">${ord(P.outOrder)}</div><div class="k">out</div></div></div>`;
    g.onclick=()=>g.remove();document.querySelector(".app").style.position="relative";
    document.querySelector(".app").appendChild(g);
    setTimeout(()=>g.remove(),4200);
  }
}


let FINAL=null,rTab="match",rKey="tenure",rDir=-1;
const NM=["Dave","Nam","Wayne","Zach","Ward","Weiss","Michael","Priya","Otto","Reggie","Sofia","Lena","Marcus","Ines","Bo","Yuki","Cal","Dot","Ravi","Nell","Tam","Gus","Iris","Ola","Pete","Suki","Vic","Wren","Xan","Zed"];
function mockFinal(){
  const ps=NM.map((n,i)=>{const att=6+Math.floor(Math.random()*34),won=Math.floor(att*(.2+Math.random()*.5));
    const times=Array.from({length:att},()=>Math.round((330+Math.random()*1300)*10)/10);
    return{draw:i+1,name:n,tenure:8+Math.floor(Math.random()*70),outOrder:0,
      correct:Math.floor(won*(.55+Math.random()*.4)),missed:Math.floor(Math.random()*7),
      pins:Math.floor(Math.random()*4),drained:Math.floor(Math.random()*14000),
      peak:2000+Math.floor(Math.random()*7000),att,early:Math.floor(Math.random()*5),won,times}});
  ps.forEach(p=>{p.name===P.name&&(p.tenure=P.tenure,p.outOrder=P.outOrder)});
  const champ=ps[Math.floor(Math.random()*8)+22];
  ps.filter(p=>p!==champ).sort(()=>Math.random()-.5).forEach((p,i)=>p.outOrder=i+1);
  champ.outOrder=0;champ.tenure=Math.max(champ.tenure,40);
  return{ps,champ}
}
const RCOLS={
 match:[["draw","Draw",p=>p.draw],["name","Player",p=>p.name],["tenure","Clues",p=>p.tenure],
   ["outOrder","Out",p=>p.outOrder||999],["correct","Correct",p=>p.correct],["missed","Missed",p=>p.missed],
   ["pins","Pins",p=>p.pins],["drained","Drained",p=>p.drained],["peak","Peak",p=>p.peak]],
 buzz:[["draw","Draw",p=>p.draw],["name","Player",p=>p.name],["att","Attempts",p=>p.att],
   ["early","Early",p=>p.early],["won","Won",p=>p.won],["rate","Win rate",p=>p.att?p.won/p.att:0],
   ["avg","Avg ms",p=>rAvg(p)],["best","Best ms",p=>rBest(p)]]};
const rAvg=p=>p.times.length?Math.round(p.times.reduce((a,b)=>a+b,0)/p.times.length*10)/10:0;
const rBest=p=>p.times.length?Math.min(...p.times):0;
function rCell(p,k,champ){
  if(k==="name")return (p===champ?"◆ ":"")+p.name;
  if(k==="outOrder")return p.outOrder?ord(p.outOrder):"—";
  if(k==="rate")return p.att?Math.round(p.won/p.att*100)+"%":"—";
  if(k==="peak"||k==="drained")return p[k].toLocaleString();
  if(k==="avg")return rAvg(p).toFixed(1);
  if(k==="best")return rBest(p).toFixed(1);
  return RCOLS[rTab].find(c=>c[0]===k)[2](p);
}
function showResults(){
  if(!FINAL)FINAL=mockFinal();
  const {ps,champ}=FINAL,you=ps.find(p=>p.name===P.name);
  const cols=RCOLS[rTab],f=(cols.find(c=>c[0]===rKey)||cols[2])[2];
  const rows=ps.slice().sort((a,b)=>{const x=f(a),y=f(b);
    return (typeof x==="string"?x.localeCompare(y):x-y)*rDir||a.draw-b.draw});
  const head=cols.map(c=>`<th data-k="${c[0]}" class="${rKey===c[0]?"s":""}">${c[1]}${rKey===c[0]?(rDir<0?" ▾":" ▴"):""}</th>`).join("");
  const body=rows.map(p=>`<tr class="${p===champ?"win":""}${p===you?" me":""}">`+
    cols.map(c=>`<td class="${c[0]==="name"?"":"num"}">${rCell(p,c[0],champ)}</td>`).join("")+`</tr>`).join("");
  const won=champ===you;
  const el=document.createElement("div");el.className="results";
  el.innerHTML=`<div class="rbox">
    <div class="champ${won?" you":""}"><div class="lbl">${won?"You are the last one standing":"Last one standing"}</div>
      <div class="cn mq">${champ.name}</div>
      <div class="cs">entry #${champ.draw} · ${champ.tenure} clues survived · ${champ.correct} correct · ${champ.pins} pins</div></div>
    ${won?"":`<div class="mine"><div><span class="k">You survived</span><span class="v num">${you.tenure} clues</span></div>
      <div class="pos"><span class="k">Went out</span><span class="v num">${ord(you.outOrder)}</span></div></div>`}
    <div class="tabs"><button data-t="match" class="${rTab==="match"?"on":""}">Match</button><button data-t="buzz" class="${rTab==="buzz"?"on":""}">Buzzers</button></div>
    <div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="rfoot">Tap a column to sort. Only the last one standing counts.</div></div>`;
  document.body.appendChild(el);
  el.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;if(k===rKey)rDir*=-1;else{rKey=k;rDir=(k==="name"||k==="draw"||k==="best"||k==="avg")?1:-1}
    el.remove();showResults()});
  el.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
    if(b.dataset.t===rTab)return;rTab=b.dataset.t;rKey=rTab==="match"?"tenure":"won";rDir=-1;
    el.remove();showResults()});
  const me=el.querySelector("tr.me");if(me)me.scrollIntoView({block:"center"});
}
document.getElementById("buzz").onpointerdown=e=>{e.preventDefault();press()};
addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();press()}});

const CTL=[["Arm buzzers",()=>{P.lockedOut=false;arm()}],["Disarm",disarm],
 ["Drain 400",()=>drain(400)],["Gain 1,200",()=>gain(1200)],
 ["Mark my miss",()=>{P.lockedOut=true;P.buzzed=null;P.armed=false;render()}],
 ["Ceiling −500",()=>{P.ceiling-=500;if(P.score>P.ceiling)P.score=P.ceiling;render()}],
 ["State: live",()=>setState("live")],["State: queued",()=>setState("queued")],
 ["State: eliminated",()=>{P.shown=false;setState("out")}],
 ["Match over",()=>{document.querySelectorAll(".results").forEach(n=>n.remove());FINAL=null;showResults()}]];
const ctl=document.getElementById("ctl");
CTL.forEach(([t,f])=>{const b=document.createElement("button");b.className="pb";b.textContent=t;b.onclick=f;ctl.appendChild(b)});
render();
</script>
</body>
</html>
