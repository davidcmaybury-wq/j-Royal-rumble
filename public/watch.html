<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J! Royal Rumble</title>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@700&family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* Stable colours on the scoreboards. A tinted edge and the stone's badge, so a
   glance tells you who is with whom without reading a single name. */
.pl.instable,.brow.instable,.row.instable{box-shadow:inset 3px 0 0 var(--gemc)}
.gem{flex:none;vertical-align:-3px;margin-right:4px}
.gemname{color:var(--gemc);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* A sweep: the cleared column held up and shimmering while the bonus floats off
   it. The board replaces a cleared category in the same resolve, so without
   this the celebration plays over a column that is already something else. */
.sweepover{position:absolute;z-index:55;pointer-events:none;border-radius:6px;
overflow:hidden;animation:sweepfade 2.6s ease-out forwards}
.sweepover .sc{position:absolute;inset:0;border-radius:6px;
background:linear-gradient(115deg,#7A5A12 0%,#D6A93F 38%,#FFF3C4 50%,#D6A93F 62%,#7A5A12 100%);
background-size:260% 100%;animation:sweepshine 1.5s ease-in-out 2}
.sweepover .st{position:absolute;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;
color:#2A1D06;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
font-size:14px;line-height:1.2}
.sweepfloat{position:absolute;z-index:56;pointer-events:none;white-space:nowrap;
font-family:"Anton",Impact,sans-serif;font-size:34px;letter-spacing:.02em;
color:var(--brass);text-shadow:0 2px 0 #2A1D06,0 0 16px #D6A93F88;
animation:sweeprise 2.4s ease-out forwards}
@keyframes sweepshine{0%{background-position:120% 0}100%{background-position:-40% 0}}
@keyframes sweepfade{0%{opacity:0}8%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes sweeprise{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}
15%{opacity:1;transform:translate(-50%,0) scale(1)}
100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
@media (prefers-reduced-motion:reduce){
  .sweepover,.sweepover .sc,.sweepfloat{animation:none}
  .sweepover{opacity:1} .sweepfloat{opacity:1;transform:translate(-50%,-30px)}
}

/* What the robots say. A robot that is simply marked wrong is a scoring event;
   one that says "Millard Fillmore" is a player. */
.says{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;
pointer-events:none;opacity:0;transition:opacity .16s ease,transform .16s ease}
.says.on{opacity:1;transform:translateX(-50%)}
.sayrow{display:flex;align-items:baseline;gap:10px;padding:10px 16px;border-radius:999px;
background:#131A30EE;border:1px solid var(--line);max-width:78vw}
.sayrow .who{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);
flex:none}
.sayrow .what{font-size:17px;color:var(--chalk);overflow:hidden;text-overflow:ellipsis;
white-space:nowrap}
.sayrow.right{border-color:var(--live)} .sayrow.right .what{color:var(--live)}
.sayrow.wrong{border-color:var(--alarm)} .sayrow.wrong .what{color:#F0A99E}
.sayrow.pick{border-color:var(--brass)} .sayrow.pick .what{color:var(--brass)}
@media (prefers-reduced-motion:reduce){.says{transition:none}}

/* The entrance player, when somebody has chosen a YouTube clip. Small and in
   the corner: a hidden player is refused autoplay outright. */
.ytframe{position:fixed;right:14px;bottom:14px;width:240px;height:135px;border:2px solid var(--line);
border-radius:6px;z-index:70;background:#000}


/* The clue face.
   ITC Korinna Bold is what the show used and is licensed, so this is Bitter at
   700 — the closest free slab serif: heavy, slightly rounded slabs, generous
   x-height. All caps, white on the board blue, with a tight black shadow the
   way the studio cards carried one. */
.clue .txt{font-family:"Bitter",Georgia,serif;font-weight:700;text-transform:uppercase;
color:#FFFFFF;letter-spacing:.012em;
text-shadow:2px 2px 0 #000000,1px 1px 0 #000000,0 1px 2px #00000099}

:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;--chalk:#EEEBE1;
--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:5px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);font:400 16px/1.4 "IBM Plex Sans",system-ui,sans-serif;
overflow:hidden;height:100dvh}
button{font:inherit;background:none;border:0;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}
.bar{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--panel);
border-bottom:1px solid var(--line)}
.bar .brand{line-height:0}
.st{display:flex;flex-direction:column;line-height:1.1}
.st .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.st .v{font-size:19px;font-family:"IBM Plex Mono",monospace}
.ot{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--alarm);
border:1px solid var(--alarm);border-radius:20px;padding:3px 10px}
.aud{margin-left:auto;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
color:var(--slate);border:1px solid var(--line);border-radius:20px;padding:5px 13px;
cursor:pointer;white-space:nowrap}
.aud:hover{border-color:var(--brass);color:var(--chalk)}
.aud.on{color:var(--live);border-color:var(--live)}
.aerr{display:block;font-size:9px;color:var(--alarm);letter-spacing:0;text-transform:none}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
.stage{padding:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
/* board */
/* The 1985 set. Each clue is its own CRT: rounded dark bezel, saturated blue
   tube with a brighter centre where a curved screen catches the studio lights,
   faint scanlines. The frame around them is the set's warm metal grid. A
   played clue goes blank — the monitor stays on, showing empty blue, as the
   Trebek-era board did — rather than to black, so the board keeps its glow.
   Category cards are the printed kind, not screens: warm white, dark ink. */
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;flex:1;min-height:0;
background:linear-gradient(160deg,#8E8578,#6E675C 55%,#57514A);
padding:11px;border-radius:8px;
box-shadow:inset 0 1px 0 #B5AC9C,inset 0 -2px 5px #00000066,0 4px 16px #00000066}
.col{display:grid;grid-template-rows:auto repeat(5,1fr);gap:9px;min-height:0}
.cat{background:linear-gradient(175deg,#EFE9DC,#CFC7B6);border-radius:5px;
padding:8px 5px;text-align:center;color:#1C2242;
font-weight:700;font-size:11.5px;line-height:1.2;letter-spacing:.06em;text-transform:uppercase;
display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;
box-shadow:inset 0 1px 0 #FFFFFFAA,inset 0 -2px 3px #00000033,0 2px 4px #00000055;
border:2px solid #3A352C}
.cat .src{display:block;font-size:8.5px;letter-spacing:.14em;color:#6E6858;margin-bottom:3px}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
border-radius:9px;border:3px solid #26221C;
background:radial-gradient(ellipse 90% 75% at 50% 40%,#2B2BE0 0%,#1717C2 52%,#0B0B93 100%);
box-shadow:inset 0 0 22px #000A4ACC,inset 0 2px 8px #6A6AFF33,0 2px 5px #00000077;
font:400 clamp(16px,2.3vw,30px) "Anton",Impact,sans-serif;letter-spacing:.05em;
color:#FFF;text-shadow:0 0 7px #9A9AFF,0 2px 2px #000060;overflow:hidden}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:6px;
background:repeating-linear-gradient(180deg,transparent 0 2px,#00003420 2px 3px),
linear-gradient(180deg,#FFFFFF14,transparent 30%)}
.cell.gone{background:radial-gradient(ellipse 90% 75% at 50% 40%,#2222C8 0%,#1212A8 55%,#0A0A85 100%);
color:transparent;text-shadow:none}
.cell.raised{color:#FFD24A;text-shadow:0 0 8px #FFB300,0 2px 2px #402800}
/* clue */
/* The clue on the board's own blue, in the 4:3 the monitors were, rather than
   floating on the page background. */
.clue{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
text-align:center;padding:20px;gap:18px}
.clue .card43{aspect-ratio:4/3;width:min(92%,calc(78vh * 4 / 3));display:flex;
flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:3vh 4%;
border-radius:10px;border:4px solid #26221C;
background:radial-gradient(ellipse 90% 75% at 50% 40%,#2B2BE0 0%,#1717C2 52%,#0B0B93 100%);
box-shadow:inset 0 0 60px #000A4A99,0 6px 22px #00000066}
.clue .meta{color:#AFC0E8}
.clue .meta{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.clue .meta .v{color:var(--brass)}
.clue .txt{font-size:clamp(24px,3.6vw,54px);line-height:1.28;max-width:22ch}
.lect{display:flex;gap:8px;justify-content:center}
.lect i{width:clamp(34px,5vw,70px);height:14px;border-radius:3px;background:#3A1512}
.lect i.lit{background:var(--alarm);box-shadow:0 0 12px #E24A3C88}
.race{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;min-height:34px}
.bz{background:var(--panel);border-radius:20px;padding:5px 13px;font-size:14px;
display:flex;gap:9px;align-items:center}
.bz.on{background:#3A2E0C;color:var(--brass)}
.bz .t{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--slate)}
.idle{color:var(--slate);font-size:14px}
/* rail */
.rail{border-left:1px solid var(--line);padding:12px;overflow:auto;background:#0C1120}
.sect{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);
display:flex;justify-content:space-between;padding:12px 4px 6px}
.sect:first-child{padding-top:0}
.pl{display:grid;grid-template-columns:8px 20px 22px minmax(0,1fr) auto;align-items:center;
gap:6px;padding:8px 9px;background:var(--panel);border-radius:var(--r);margin-bottom:4px}
.pl.out{opacity:.45}
.pl.uptop{background:#3A2208;box-shadow:inset 2px 0 0 #FF9A3C}
.dr{color:var(--slate);font-size:11.5px;font-family:"IBM Plex Mono",monospace;text-align:right}
.ctrl{width:7px;height:7px;border-radius:50%}
.ctrl.on{background:var(--chalk);box-shadow:0 0 7px #EEEBE1AA}
.av{width:22px;height:22px;border-radius:50%;object-fit:cover;display:block;background:var(--panel2)}
.av svg{display:block;border-radius:50%}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14.5px}
.sc{font-family:"IBM Plex Mono",monospace;font-size:15px}
.sc.cap{color:var(--brass)}
.sc.low{color:var(--alarm)}
.mk{font-size:10px}
.mk.rope{color:#FF9A3C;letter-spacing:.08em;font-size:9px}
.mk.hunted{color:var(--alarm)}
.next{background:var(--panel);border-radius:var(--r);padding:10px;text-align:center;margin-top:6px}
.next .n{font:400 30px "Anton",Impact,sans-serif;color:var(--brass);line-height:1}
.next .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
/* lobby + join */
.mid{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:16px;text-align:center;padding:30px}
.mid h1{font:400 clamp(30px,5vw,52px)/1 "Anton",Impact,sans-serif;color:var(--brass)}
.mid .code{font:400 clamp(44px,9vw,110px)/1 "Anton",Impact,sans-serif;color:var(--brass);letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:20px;
padding:4px 12px 4px 5px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip svg,.chip img{width:22px;height:22px;border-radius:50%;display:block}
.chip.bot{border-style:dashed;color:var(--slate)}
.backhome{display:block;text-align:center;margin-top:14px;color:var(--slate);
font-size:13.5px;text-decoration:none}
.backhome:hover{color:var(--brass)}
.homebtn{display:inline-block;margin-top:18px;padding:11px 26px;
border:1px solid var(--line);border-radius:var(--r);color:var(--slate);
text-decoration:none;font-size:14px}
.homebtn:hover{border-color:var(--brass);color:var(--brass)}
.fld{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:12px 14px;font:400 24px "IBM Plex Mono",monospace;
text-align:center;text-transform:uppercase;letter-spacing:.3em;width:220px}
.go{background:var(--brass);color:#0A0E1C;border-radius:var(--r);padding:12px 26px;
font-size:16px;cursor:pointer}
.err{color:var(--alarm);font-size:14px;min-height:20px}
.foot{position:fixed;right:10px;bottom:8px;font-size:10px;color:#26304C;font-family:"IBM Plex Mono",monospace}
.anim{position:fixed;left:14px;bottom:14px;z-index:40;opacity:0;transform:translateY(8px);
pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.anim.on{opacity:1;transform:none}
.anim svg{display:block;border:1px solid var(--line);border-radius:var(--r)}
.acap{font-size:12px;letter-spacing:.09em;text-transform:uppercase;text-align:center;
margin-top:5px;color:var(--alarm)}
.acap.climb{color:#FF9A3C}
.acap.entry{color:var(--live)}
</style></head>
<body><div id="root"></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { markFull, markSmall, brainAvatar } from '/brand.js';
import { gem } from '/gems.js';
import { weaponToken } from '/tokens.js';
import { avatar as wrestlerAvatar } from '/wrestlers.js';
import { scoreChart } from '/chart.js';
import { animation, SECONDS } from '/toss.js';
import * as sfx from '/sound.js';

const socket = io({ transports: ['websocket'] });
const root = document.getElementById('root');
const fmt = (n) => (n == null ? '—' : n.toLocaleString());
const $ = (id) => document.getElementById(id);

let code = (location.pathname.match(/\/watch\/([A-Z0-9]{4})/i) || [])[1] || '';
let S = null, err = '';

// One screen in the room plays the audio.
//
// Thirty browsers playing the same cue a fraction apart would be a mess, so
// this is off everywhere until somebody turns it on — normally whichever
// machine is plugged into the speakers. It also takes the game's sound off the
// host's microphone and out of the call's audio path entirely.
//
// Deliberately a click and nothing else: no URL parameter, no remembered
// setting. Browsers refuse to play audio until a page has been interacted
// with, and a toggle that restores itself on load would silently fail.
let audioOn = false;
const CUES = { toss: 'chop', climb: 'toprope', entry: 'entry' };
function cue(kind) {
  const k = CUES[kind];
  if (k && audioOn) sfx.play(k);
}
async function toggleAudio() {
  if (audioOn) { audioOn = false; sfx.setMuted(true); stopTheme(); paintAudio(); return; }
  const ok = await sfx.unlock();
  audioOn = ok;
  sfx.setMuted(!ok);
  paintAudio(ok ? '' : 'the browser refused — try again');
}
function paintAudio(msg) {
  const b = document.getElementById('audio');
  if (!b) return;
  b.className = 'aud' + (audioOn ? ' on' : '');
  b.innerHTML = (audioOn ? '&#9679; Sound on this screen' : 'Play sound here')
    + (msg ? '<span class="aerr">' + msg + '</span>' : '');
}

// A photo if they uploaded one, otherwise their wrestler. Robots get a
// wrestler too — they are in the ring, so they should look like it.
const face = (p, size = 22) => p.look
  ? '<span class="av">' + wrestlerAvatar(p.look, size) + '</span>'
  : p.isBot ? '<span class="av">' + brainAvatar(p.level || 'normie', size) + '</span>'
  : p.tokenArt ? '<span class="av">' + weaponToken(p.tokenArt.art, size, p.tokenArt.colour) + '</span>'
  : '<span class="av"></span>';

function join() {
  socket.emit('watch-game', { gameId: code }, (r) => {
    if (!r || r.error) { err = r ? r.error : 'could not reach the match'; return ask(); }
    err = ''; S = r.state; render();
  });
}

function ask() {
  root.innerHTML = `<div class="mid">${markFull(120)}
    <h1>Watch a Rumble</h1>
    <div style="color:var(--slate)">Enter the room code the host read out.</div>
    <input class="fld" id="c" maxlength="4" autocomplete="off" value="${code}">
    <button class="go" id="g">Watch</button>
    <div class="err">${err}</div>
    <a class="backhome" href="/">&larr; Back</a></div>`;
  const c = $('c');
  const go = () => {
    code = c.value.trim().toUpperCase();
    if (code.length === 4) { history.replaceState(null, '', '/watch/' + code); join(); }
  };
  $('g').onclick = go;
  c.onkeydown = (e) => { if (e.key === 'Enter') go(); };
  c.oninput = () => { c.value = c.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  setTimeout(() => c.focus(), 60);
}

// Five red boxes counting the five seconds after the buzzers arm, the way a
// lectern does it. Driven off the state rather than a local clock, so every
// watcher sees the same thing.
let armedAt = null;
function lectern() {
  if (!S.race || !S.race.open) { armedAt = null; return ''; }
  if (armedAt == null) armedAt = performance.now();
  const left = Math.max(0, 5 - (performance.now() - armedAt) / 1000);
  const lit = Math.ceil(left);
  return '<div class="lect">' + Array.from({ length: 5 },
    (_, i) => `<i class="${i < lit ? 'lit' : ''}"></i>`).join('') + '</div>';
}

function board() {
  const face2 = [100, 200, 300, 400, 500];
  return '<div class="board">' + (S.board || []).map((c) => '<div class="col">'
    + '<div class="cat"><span>' + (c.source ? '<span class="src">'
        + (c.source === 'original' ? 'TTG' : 'J!') + '</span>' : '') + c.title + '</span></div>'
    + c.clues.map((x) => {
        const worth = x.value ?? face2[x.row - 1];
        return '<div class="cell' + (x.revealed ? ' gone' : '')
          + (worth > face2[x.row - 1] ? ' raised' : '') + '">'
          + (x.revealed ? '' : '$' + worth.toLocaleString()) + '</div>';
      }).join('')
    + '</div>').join('') + '</div>';
}

function stage() {
  if (S.clue) {
    const b = (S.race && S.race.buzzes) || [];
    const chips = b.map((x, i) => '<span class="bz' + (i === 0 ? ' on' : '') + '"><span>'
      + x.name + '</span><span class="t">' + x.ms.toFixed(0) + 'ms</span></span>').join('');
    return '<div class="clue"><div class="card43">'
      + '<div class="meta">' + S.clue.category + ' &middot; <span class="v">$'
        + fmt(S.clue.value) + '</span>'
        + (S.retoss ? ' &middot; <span style="color:var(--alarm)">back out ' + S.retoss + '&times;</span>' : '')
      + '</div>'
      + '<div class="txt">' + S.clue.text + '</div>'
      + lectern()
      + '<div class="race">' + (chips || (S.race && S.race.open
          ? '<span class="idle">Buzzers live</span>' : '<span class="idle">&nbsp;</span>')) + '</div>'
      + '</div></div>';
  }
  return board();
}

// Which stable a row belongs to, for the tint and the badge.
const stableOf = (id) => ((S && S.stables) || []).find((x) => x.id === id) || null;

function row(p, out) {
  const low = !out && p.score < 600;
  const st = p.stable ? stableOf(p.stable) : null;
  return '<div class="pl' + (out ? ' out' : '') + (p.topRope ? ' uptop' : '')
    + (st ? ' instable' : '') + '"'
    + (st ? ' style="--gemc:' + st.colour + '"' : '') + '>'
    + '<span class="ctrl' + (S.control === p.token ? ' on' : '') + '"></span>'
    + '<span class="dr">' + p.draw + '</span>'
    + face(p)
    + '<span class="nm">' + (st ? gem(st.name, st.colour, 15) : '') + p.name
      + (p.topRope ? ' <span class="mk rope">TOP ROPE</span>' : '')
      + ((p.targetedBy || []).length ? ' <span class="mk hunted">&#9678;'
          + (p.targetedBy.length > 1 ? ' \u00D7' + p.targetedBy.length : '') + '</span>' : '')
    + '</span>'
    + '<span class="sc' + (p.capped ? ' cap' : '') + (low ? ' low' : '') + '">'
      + (out ? p.tenure : fmt(p.score)) + '</span></div>';
}

function render() {
  if (!S) return ask();

  if (S.phase === 'lobby') {
    root.innerHTML = `<div class="mid">${markFull(130)}
      <div class="code">${S.gameId}</div>
      <div style="color:var(--slate)">Waiting for the host to start.</div>
      <div class="chips">${(S.roster || []).map((p) =>
        `<span class="chip${p.isBot ? ' bot' : ''}">${face(p)}${p.name}</span>`).join('')
        || '<span style="color:var(--slate)">Nobody yet.</span>'}</div>
      </div><div class="foot">watching ${S.gameId}</div>`;
    return;
  }

  if (S.phase === 'over') {
    const champ = (S.standings || []).find((p) => p.winner);
    root.innerHTML = `<div class="mid">
      <div style="font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--brass)">
        Last one standing</div>
      <div style="font:400 clamp(48px,11vw,140px)/.95 Anton,Impact,sans-serif;color:var(--brass)">
        ${champ ? champ.name : 'No winner'}</div>
      ${champ ? `<div style="color:var(--slate)">entry #${champ.draw} &middot;
        ${champ.tenure} clues survived &middot; ${champ.correct} correct</div>` : ''}
      ${S.history && S.history.length > 2 ? `<div style="width:min(860px,92vw)">${
        scoreChart(S.history, (S.standings || []).map((p) => ({ token: p.token, name: p.name })),
          { winnerToken: champ && champ.token, width: 860, height: 240 })}</div>` : ''}
      <a class="homebtn" href="/">Back to the front page</a>
      </div><div class="foot">${S.gameId}</div>`;
    return;
  }

  // Highest first. The console sorts by draw because the host is looking for a
  // particular person; a room watching wants to know who is winning.
  const live = (S.live || []).slice().sort((a, b) => b.score - a.score);
  const out = S.out || [], q = S.queue || [];
  root.innerHTML = `<div class="app">
    <div class="bar">
      <span class="brand">${markSmall(28)}</span>
      <span class="st"><span class="k">Clue</span><span class="v">${S.clues}</span></span>
      <span class="st"><span class="k">In</span><span class="v">${live.length}</span></span>
      <span class="st"><span class="k">Queue</span><span class="v">${q.length}</span></span>
      <span class="st"><span class="k">Ceiling</span><span class="v">${fmt(S.ceiling)}</span></span>
      ${S.overtime ? `<span class="ot">Overtime &times;${S.overtime.multiplier}</span>` : ''}
      <button class="aud${audioOn ? ' on' : ''}" id="audio">${audioOn
        ? '&#9679; Sound on this screen' : 'Play sound here'}</button>
    </div>
    <div class="main">
      <div class="stage">${stage()}</div>
      <div class="rail">
        <div class="sect"><span>In the ring</span><span>${live.length}</span></div>
        ${live.map((p) => row(p, false)).join('')}
        ${q.length ? `<div class="next"><div class="k">Next in</div>
          <div class="n">${S.cluesUntilNextEntry ?? '—'}</div>
          <div class="k">${q[0].name ? '#' + q[0].draw + ' ' + q[0].name
            : 'someone'}</div></div>` : ''}
        ${out.length ? `<div class="sect"><span>Out</span><span>${out.length}</span></div>`
          + out.slice().reverse().map((p) => row(p, true)).join('') : ''}
      </div>
    </div>
  </div><div class="foot">${S.gameId} &middot; v${S.version}</div>
  <div class="anim" id="anim" aria-hidden="true"></div>`;
  const ab = document.getElementById('audio');
  if (ab) ab.onclick = toggleAudio;
  paintCorner();
}

// render() rebuilds the page, which would wipe a playing animation. Keep the
// current one and put it back.
let cornerHtml = '', cornerOn = false;
function paintCorner() {
  const box = document.getElementById('anim');
  if (!box) return;
  if (cornerOn && cornerHtml) { box.innerHTML = cornerHtml; box.classList.add('on'); }
}

// Watch the state for the things worth animating. The room is looking at this
// screen rather than the host's, so this is where the animations earn their
// keep — thirty people seeing somebody thrown out beats one person glimpsing
// it in a corner.
let prevLive = null;
// Who took the last clue, so the toss can show the right thrower.
let lastWinner = null;
function detect(next) {
  if (!prevLive || !next.live) { prevLive = next.live || null; return; }
  const was = new Set(prevLive.map((p) => p.token));
  const now = new Set(next.live.map((p) => p.token));
  const gone = prevLive.filter((p) => !now.has(p.token));
  const came = next.live.filter((p) => !was.has(p.token));
  const wasUp = new Set(prevLive.filter((p) => p.topRope).map((p) => p.token));
  const up = next.live.filter((p) => p.topRope && !wasUp.has(p.token));

  // Whoever took the clue threw them out. On a stumper nobody did, and the
  // referee does the honours instead.
  const lookOf = (t) => ((next.live || []).concat(next.out || [])
    .find((p) => p.token === t) || {}).look || null;
  if (gone.length) {
    corner('toss', gone.length === 1 ? gone[0].name + ' is out'
      : gone.length + ' out at once',
      { thrower: lookOf(lastWinner), victim: gone[0].look });
  } else if (came.length) {
    corner('entry', came.length === 1 ? came[0].name + ' enters'
      : came.length + ' enter', { entrant: came[0].look });
  } else if (up.length) {
    corner('climb', up[0].name + ' goes up top',
      { climber: up[0].look,
        other: (next.live.find((p) => p.token !== up[0].token) || {}).look });
  }
  prevLive = next.live;
}

let cornerTimer = null;
function corner(kind, caption, who) {
  const box = document.getElementById('anim');
  if (!box) return;
  clearTimeout(cornerTimer);
  cornerHtml = animation(kind, 190, who || {})
    + '<div class="acap ' + kind + '">' + caption + '</div>';
  cornerOn = true;
  box.innerHTML = cornerHtml;
  box.classList.add('on');
  cornerTimer = setTimeout(() => {
    cornerOn = false; cornerHtml = '';
    const b = document.getElementById('anim');
    if (b) b.classList.remove('on');
  }, SECONDS[kind] * 1000 + 800);
  if (audioOn) cue(kind);
}

socket.on('state', (s) => { detect(s); S = s; render(); paintCorner(); });

// What the robots said about the clue just gone.
//
// Shown for a few seconds and then dropped: it is colour, not information the
// room has to act on, and a panel that stays up would compete with the board.
let sayTimer = null;
socket.on('bot-said', (d) => {
  const rows = (d.said || []);
  if (!rows.length) return;
  let box = document.getElementById('saysbox');
  if (!box) {
    box = document.createElement('div');
    box.id = 'saysbox'; box.className = 'says';
    document.body.appendChild(box);
  }
  clearTimeout(sayTimer);
  const label = { right: 'says', wrong: 'says', pick: "I'll take" };
  box.innerHTML = rows.map((r) => `<div class="sayrow ${r.kind}">
    <span class="who">${r.name} ${label[r.kind] || 'says'}</span>
    <span class="what">${r.text}</span></div>`).join('');
  box.classList.add('on');
  sayTimer = setTimeout(() => box.classList.remove('on'), 4200);
});


// The swept column, held up while it is celebrated. By slot, not by name: the
// engine replaces a cleared category in the same resolve that awards the bonus.
function sweepCelebrate(sweep, was, who) {
  // Wait for the board to come back. `resolved` arrives while the clue is
  // still on screen, so measuring the column now finds nothing at all — which
  // is why the celebration silently did nothing the first time.
  const cols = [...document.querySelectorAll('.col')];
  if (!cols.length) {
    return setTimeout(() => sweepCelebrate(sweep, was, who), 120);
  }
  const col = cols[sweep.slot];
  if (!col) return;
  const box = col.getBoundingClientRect();
  const host = document.createElement('div');
  host.className = 'sweepover';
  host.style.cssText += `left:${box.left}px;top:${box.top}px;`
    + `width:${box.width}px;height:${box.height}px`;
  host.innerHTML = `<div class="sc"></div>
    <div class="st"><div>${(was && was.title) || sweep.category}</div>
      <div style="font-size:19px">SWEPT</div></div>`;
  document.body.appendChild(host);
  setTimeout(() => host.remove(), 2700);
  const f = document.createElement('div');
  f.className = 'sweepfloat';
  f.textContent = `${who} +${fmt(sweep.bonus)}`;
  // From the middle of the column, not the top: floating up from the header
  // put it half off the screen.
  f.style.cssText += `left:${box.left + box.width / 2}px;`
    + `top:${box.top + box.height * 0.42}px`;
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 2500);
}

const nameOfToken = (t) => (((S && S.live) || []).concat((S && S.out) || [])
  .find((p) => p.token === t) || {}).name || 'Somebody';

socket.on('resolved', (e) => {
  if (e.sweep) sweepCelebrate(e.sweep, e.categoryWas, nameOfToken(e.sweep.playerId));
  lastWinner = e.winnerId || null;
  for (const en of e.entrances || []) playTheme(en);
});

// Entrance music, on the one screen that has sound turned on.
//
// Only that screen: thirty browsers starting the same clip a fraction apart
// would be a mess, and this is the same reason the cue audio lives here. If
// nobody has enabled sound, nothing plays and nothing breaks.

let themeAudio = null;
let themeFrame = null;

function stopTheme() {
  if (themeAudio) { themeAudio.pause(); themeAudio = null; }
  if (themeFrame) { themeFrame.remove(); themeFrame = null; }
}

function playTheme(entrance) {
  if (!audioOn || !entrance || !entrance.theme) return;
  stopTheme();
  const t = entrance.theme;

  if (t.kind === 'youtube') {
    // A real, visible player rather than a hidden one.
    //
    // The first version used a 0x0 iframe tucked off-screen, and it never
    // played: browsers refuse autoplay in a cross-origin frame that has no
    // size, and YouTube declines to start a player nobody can see. So it sits
    // in the corner at a genuine size — small, but present — which is also
    // honest about where the sound is coming from.
    //
    // Even so, a browser can still refuse to autoplay somebody else's audio.
    // If it does, the entrance simply passes without music; a file link plays
    // through a normal audio element and does not have this problem.
    const f = document.createElement('iframe');
    f.className = 'ytframe';
    f.width = 240; f.height = 135;
    f.allow = 'autoplay; encrypted-media';
    f.setAttribute('playsinline', '');
    f.src = `https://www.youtube-nocookie.com/embed/${t.id}`
      + `?autoplay=1&start=${t.start || 0}&controls=0&modestbranding=1&rel=0&playsinline=1`;
    document.body.appendChild(f);
    themeFrame = f;
    setTimeout(stopTheme, 12000);
    return;
  }

  const src = t.kind === 'library' ? `/audio/themes/${t.key}.mp3` : t.url;
  const a = new Audio(src);
  a.volume = 0.85;
  themeAudio = a;
  a.play().catch(() => { /* the browser refused; the entrance still happens */ });
  a.onended = () => { if (themeAudio === a) themeAudio = null; };
  // A hard stop, so a long uploaded clip cannot run over the next clue.
  setTimeout(() => { if (themeAudio === a) stopTheme(); }, 12000);
}
socket.on('connect', () => { if (code) join(); else ask(); });
socket.on('disconnect', () => { /* the state stays on screen until it returns */ });

// The lectern counts down between state pushes, so repaint it on a timer while
// a race is open. Nothing else needs animating.
setInterval(() => {
  if (S && S.race && S.race.open && S.clue) {
    const el = document.querySelector('.lect');
    if (el) el.outerHTML = lectern();
  }
}, 120);

sfx.preload();
if (!code) ask();
</script>
</body></html>
