<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J! Royal Rumble — host console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;
--chalk:#EEEBE1;--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:4px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.mq{font-family:"Anton",Impact,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh}
.top{display:flex;align-items:center;gap:16px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{display:flex;align-items:center;line-height:0}
.brand svg{display:block;border-radius:50%}
.st{display:flex;align-items:baseline;gap:6px}
.st .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.st .v{font-size:16px}.ceil .v{color:var(--brass)}
.sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.tb{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;color:var(--slate)}
.tb:hover:not(:disabled){border-color:var(--slate);color:var(--chalk)}
.ver{font-size:10.5px;color:var(--slate);letter-spacing:.06em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--alarm)}
.dot.on{background:var(--live)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1px;background:var(--line);min-height:0}
.stage{background:var(--ink);overflow:auto;min-height:0;padding:10px;position:relative}
.lectern{position:absolute;left:0;right:250px;bottom:96px;display:flex;gap:6px;
justify-content:center;pointer-events:none;z-index:20;opacity:0;transition:opacity .12s}
.lectern.on{opacity:1}
.lectern i{width:clamp(40px,6vw,84px);height:16px;border-radius:3px;background:#3A1512;
box-shadow:inset 0 0 0 1px #52201C}
.lectern i.lit{background:#E24A3C;box-shadow:0 0 14px #E24A3C88,inset 0 0 0 1px #FF8A72}
.ot{position:fixed;inset:0;background:#0A0E1CF2;z-index:88;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:10px;animation:fade .2s ease-out;cursor:pointer}
.ot .h2{font:400 clamp(56px,13vw,150px)/.9 "Anton",Impact,sans-serif;color:var(--alarm)}
.ot .m{font:400 clamp(28px,6vw,64px)/1 "Anton",Impact,sans-serif;color:var(--brass)}
.ot .s2{font-size:15px;color:var(--slate);max-width:34ch;text-align:center;line-height:1.6}
.otbadge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--alarm);
border:1px solid var(--alarm);border-radius:20px;padding:3px 9px}
.delayctl{display:flex;align-items:center;gap:4px}
.delayctl .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.dstep{width:22px;height:22px;border:1px solid var(--line);border-radius:var(--r);
color:var(--slate);font-size:14px;line-height:1}
.dstep:hover{border-color:var(--brass);color:var(--brass)}
.dval{width:56px;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:3px 5px;font-size:13px;text-align:center;font-family:"IBM Plex Mono",monospace}
.rail{background:var(--ink);overflow:auto;min-height:0;padding:10px;display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.cat{font-size:10px;line-height:1.25;letter-spacing:.04em;text-transform:uppercase;text-align:center;
padding:7px 4px;background:var(--panel2);border-radius:var(--r) var(--r) 0 0;min-height:52px;
display:flex;flex-direction:column;justify-content:center;gap:2px;position:relative}
.cat .note{font-size:9px;letter-spacing:0;text-transform:none;color:var(--brass);font-style:italic}
.cat .src{position:absolute;top:2px;left:4px;font-size:8px;color:var(--slate);letter-spacing:.08em}
.veto{position:absolute;top:2px;right:3px;font-size:13px;color:var(--slate);padding:1px 3px;border-radius:3px}
.veto:hover{color:var(--alarm);background:#0004}
.stack{display:grid;gap:5px;margin-top:5px}
.cell{width:100%;padding:12px 3px;background:var(--panel);border-radius:var(--r);font-size:17px;color:var(--brass);text-align:center}
.cell:hover:not(:disabled){background:var(--panel2)}
.cell:disabled{background:#0C1120;color:#1C2440;cursor:default}
.cell.raised{color:var(--alarm);font-size:15px}
.clue{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px 4%;gap:14px}
.cmeta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.cmeta .v{color:var(--brass)}
.cnote{font-size:13px;color:var(--brass);font-style:italic}
.ctxt{font-size:clamp(19px,3vw,36px);line-height:1.3;max-width:24ch}
.locked{font-size:11.5px;color:var(--slate)}
.lobby{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.lobby h1{font:400 clamp(28px,5vw,52px)/1 "Anton",Impact,sans-serif;margin:0;color:var(--brass)}
.join{font-size:13px;color:var(--slate)}
.join code{font-family:"IBM Plex Mono",monospace;color:var(--chalk);background:var(--panel);padding:3px 8px;border-radius:var(--r)}
.who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:640px}
.chip{padding:4px 12px 4px 4px;background:var(--panel);border-radius:20px;font-size:13px;
border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px}
.chip img{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block}
.chip:not(:has(img)){padding-left:12px}
.chip.off{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 5px}
.chip:not(:has(img)):not(:has(svg)){padding-left:12px}
.chip img,.chip svg{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;flex:none}
.chip.bot{border-style:dashed}
.chip .lvl{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.go{padding:11px 26px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:15px}
.go:disabled{opacity:.35;border-color:var(--line);color:var(--slate);cursor:default}
.sect{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);display:flex;justify-content:space-between;margin-bottom:6px}
.pl{display:grid;grid-template-columns:9px 22px 24px minmax(0,1fr) auto;align-items:center;gap:7px;
padding:6px 7px;border-radius:var(--r);background:var(--panel);margin-bottom:3px;border-left:2px solid transparent}
.pl.hot{border-left-color:var(--alarm)}
.pl.capped .sc{color:var(--brass)}
.pl.buzzed{background:var(--panel2)}
.pl.onclock{box-shadow:inset 0 0 0 1px var(--brass)}
.pl.miss{opacity:.4}.pl.miss .nm{text-decoration:line-through}
.pl.gone .nm{color:var(--slate)}
.pl .dr{font-size:11.5px;color:var(--slate);text-align:right}
.pl .nm{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .sc{font-size:14.5px}
.pl.out{opacity:.5}.pl.out .sc{font-size:13px}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;border:1px solid var(--line)}
.av.ph{background:var(--panel2)}
.tko{color:var(--slate);font-size:11px}
.mk{font-size:11px}
.mk.rope{color:var(--brass)}
.mk.aim{color:#7FB2E8}
.mk.hunted{color:var(--alarm)}
.mk.bty{color:var(--brass);font-family:"IBM Plex Mono",monospace;font-size:10px}
.mk.rev{color:var(--live)}
.mk.bot{color:var(--slate);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase}
.av.brain{width:24px;height:24px;line-height:0;display:block}
.av.brain svg{display:block;border-radius:50%}
.ctrl{width:7px;height:7px;border-radius:50%;background:transparent}
.ctrl.on{background:var(--chalk);box-shadow:0 0 7px #EEEBE1AA}
.mk.lat{color:#4A5680;font-family:"IBM Plex Mono",monospace;font-size:9.5px}
.mk.lat.slow{color:var(--alarm)}
.latwarn{font-size:11px;color:var(--alarm);line-height:1.5;margin-top:6px}
.pl.control{box-shadow:inset 2px 0 0 var(--chalk)}
.bounties{font-size:11px;color:var(--slate);line-height:1.6}
.bounties b{color:var(--brass);font-weight:400}
.pl.out .sub{font-size:10px;color:var(--slate);display:block;line-height:1.3}
.clock{border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;background:var(--panel)}
.clock.soon{border-color:var(--brass)}
.clock .n{font-size:42px;line-height:.9;color:var(--brass);display:block}
.clock.soon .n{animation:pl 1s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.4}}
.clock .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.clock .who2{font-size:12px;margin-top:5px}
.dock{border-top:1px solid var(--line);background:var(--panel);padding:10px 14px;min-height:92px;display:flex;align-items:center;gap:14px}
.idle{color:var(--slate);font-size:13.5px}
.race{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.bz{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:var(--r);background:var(--panel2);font-size:13px}
.bz.on{box-shadow:inset 0 0 0 1px var(--brass);background:#243259}
.bz .t{font-size:12px;color:var(--slate)}
.bz .e{font-size:10px;color:var(--alarm)}
.bz.isbot{border:1px dashed var(--line)}
.rt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--alarm);
align-self:center;margin-left:6px}
.bhint{font-size:10px;margin-left:5px;letter-spacing:.04em}
.bhint.yes{color:var(--live)}
.bhint.no{color:var(--alarm)}
.acts{display:flex;gap:6px}
.act{padding:9px 15px;border-radius:var(--r);font-size:13.5px;border:1px solid var(--line);text-align:center;white-space:nowrap}
.act .kb{display:block;font-size:9.5px;color:var(--slate);margin-top:2px;letter-spacing:.08em}
.good{background:#17402F;border-color:#2C6B4F}.good:hover{background:#1D5540}
.bad{background:#3E1A17;border-color:#6B2C26}.bad:hover{background:#54221D}
.neu:hover{background:var(--panel2)}
.arm{background:#3A2E0C;border-color:var(--brass);color:var(--brass)}
.arm:hover{background:#4A3A0F}
.entry{position:fixed;left:0;right:250px;bottom:92px;background:#0E1526F2;border-top:2px solid var(--brass);
border-bottom:1px solid var(--brass);padding:14px 26px;z-index:60;display:flex;align-items:center;gap:22px;
animation:rise .22s cubic-bezier(.2,.8,.3,1);cursor:pointer}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.entry .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);display:block}
.entry .no{font-size:60px;line-height:.85;color:var(--brass)}
.entry .nm{font-size:30px;line-height:1.05}
.entry .who3{display:flex;align-items:baseline;gap:14px}
.entry .sub{font-size:11.5px;color:var(--slate);margin-left:auto;text-align:right;line-height:1.5}
@media (prefers-reduced-motion:reduce){.clock.soon .n,.entry{animation:none}}
/* end of match */
.fin{position:fixed;inset:0;background:#0A0E1CFA;z-index:90;display:flex;flex-direction:column;
align-items:center;justify-content:center;padding:26px;gap:4px;animation:fin .5s ease-out}
@keyframes fin{from{opacity:0}to{opacity:1}}
.fin .lbl{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--brass)}
.fin .nm{font-size:clamp(52px,13vw,150px);line-height:.92;color:var(--brass);text-align:center}
.fin .sub{font-size:15px;color:var(--slate);margin-top:10px;text-align:center}
.fin .stats{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap;justify-content:center}
.fin .stats div{text-align:center}
.fin .stats .v{font-size:30px}
.fin .stats .k{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--slate)}
.finmark{margin-bottom:22px;opacity:.95}
.finav{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--brass);margin-bottom:12px}
.shmenu{position:fixed;z-index:99;background:var(--panel);border:1px solid var(--brass);
border-radius:8px;padding:6px;box-shadow:0 16px 40px #000b;min-width:290px}
.shmenu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:var(--r)}
.shmenu button:hover{background:var(--panel2)}
.shmenu button b{display:block;font-weight:400;font-size:14px}
.shmenu button span{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.fin .more{margin-top:30px;display:flex;gap:8px}
.fin .more button{padding:10px 20px;border:1px solid var(--line);border-radius:var(--r);font-size:13.5px;color:var(--slate)}
.fin .more button:hover{color:var(--chalk);border-color:var(--slate)}
.board2{position:fixed;inset:0;background:#0A0E1CFA;z-index:91;display:flex;align-items:center;justify-content:center;padding:22px}
.b2{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:820px;width:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.b2 .hd2{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.b2 .hd2 .t2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate)}
.b2 .tabs2{margin-left:auto;display:flex;gap:4px}
.b2 .tabs2 button{padding:5px 12px;font-size:12px;color:var(--slate);border:1px solid var(--line);border-radius:var(--r)}
.b2 .tabs2 button.on{color:var(--brass);border-color:var(--brass)}
.b2 .tw2{overflow:auto}
.b2 table{width:100%;border-collapse:collapse;font-size:13px}
.b2 th{position:sticky;top:0;background:var(--panel);text-align:right;padding:8px 10px;font-weight:500;
font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line)}
.b2 th.s{color:var(--brass)}
.b2 td{padding:7px 10px;text-align:right;border-bottom:1px solid #1A2237;white-space:nowrap}
.b2 th:nth-child(2),.b2 td:nth-child(2){text-align:left}
.b2 tr.win td{color:var(--brass)}
@media (prefers-reduced-motion:reduce){.fin{animation:none}}
.pl[data-token]{cursor:pointer}
.pl[data-token]:hover{background:var(--panel2)}
.fix{position:fixed;inset:0;background:#0A0E1CD0;z-index:95;display:flex;align-items:center;justify-content:center}
.fixbox{background:var(--panel);border:1px solid var(--brass);border-radius:8px;padding:18px 20px;min-width:330px}
.fh{font-size:15px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.fh .fs{margin-left:auto;color:var(--brass);font-size:17px}
.fg{display:flex;gap:5px;margin-bottom:6px;flex-wrap:wrap}
.fg button{flex:1;min-width:52px;padding:7px 0;border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.fg button:hover{border-color:var(--brass);color:var(--brass)}
.fr{display:flex;gap:6px;margin-top:8px}
.fr input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:7px 9px;font:400 13px "IBM Plex Mono",monospace;min-width:0}
.fr button{padding:7px 13px;border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.fr button:hover{border-color:var(--slate)}
.fn{font-size:11px;color:var(--slate);margin-top:10px}
.chart{margin-top:16px;background:var(--ink);border-radius:var(--r);padding:8px 4px}
.feed{position:fixed;left:14px;bottom:104px;display:flex;flex-direction:column-reverse;gap:4px;z-index:30;pointer-events:none}
.ev{background:var(--panel2);border-left:2px solid var(--brass);padding:5px 10px;font-size:12px;max-width:330px;border-radius:0 var(--r) var(--r) 0}
.ev.elim{border-left-color:var(--alarm)}.ev.enter{border-left-color:var(--live)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand" id="brand"></span>
    <span class="st"><span class="k">Clue</span><span class="v num" id="s-clue">0</span></span>
    <span class="st"><span class="k">In</span><span class="v num" id="s-field">0</span></span>
    <span class="st"><span class="k">Queue</span><span class="v num" id="s-q">0</span></span>
    <span class="st ceil"><span class="k">Ceiling</span><span class="v num" id="s-ceil">&mdash;</span></span>
    <span class="otbadge" id="s-ot" style="display:none"></span>
    <span class="sp">
      <span class="dot" id="conn" title="server connection"></span>
      <button class="tb" id="admin" title="Opens on your unshared screen">Pop out answers &#8599;</button>
      <button class="tb" id="mute">Sound on</button>
      <button class="tb" id="undo" disabled title="Take back the last scored clue">Undo clue</button>
      <button class="tb" id="endm">End match</button>
      <span class="delayctl">
        <span class="k">Delay</span>
        <button class="dstep" data-d="-25" aria-label="less delay">&minus;</button>
        <input class="dval num" id="s-delay" type="number" step="25" min="0" max="2000" value="200">
        <button class="dstep" data-d="25" aria-label="more delay">+</button>
        <span class="k">ms</span>
      </span>
      <span class="ver num" id="ver" title="build version"></span>
    </span>
  </header>
  <div class="main">
    <section class="stage" id="stage" aria-label="Board"></section>
      <div class="lectern" id="lectern" aria-hidden="true"></div>
    <aside class="rail">
      <div><div class="sect"><span>In the ring</span><span id="ring-n"></span></div><div id="ring"></div>
        <div class="latwarn" id="latwarn"></div></div>
      <div class="clock" id="clock"><span class="lbl">Clues to next entry</span>
        <span class="n mq num" id="cd">&mdash;</span><div class="who2" id="who"></div></div>
      <div id="bty-wrap" style="display:none"><div class="sect"><span>Bounties</span><span id="bty-n"></span></div>
        <div class="bounties" id="bty"></div></div>
      <div><div class="sect"><span>Out &middot; by clues survived</span><span id="out-n"></span></div><div id="out"></div></div>
    </aside>
  </div>
  <footer class="dock" id="dock"><span class="idle">Connecting&hellip;</span></footer>
</div>
<div class="feed" id="feed" aria-live="polite"></div>
<p class="sr" id="sr" aria-live="assertive"></p>

<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { socket, gameId, hostKey, fmt, syncClock } from '/rumble.js';
import { scoreChart } from '/chart.js';
import { markSmall, markFull, wordmark, brainAvatar } from '/brand.js';
import { weaponToken } from '/tokens.js';
import * as sfx from '/sound.js';
import { summaryImage, fullStatsImage, statsCsv } from '/share.js';
const GID = gameId();

let S = null, prev = null, muted = false;
const $ = (id) => document.getElementById(id);
const say = (m, cls) => { const f = $('feed'), e = document.createElement('div');
  e.className = 'ev ' + (cls || ''); e.textContent = m; f.appendChild(e);
  setTimeout(() => e.remove(), 5000);
  while (f.children.length > 4) f.firstChild.remove();
  $('sr').textContent = m; };

// Cues are sample files now — see tools/make-audio.py. Synthesis got us to
// 'arcade'; a room and a reverb tail were what 'arena' needed.
const ac = () => sfx.unlock();
const sfxEntry = () => sfx.play('entry');
const sfxElim = (n) => sfx.chops(n);
const sfxWin = () => { sfx.play('entry'); setTimeout(() => sfx.play('entry'), 620); };

$('brand').innerHTML = markSmall(28);

socket.on('connect', () => {
  syncClock();
  $('conn').classList.add('on');
  socket.emit('host-join', { gameId: GID, hostKey: hostKey }, (r) => {
    if (r && r.error) return say('Host key rejected — check the console URL');
    if (r && r.state) apply(r.state);
  });
});
socket.on('disconnect', () => $('conn').classList.remove('on'));

// Pictures arrive once and are cached here; state pushes only say whether a
// player has one. Thirty data URLs on every push was most of the traffic.
const AVATARS = new Map();
socket.on('avatar', ({ token, dataUrl }) => { AVATARS.set(token, dataUrl); render && render(); });
const avatarOf = (p) => (p && p.hasAvatar ? AVATARS.get(p.token) : null) || null;
socket.on('state', apply);
socket.on('error-msg', (m) => say(m));
socket.on('resolved', (e) => {
  if (e.overtimeStarted) overtimeSplash('OVERTIME', 'Stakes start climbing',
    'Nobody else is coming. From here the clue values double every few clues until somebody breaks.');
  else if (e.overtimeRaised) overtimeSplash('\u00D7' + e.overtimeRaised.multiplier,
    'Stakes double', 'Every clue is now worth ' + e.overtimeRaised.multiplier + ' times face value.');
  for (const b of e.bountyCollected || []) {
    const by = (S.live || []).concat(S.out || []).find((p) => p.token === b.by);
    say(`${by ? by.name : 'Someone'} collects a ${fmt(b.amount)} bounty`, 'enter');
  }
  for (const b of e.bountyTurned || []) {
    const to = (S.live || []).find((p) => p.token === b.to);
    say(`${to ? to.name : 'The target'} keeps the ${fmt(b.amount)} that was spent on them`, 'enter');
  }
  if (e.bountyAbsorbed) say(`Unclaimed bounty of ${fmt(e.bountyAbsorbed.amount)} goes to the winner`, 'enter');
  if (e.focused) {
    const t = (S.out || []).concat(S.live || []).find((p) => p.token === e.focused);
    if (t) say(`All of it landed on ${t.name}`);
  }
  if ((e.backfired || []).length) say('That aim backfired — the whole pot, the wrong way', 'elim');
  if ((e.topRope || []).length && e.gain) say('Off the top rope', 'enter');
  for (const t of e.revived || []) {
    const p = (S.queue || []).find((x) => x.token === t);
    say(`${p ? p.name : 'A player'} gets a second life`, 'enter');
  }
  if (e.eliminated && e.eliminated.length) sfxElim(e.eliminated.length);
  if (e.fieldClear) say('Field cleared — +' + fmt(e.fieldClear.bonus) + ' bonus, board reset', 'enter');
  if (e.stumperDeduction) say('Stumper — everyone −' + e.stumperDeduction);
  if (e.totalWipe) say('Total wipe — highest score survives', 'elim');
});

function apply(next) {
  if (!next) return;
  const wasOpen = !!(prev && prev.race && prev.race.open);
  prev = S; S = next;
  const isOpen = !!(S.race && S.race.open);
  if (isOpen && !wasOpen) startLectern();
  if (!S.clue) stopLectern();
  detectEvents(); render();
}

// Entry and elimination are derived from state transitions rather than pushed
// as their own events, so a reconnect mid-match can't replay a horn.
function detectEvents() {
  if (!prev || !prev.live || !S.live) return;
  const was = new Set(prev.live.map((p) => p.token));
  const now = new Set(S.live.map((p) => p.token));
  const entered = S.live.filter((p) => !was.has(p.token));
  const gone = prev.live.filter((p) => !now.has(p.token));
  if (entered.length) { sfxEntry(); banner(entered); }
  gone.forEach((p) => say(p.name + ' out — survived ' + p.tenure + ' clues', 'elim'));
}

function banner(ps) {
  document.querySelectorAll('.entry').forEach((n) => n.remove());
  const d = document.createElement('div'); d.className = 'entry';
  d.innerHTML = '<div><span class="lbl">Entry</span></div>' +
    ps.map((p) => '<div class="who3"><span class="no mq num">' + p.draw +
      '</span><span class="nm mq">' + p.name + '</span></div>').join('') +
    '<div class="sub">' + (ps.length > 1 ? 'field cleared<br>two enter'
      : 'enters with ' + fmt(ps[0].score)) + '</div>';
  document.body.appendChild(d);
  const t = setTimeout(kill, 4000);
  function kill() { d.remove(); clearTimeout(t); removeEventListener('keydown', kill); }
  addEventListener('keydown', kill); d.onclick = kill;
}

function render() {
  if (S.phase === 'over') showFinish();
  const live = S.live || [], q = S.queue || [], out = S.out || [];
  $('s-clue').textContent = S.clues || 0;
  $('s-field').textContent = live.length;
  $('s-q').textContent = q.length;
  $('s-ceil').textContent = S.ceiling ? fmt(S.ceiling) : '—';
  const ot = $('s-ot');
  if (ot) {
    const o = S.overtime;
    ot.style.display = o ? '' : 'none';
    if (o) ot.textContent = `Overtime \u00D7${o.multiplier}`
      + (o.nextIn ? ` \u00B7 doubles in ${o.nextIn}` : ' \u00B7 max');
  }
  const dv = $('s-delay');
  if (dv && !delayDirty && document.activeElement !== dv && S.delay != null) dv.value = S.delay;
  if (S.version) $('ver').textContent = 'v' + S.version
    + (S.recording ? ' \u25CF rec' : '') + (S.corrections ? ' \u00B7 ' + S.corrections + ' fixed' : '');
  const u = $('undo'); if (u) u.disabled = !S.canUndo;
  if (S.phase === 'lobby') return renderLobby();
  if (S.clue) renderClue(); else renderBoard();

  const r = $('ring'); r.innerHTML = '';
  const race = S.race || {}, buzzes = race.buzzes || [], locked = race.lockedOut || [];
  const buzzed = new Set(buzzes.map((b) => b.token));
  const on = buzzes[0];
  live.slice().sort((a, b) => b.score - a.score).forEach((p) => {
    const d = document.createElement('div');
    d.className = 'pl' + (p.score < 600 ? ' hot' : '') + (p.capped ? ' capped' : '')
      + (locked.indexOf(p.token) >= 0 ? ' miss' : '')
      + (buzzed.has(p.token) ? ' buzzed' : '')
      + (on && on.token === p.token ? ' onclock' : '')
      + (p.connected ? '' : ' gone')
      + (S.control === p.token ? ' control' : '');
    d.dataset.token = p.token; d.dataset.name = p.name; d.tabIndex = 0;
    d.title = 'Click to correct this score';
    d.innerHTML = '<span class="ctrl' + (S.control === p.token ? ' on' : '') + '"'
      + (S.control === p.token ? ' title="picks the next clue"' : '') + '></span>'
      + '<span class="dr num">' + p.draw + '</span>'
      + (p.isBot ? '<span class="av brain" title="' + (p.level || 'robot') + '">'
            + brainAvatar(p.level || 'normie', 24) + '</span>'
          : avatarOf(p) ? '<img class="av" src="' + avatarOf(p) + '" alt="">'
          : p.tokenArt ? '<span class="av brain">'
            + weaponToken(p.tokenArt.art, 24, p.tokenArt.colour) + '</span>'
          : '<span class="av ph"></span>')
      + '<span class="nm">' + p.name
      + (p.connected ? '' : ' <span style="color:var(--alarm);font-size:10px">&#9676;</span>')
      + (p.pins ? ' <span class="tko" title="toss outs">&#9670;' + p.pins + '</span>' : '')
      + (p.topRope ? ' <span class="mk rope" title="on the top rope">&#9650;</span>' : '')
      + (p.target ? ' <span class="mk aim" title="aiming at '
          + ((S.live || []).find((x) => x.token === p.target) || {}).name + '">&#9678;</span>' : '')
      + ((p.targetedBy || []).length ? ' <span class="mk hunted" title="in someone\'s sights">&#9679;</span>' : '')
      + (p.bounty ? ' <span class="mk bty" title="bounty on their head">' + fmt(p.bounty) + '</span>' : '')
      + (p.isBot ? ' <span class="mk bot" title="robot player">' + (p.level || 'bot') + '</span>' : '')
      + (p.revivals ? ' <span class="mk rev" title="second life">&#8635;</span>' : '')
      + (p.latency != null ? ' <span class="mk lat' + (p.latency > 120 ? ' slow' : '')
          + '" title="one-way latency">' + Math.round(p.latency) + '</span>' : '')
      + '</span><span class="sc num">' + fmt(p.score) + '</span>';
    d.onclick = () => openCorrect(p);
    d.onkeydown = (e) => { if (e.key === 'Enter') openCorrect(p); };
    r.appendChild(d);
  });
  $('ring-n').textContent = live.length;

  // If the socket path is slower than the Zoom path, the delay compensation is
  // pointing the wrong way and players will hear the clue before they can buzz.
  const lats = live.map((p) => p.latency).filter((n) => n != null);
  const slow = lats.filter((n) => n > 120).length;
  const lw = $('latwarn');
  if (lw) {
    lw.textContent = slow
      ? `${slow} player${slow > 1 ? 's' : ''} over 120 ms — consider lowering the Zoom delay`
      : '';
  }

  const cd = S.cluesUntilNextEntry;
  $('clock').classList.toggle('soon', cd === 1);
  $('cd').textContent = (cd === null || cd === undefined) ? '—' : cd;
  $('who').innerHTML = q.length
    ? '<b>#' + q[0].draw + ' ' + q[0].name + '</b> next'
    : '<span style="color:var(--slate)">Queue empty</span>';

  const bw = $('bty-wrap'), bl = $('bty');
  if (bw) {
    const bs = S.bounties || [];
    bw.style.display = bs.length ? '' : 'none';
    $('bty-n').textContent = bs.length ? fmt(bs.reduce((n, b) => n + b.amount, 0)) : '';
    bl.innerHTML = bs.map((b) => `<div><b>${fmt(b.amount)}</b> on ${b.target} &mdash; ${b.placer}</div>`).join('');
  }

  const o = $('out'); o.innerHTML = '';
  out.slice().sort((a, b) => b.tenure - a.tenure).slice(0, 7).forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pl out';
    d.innerHTML = '<span class="ctrl"></span><span class="dr num">' + (i + 1) + '</span>'
      + (p.isBot ? '<span class="av brain">' + brainAvatar(p.level || 'normie', 24) + '</span>'
         : avatarOf(p) ? '<img class="av" src="' + avatarOf(p) + '" alt="">'
         : p.tokenArt ? '<span class="av brain">'
           + weaponToken(p.tokenArt.art, 24, p.tokenArt.colour) + '</span>'
         : '<span class="av ph"></span>')
      + '<span class="nm">' + p.name
      + '<span class="sub num">' + p.tenure + ' clues</span></span>'
      + '<span class="sc num">' + p.tenure + '</span>';
    o.appendChild(d);
  });
  $('out-n').textContent = out.length;
  renderDock();
}

// The room has been watching this board for an hour. When it ends, the screen
// should say so — not quietly stop updating.
let finishShown = false;
function showFinish() {
  if (finishShown) return;
  finishShown = true;
  const rows = S.standings || [];
  const champ = rows.find((p) => p.winner);
  const d = document.createElement('div'); d.className = 'fin';
  d.innerHTML = `<div class="finmark">${wordmark(460)}</div>` + (champ
    ? `${avatarOf(champ) || champ.avatar ? `<img class="finav" src="${avatarOf(champ) || champ.avatar}" alt="">` : ''}
       <div class="lbl">Last one standing</div>
       <div class="nm mq">${champ.name}</div>
       <div class="sub">entry number ${champ.draw} &middot; ${S.clues} clues played</div>
       <div class="stats">
         <div><div class="v num">${champ.tenure}</div><div class="k">clues survived</div></div>
         <div><div class="v num">${champ.correct}</div><div class="k">correct</div></div>
         <div><div class="v num">${champ.pins}</div><div class="k">toss outs</div></div>
         <div><div class="v num">${fmt(champ.drained)}</div><div class="k">drained</div></div>
       </div>`
    : `<div class="lbl">Match ended</div><div class="nm mq">No winner</div>
       <div class="sub">the match was ended before anyone was left standing</div>`);
  const more = document.createElement('div'); more.className = 'more';
  const b1 = document.createElement('button'); b1.textContent = 'Full standings';
  b1.onclick = showStandings;
  if (S.recording) {
    const b0 = document.createElement('button'); b0.textContent = 'Download match data';
    b0.onclick = () => window.open(`/api/match/${GID}/record?key=${encodeURIComponent(hostKey)}`, '_blank');
    more.appendChild(b0);
  }
  const bs = document.createElement('button'); bs.textContent = 'Share results \u25BE';
  bs.onclick = (e) => { e.stopPropagation(); shareMenu(bs); };
  const b2 = document.createElement('button'); b2.textContent = 'Hide';
  b2.onclick = () => d.remove();
  more.append(bs, b1, b2); d.appendChild(more);
  document.body.appendChild(d);
  $('sr').textContent = champ ? `${champ.name} is the last one standing` : 'Match ended';
  if (champ) sfxWin();
}

// Two evenly matched players will trade the same points back and forth for
// as long as you let them. The room needs to see the moment that stops.
function overtimeSplash(big, mid, sub) {
  document.querySelectorAll('.ot').forEach((n) => n.remove());
  const d = document.createElement('div'); d.className = 'ot';
  d.innerHTML = `<div class="h2 mq">${big}</div><div class="m mq">${mid}</div>
    <div class="s2">${sub}</div>`;
  document.body.appendChild(d);
  sfx.play('chop');
  $('sr').textContent = mid;
  const t = setTimeout(kill, 4200);
  function kill() { d.remove(); clearTimeout(t); removeEventListener('keydown', kill); }
  addEventListener('keydown', kill); d.onclick = kill;
}

// Five seconds, counted down the way a lectern does it.
let lecternTimer = null, lecternFrom = null;
function startLectern() {
  stopLectern();
  lecternFrom = performance.now();
  const el = $('lectern');
  el.classList.add('on');
  const tick = () => {
    const left = 5 - (performance.now() - lecternFrom) / 1000;
    const lit = Math.max(0, Math.ceil(left));
    el.innerHTML = Array.from({ length: 5 },
      (_, i) => `<i class="${i < lit ? 'lit' : ''}"></i>`).join('');
    if (lit <= 0) { stopLectern(); return; }
    lecternTimer = requestAnimationFrame(tick);
  };
  tick();
}
function stopLectern() {
  if (lecternTimer) cancelAnimationFrame(lecternTimer);
  lecternTimer = null;
  const el = $('lectern');
  if (el) { el.classList.remove('on'); }
}

function shareMenu(anchor) {
  document.querySelectorAll('.shmenu').forEach((n) => n.remove());
  const r = anchor.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'shmenu';
  m.style.left = r.left + 'px';
  m.style.top = (r.bottom + 8) + 'px';
  m.innerHTML = `
    <button data-a="sum"><b>Summary image</b><span>the winner, the graph, the top of each board</span></button>
    <button data-a="full"><b>Full stats image</b><span>graph and both tables, every player</span></button>
    <button data-a="csv"><b>Full stats data</b><span>one wide CSV, a row per player</span></button>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); removeEventListener('pointerdown', close, true); };
  setTimeout(() => addEventListener('pointerdown', close, true), 0);
  m.querySelectorAll('[data-a]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation();
    b.disabled = true; b.querySelector('b').textContent = 'Working\u2026';
    try {
      if (b.dataset.a === 'sum') await summaryImage(S);
      else if (b.dataset.a === 'full') await fullStatsImage(S);
      else statsCsv(S);
    } catch (err) { say('Could not build that file: ' + err.message); }
    close();
  });
}

let sTab = 'match', sKey = 'tenure', sDir = -1;
const SCOLS = {
  match: [['draw','Draw'],['name','Player'],['tenure','Clues'],['outOrder','Out'],
    ['correct','Correct'],['missed','Missed'],['pins','Toss outs'],['drained','Drained'],['peak','Peak']],
  buzz: [['draw','Draw'],['name','Player'],['att','Attempts'],['early','Early'],
    ['won','Won'],['rate','Win rate'],['avg','Avg ms'],['best','Best ms']],
};
const sVal = (p, k) => k === 'rate' ? (p.att ? p.won / p.att : 0) : (p[k] ?? (k === 'outOrder' ? 999 : 0));
function sCell(p, k) {
  if (k === 'name') return (p.winner ? '\u25C6 ' : '') + p.name;
  if (k === 'outOrder') return p.outOrder ? p.outOrder : '\u2014';
  if (k === 'rate') return p.att ? Math.round(p.won / p.att * 100) + '%' : '\u2014';
  if (k === 'peak' || k === 'drained') return fmt(p[k]);
  if (k === 'avg' || k === 'best') return p[k] == null ? '\u2014' : p[k].toFixed(1);
  return p[k];
}
function showStandings() {
  document.querySelectorAll('.board2').forEach((n) => n.remove());
  const rows = (S.standings || []).slice();
  const cols = SCOLS[sTab];
  rows.sort((a, b) => { const x = sVal(a, sKey), y = sVal(b, sKey);
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sDir || a.draw - b.draw; });
  const w = document.createElement('div'); w.className = 'board2';
  w.innerHTML = `<div class="b2">
    <div class="hd2"><span class="t2">Final standings</span>
      ${S.fastest ? `<span class="t2" style="color:var(--brass)">fastest buzz ${S.fastest.ms.toFixed(1)} ms &middot; ${S.fastest.name}</span>` : ''}
      <span class="tabs2"><button data-t="match" class="${sTab === 'match' ? 'on' : ''}">Match</button>
      <button data-t="buzz" class="${sTab === 'buzz' ? 'on' : ''}">Buzzers</button>
      <button id="close2">Close</button></span></div>
    ${S.history && S.history.length > 2 ? `<div class="chart">${
      scoreChart(S.history, (S.standings || []).map((p) => ({ token: p.token, name: p.name })),
        { winnerToken: (S.standings || []).find((p) => p.winner)?.token,
          width: 780, height: 250 })}</div>` : ''}
    <div class="tw2"><table><thead><tr>${cols.map(([k, l]) =>
      `<th data-k="${k}" class="${sKey === k ? 's' : ''}">${l}${sKey === k ? (sDir < 0 ? ' \u25BE' : ' \u25B4') : ''}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((p) => `<tr class="${p.winner ? 'win' : ''}">${
        cols.map(([k]) => `<td class="${k === 'name' ? '' : 'num'}">${sCell(p, k)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
  document.body.appendChild(w);
  w.querySelector('#close2').onclick = () => w.remove();
  w.querySelectorAll('th[data-k]').forEach((th) => th.onclick = () => {
    const k = th.dataset.k;
    if (k === sKey) sDir *= -1; else { sKey = k; sDir = (k === 'name' || k === 'draw' || k === 'best' || k === 'avg') ? 1 : -1; }
    showStandings();
  });
  w.querySelectorAll('.tabs2 button[data-t]').forEach((b) => b.onclick = () => {
    if (b.dataset.t === sTab) return;
    sTab = b.dataset.t; sKey = sTab === 'match' ? 'tenure' : 'won'; sDir = -1; showStandings();
  });
}

// Adjudication goes wrong in two ways: the wrong player was credited, or the
// value was. Undo covers the first; this covers the second, and anything else.
function openCorrect(p) {
  document.querySelectorAll('.fix').forEach((n) => n.remove());
  const el = document.createElement('div'); el.className = 'fix';
  const vals = [100, 200, 300, 400, 500, 1000];
  el.innerHTML = `<div class="fixbox">
    <div class="fh">Correct <b>${p.name}</b><span class="fs num">${fmt(p.score)}</span></div>
    <div class="fg">${vals.map((v) => `<button data-d="${-v}">&minus;${v}</button>`).join('')}</div>
    <div class="fg">${vals.map((v) => `<button data-d="${v}">+${v}</button>`).join('')}</div>
    <div class="fr"><input type="number" id="fixamt" placeholder="other amount" step="100">
      <button id="fixgo">Apply</button><button id="fixno">Cancel</button></div>
    <div class="fn">Corrections are logged. Undo clue takes back a whole clue instead.</div>
  </div>`;
  document.body.appendChild(el);
  const send = (delta) => { socket.emit('adjust-score', { token: p.token, delta }); el.remove(); };
  el.querySelectorAll('[data-d]').forEach((b) => b.onclick = () => send(Number(b.dataset.d)));
  el.querySelector('#fixgo').onclick = () => {
    const v = Number(el.querySelector('#fixamt').value);
    if (v) send(v); else el.remove();
  };
  el.querySelector('#fixno').onclick = () => el.remove();
  el.onclick = (e) => { if (e.target === el) el.remove(); };
  setTimeout(() => el.querySelector('#fixamt').focus(), 50);
}

function renderBoard() {
  const g = document.createElement('div'); g.className = 'grid';
  (S.board || []).forEach((cat, ci) => {
    const col = document.createElement('div'), h = document.createElement('div');
    h.className = 'cat';
    h.innerHTML = '<div class="src">' + (cat.source === 'original' ? 'TTG' : 'J!') + '</div>'
      + '<div>' + cat.title + '</div>' + (cat.note ? '<div class="note">' + cat.note + '</div>' : '');
    const v = document.createElement('button'); v.className = 'veto'; v.textContent = '\u21BB';
    v.setAttribute('aria-label', 'Reroll ' + cat.title);
    v.onclick = (e) => { e.stopPropagation(); socket.emit('veto', { slot: ci }); say('Category rerolled'); };
    h.appendChild(v);
    const st = document.createElement('div'); st.className = 'stack';
    cat.clues.forEach((c) => {
      const b = document.createElement('button'); b.className = 'cell num';
      const worth = c.value ?? [100, 200, 300, 400, 500][c.row - 1];
      b.textContent = c.revealed ? '' : '$' + worth.toLocaleString();
      if (!c.revealed && worth > [100, 200, 300, 400, 500][c.row - 1]) b.classList.add('raised');
      b.disabled = !!c.revealed;
      b.onclick = () => socket.emit('pick-clue', { slot: ci, row: c.row });
      st.appendChild(b);
    });
    col.appendChild(h); col.appendChild(st); g.appendChild(col);
  });
  $('stage').innerHTML = ''; $('stage').appendChild(g);
}

function renderClue() {
  const c = S.clue, locked = (S.race && S.race.lockedOut) || [];
  const names = (S.live || []).filter((p) => locked.indexOf(p.token) >= 0).map((p) => p.name);
  $('stage').innerHTML = '<div class="clue">'
    + '<div class="cmeta">' + c.category + ' &middot; <span class="v">$' + c.value + '</span>'
      + (S.overtime && S.overtime.multiplier > 1
        ? ' <span style="color:var(--alarm)">&times;' + S.overtime.multiplier + ' overtime</span>' : '')
      + '</div>'
    + (c.note ? '<div class="cnote">' + c.note + '</div>' : '')
    + '<div class="ctxt">' + c.text + '</div>'
    + (names.length ? '<div class="locked">Locked out: ' + names.join(', ') + '</div>' : '')
    + '</div>';
}

function renderDock() {
  const d = $('dock');
  if (!S.clue) { d.innerHTML = '<span class="idle">Pick a clue to start the next race.</span>'; return; }
  const race = S.race || {}, buzzes = race.buzzes || [], on = buzzes[0];
  if (!race.open && !buzzes.length) {
    d.innerHTML = '<div class="race"><span class="idle">Read the clue aloud, then arm.</span></div>'
      + '<div class="acts"><button class="act arm" id="arm">Arm buzzers<span class="kb">space</span></button></div>';
    $('arm').onclick = () => socket.emit('activate');
    return;
  }
  const chips = buzzes.map((b, i) => '<span class="bz' + (i === 0 ? ' on' : '')
    + (b.bot ? ' isbot' : '') + '"><span>' + b.name
    + (b.early ? ' <span class="e">EARLY</span>' : '')
    + (b.bot ? ' <span class="bhint ' + (b.botCorrect ? 'yes' : 'no') + '">'
        + (b.botCorrect ? 'will be right' : 'will be wrong') + '</span>' : '')
    + '</span><span class="t num">' + b.ms.toFixed(1) + '</span></span>').join('');
  const acts = on
    ? '<button class="act good" id="ok">Correct<span class="kb">Y</span></button>'
      + '<button class="act bad" id="no">Wrong &middot; re-toss<span class="kb">N</span></button>'
      + '<button class="act neu" id="stump">Nobody got it<span class="kb">X</span></button>'
    : '<button class="act neu" id="stump">Nobody got it<span class="kb">X</span></button>';
  const retoss = S.retoss || 0;
  const idle = retoss
    ? '<span class="idle">Re-tossed &mdash; buzzers live again for everyone else.</span>'
    : '<span class="idle">Buzzers live &mdash; waiting.</span>';
  d.innerHTML = '<div class="race">' + (chips || idle)
    + (retoss ? '<span class="rt">back out ' + retoss + '&times;</span>' : '')
    + '</div><div class="acts">' + acts + '</div>';
  if (on) {
    $('ok').onclick = () => socket.emit('resolve', { winnerToken: on.token });
    $('no').onclick = () => socket.emit('mark-wrong', { token: on.token });
  }
  $('stump').onclick = () => socket.emit('resolve', { winnerToken: null });
}

addEventListener('keydown', (e) => {
  if (document.querySelector('.entry')) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if (!S || !S.clue) return;
  const race = S.race || {}, buzzes = race.buzzes || [], on = buzzes[0];
  const k = (e.key || '').toLowerCase();
  if (e.code === 'Space' && !race.open && !buzzes.length) { e.preventDefault(); socket.emit('activate'); }
  else if (k === 'y' && on) { e.preventDefault(); socket.emit('resolve', { winnerToken: on.token }); }
  else if (k === 'n' && on) { e.preventDefault(); socket.emit('mark-wrong', { token: on.token }); }
  else if (k === 'x') { e.preventDefault(); socket.emit('resolve', { winnerToken: null }); }
});

// Answers live in a separate window so the shared screen never shows them.
let adminWin = null;
on('admin', 'onclick', () => {
  if (adminWin && !adminWin.closed) { adminWin.focus(); return; }
  adminWin = window.open('/admin/' + GID + '#' + hostKey, 'rumble-admin',
    'width=540,height=660,menubar=no,toolbar=no');
  if (!adminWin) say('Popup blocked — allow popups for this site');
});
on('mute', 'onclick', (e) => { muted = !muted; sfx.setMuted(muted);
  e.target.textContent = muted ? 'Sound off' : 'Sound on'; if (!muted) sfx.unlock(); });
// Adjustable mid-match: nobody can tell you the delay is wrong until they have
// tried to buzz on a real clue.
let delayDirty = false;
const sendDelay = (v) => {
  const el = $('s-delay');
  const n = Math.max(0, Math.min(2000, Math.round(v)));
  if (el) el.value = n;
  delayDirty = false;
  socket.emit('set-delay', { delay: n });
};

// Bind through a helper. A missing element used to throw here and take every
// binding below it with it — which is how one absent input silently disabled
// the End match button.
function on(id, event, fn) {
  const el = $(id);
  if (!el) { console.warn('no element #' + id); return; }
  el[event] = fn;
}

document.querySelectorAll('.dstep').forEach((b) => b.onclick = () => {
  sendDelay(Number(($('s-delay') || {}).value || 0) + Number(b.dataset.d));
});
on('s-delay', 'oninput', () => { delayDirty = true; });
on('s-delay', 'onchange', () => sendDelay(Number($('s-delay').value || 0)));
on('s-delay', 'onkeydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('s-delay').blur(); } });

on('undo', 'onclick', () => socket.emit('undo-clue'));
on('endm', 'onclick', () => { if (confirm('End the match now?')) socket.emit('end-match'); });
socket.on('undone', (d) => say(`Took back ${d.category} $${d.value}`));
socket.on('adjusted', (d) => say(`${d.name} corrected by ${d.delta > 0 ? '+' : ''}${fmt(d.delta)} to ${fmt(d.to)}`));
sfx.preload();
addEventListener('pointerdown', () => sfx.unlock(), { once: true });
addEventListener('keydown', () => sfx.unlock(), { once: true });
</script>
</body>
</html>
