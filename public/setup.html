<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J! Royal Rumble — set up a match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;
--chalk:#EEEBE1;--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:4px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.mq{font-family:"Anton",Impact,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:840px;margin:0 auto;padding:26px 20px 70px}
h1{font:400 clamp(30px,6vw,50px)/1 "Anton",Impact,sans-serif;margin:0;color:var(--brass)}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:2px}
.hero svg{flex:none;border-radius:50%}
.tag{font-size:12.5px;color:var(--slate);margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin:0 0 14px;font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.f .hint{font-size:11px;color:var(--slate);font-style:italic}
input[type=number],input[type=text],select{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:8px 10px;font:400 14px "IBM Plex Mono",monospace;min-width:0}
input[type=text].wide{font-family:"IBM Plex Sans",sans-serif}
select{font-family:"IBM Plex Sans",sans-serif}
.code{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.code .big{font:400 clamp(46px,12vw,86px)/.9 "Anton",Impact,sans-serif;color:var(--brass);letter-spacing:.09em}
.code .side{font-size:12.5px;color:var(--slate);line-height:1.7}
.code .side code{font-family:"IBM Plex Mono",monospace;color:var(--chalk);background:var(--ink);padding:2px 7px;border-radius:var(--r)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px 4px 4px;background:var(--panel2);border-radius:20px;font-size:13px;
border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px}
.chip img,.chip svg{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;flex:none}
.chip.bot{border-style:dashed;color:var(--slate)}
.chip.bot{padding-left:4px}
.chip .lvl{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
color:var(--slate);margin-left:2px}
.chip.bot svg{flex:none;border-radius:50%}
.botlist{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
.botlist span{font-size:11.5px;color:var(--slate);background:var(--ink);
border:1px solid var(--line);border-radius:var(--r);padding:4px 9px}
.chip:not(:has(img)){padding-left:12px}
.chip.off{opacity:.4}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.src{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--ink)}
.src.on{border-color:var(--brass)}
.src .t{display:flex;align-items:baseline;gap:8px;font-size:14px}
.src .pct{margin-left:auto;color:var(--brass);font-size:15px}
.src.off .pct{color:var(--slate)}
.src .n{font-size:11px;color:var(--slate);margin-top:3px}
.src input[type=range]{width:100%;margin-top:9px}
.src.off input[type=range]{opacity:.3}
.up{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--slate);font-size:13px}
.up.drag{border-color:var(--brass);color:var(--chalk)}
.queued{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.qf{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
border-radius:20px;padding:5px 12px;font-size:12.5px}
.qf .x{color:var(--slate);padding:0 2px}.qf .x:hover{color:var(--alarm)}
.upbtn{padding:9px 22px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:14px}
.upbtn:disabled{opacity:.3;border-color:var(--line);color:var(--slate);cursor:default}
.upbtn.busy{opacity:.6;cursor:progress}
.files{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.file{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:var(--r);padding:7px 11px;font-size:13px}
.file .n{color:var(--slate);font-size:12px;margin-left:auto}
.file .x{color:var(--slate);padding:0 4px}.file .x:hover{color:var(--alarm)}
.msg{font-size:12.5px;margin-top:9px}
.msg.bad{color:var(--alarm)}.msg.good{color:var(--live)}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 24%);padding:22px 0 0;margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{padding:14px 32px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:16px}
.go:disabled{opacity:.32;border-color:var(--line);color:var(--slate);cursor:default}
.alt{padding:12px 18px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;color:var(--slate)}
.alt:hover{color:var(--chalk);border-color:var(--slate)}
.note{font-size:12px;color:var(--slate)}
.est{font-size:12.5px;color:var(--slate)}
.est b{color:var(--brass);font-weight:400}
.rec{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rec input{margin-top:4px;flex:none}
.rec b{font-weight:400}
.adv{padding:11px 0;border-top:1px solid var(--line)}
.adv:first-of-type{border-top:none;padding-top:0}
.hint2{display:block;font-size:12px;color:var(--slate);line-height:1.5;margin-top:4px}
.wrn{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px 12px;
border-radius:var(--r);font-size:12.5px;line-height:1.5;border-left:2px solid var(--line);background:var(--ink)}
.wrn.warn{border-left-color:var(--brass);color:var(--chalk)}
.wrn.note{border-left-color:var(--line);color:var(--slate)}
.wfix{flex:none;align-self:center;border:1px solid var(--brass);color:var(--brass);
border-radius:var(--r);padding:5px 11px;font-size:12px;white-space:nowrap}
.wfix:hover{background:#3A2E0C}
.start{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}

.manual{display:inline-block;margin-top:7px;color:var(--brass);text-decoration:none;
border-bottom:1px solid #6A4509;font-size:13px}
.manual:hover{border-bottom-color:var(--brass)}

/* robot editor */
.chip.bot{cursor:pointer}
.chip.bot:hover{border-color:var(--brass)}
.botedit{position:fixed;inset:0;background:#0A0E1CE8;z-index:60;display:flex;
align-items:center;justify-content:center;padding:18px}
.bebox{background:var(--panel);border:1px solid var(--brass);border-radius:10px;
padding:16px 18px;width:100%;max-width:340px;box-shadow:0 20px 60px #000b}
.bebox h3{margin:0 0 3px;font:400 18px "IBM Plex Sans",sans-serif;color:var(--chalk)}
.bebox .cur{font-size:12px;color:var(--slate);margin-bottom:13px;line-height:1.5}
.belvl{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;
border-radius:var(--r);background:var(--ink);margin-bottom:5px;font-size:14px;
border:1px solid var(--line);text-align:left;color:var(--chalk);cursor:pointer}
.belvl:hover{border-color:var(--brass)}
.belvl.on{border-color:var(--brass);color:var(--brass)}
.belvl .bd{font-size:11px;color:var(--slate);margin-left:auto;text-align:right}
.bebox .rm{width:100%;margin-top:9px;padding:10px;border:1px solid var(--line);
border-radius:var(--r);font-size:13px;color:var(--slate);background:none;cursor:pointer}
.bebox .rm:hover{border-color:var(--alarm);color:var(--alarm)}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="note">Loading…</p></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { estimate as estimateFor, warnings as warningsFor } from '/estimate.js';
import { markFull, brainAvatar } from '/brand.js';
import { weaponToken } from '/tokens.js';
import * as sfx from '/sound.js';
const socket = io({ transports: ['websocket'] });
let code = location.pathname.split('/')[2] || '';
let hostKey = location.hash.slice(1);
let lastBots = [];
let S = null, msg = null, mix = { archive: 100, original: 0, upload: 0 };
const root = document.getElementById('root');
const fmt = (n) => (n ?? 0).toLocaleString();

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts,
    headers: { 'content-type': 'application/json', 'x-host-key': hostKey, ...(opts.headers || {}) } });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'request failed');
  return j;
};

sfx.preload();
// Browsers hold audio until the page has been interacted with. The host will
// have clicked something on this page long before anyone joins.
sfx.armUnlock();

async function boot() {
  if (!code) {
    const m = await (await fetch('/api/match', { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: '{}' })).json();
    code = m.gameId; hostKey = m.hostKey;
    history.replaceState(null, '', `/setup/${code}#${hostKey}`);
  }
  S = await api(`/api/match/${code}`);
  mix = toPct(S.blend, S.available);
  socket.emit('watch-setup', { gameId: code, hostKey }, () => {});
  socket.on('state', (s) => { if (s.roster) { S.roster = s.roster; renderRoster(); } });
  render();
}

// Pictures arrive once and are cached here; state pushes only say whether a
// player has one — thirty data URLs on every push was most of the traffic.
//
// These live at module scope on purpose. An earlier patch inserted them inside
// boot(), which put avatarOf out of reach of renderRoster: the roster silently
// stopped drawing, and because renderRoster threw, wire() never ran either and
// the start button went dead with it.
const AVATARS = new Map();
const avatarOf = (p) => (p && p.hasAvatar ? AVATARS.get(p.token) : null) || null;

// Repaint only the roster. A full render() rebuilds every input from the last
// saved state, which would discard anything the host had typed.
socket.on('avatar', ({ token, dataUrl }) => {
  AVATARS.set(token, dataUrl);
  renderRoster();
});

// Blend weights on the server are relative; the host thinks in percentages.
function toPct(blend, avail) {
  const usable = SRC.map(([k]) => k).filter((k) => (avail[k] || 0) > 0);
  const total = usable.reduce((n, k) => n + (blend[k] || 0), 0);
  if (!total) {
    const first = usable[0] || 'archive';
    return Object.fromEntries(SRC.map(([k]) => [k, k === first ? 100 : 0]));
  }
  const out = {}, raw = {};
  usable.forEach((k) => { raw[k] = (blend[k] || 0) / total * 100; });
  usable.forEach((k) => { out[k] = Math.round(raw[k] / 5) * 5; });
  SRC.forEach(([k]) => { if (!(k in out)) out[k] = 0; });
  return settle(out, usable[0]);
}

// Rounding to 5% steps can leave the total at 95 or 105; push the slack onto
// whichever source the host wasn't touching.
function settle(m, absorb) {
  const keys = SRC.map(([k]) => k);
  let diff = 100 - keys.reduce((n, k) => n + m[k], 0);
  if (!diff) return m;
  const order = [absorb, ...keys.filter((k) => k !== absorb)]
    .filter((k) => (S.available[k] || 0) > 0);
  for (const k of order) {
    const next = Math.min(100, Math.max(0, m[k] + diff));
    diff -= next - m[k];
    m[k] = next;
    if (!diff) break;
  }
  return m;
}

// Moving one slider takes the difference proportionally from the others, so
// the host never has to do arithmetic to make the numbers add up.
function setPct(key, value) {
  const others = SRC.map(([k]) => k)
    .filter((k) => k !== key && (S.available[k] || 0) > 0);
  const v = Math.max(0, Math.min(100, value));
  const remain = 100 - v;
  const sum = others.reduce((n, k) => n + mix[k], 0);
  const next = { ...mix, [key]: v };
  if (!others.length) { next[key] = 100; }
  else if (sum === 0) {
    const each = Math.floor(remain / others.length / 5) * 5;
    others.forEach((k, i) => { next[k] = i === 0 ? remain - each * (others.length - 1) : each; });
  } else {
    others.forEach((k) => { next[k] = Math.round(mix[k] / sum * remain / 5) * 5; });
  }
  SRC.forEach(([k]) => { if ((S.available[k] || 0) === 0) next[k] = 0; });
  mix = settle(next, others[0] || key);
  paintMix();
}

function paintMix() {
  SRC.forEach(([k]) => {
    const box = document.querySelector(`.src[data-src="${k}"]`);
    if (!box) return;
    const pct = mix[k] || 0;
    box.querySelector(`[data-pct="${k}"]`).textContent = pct + '%';
    const sl = box.querySelector('input[type=range]');
    if (Number(sl.value) !== pct) sl.value = pct;
    box.classList.toggle('on', pct > 0);
    box.classList.toggle('off', pct === 0);
  });
}

const estimate = () => estimateFor(S.roster.length, S.settings);
const warnings = () => warningsFor(S.roster.length, S.settings);

const SRC = [
  ['archive', 'Jeopardy! archive', null],
  ['original', 'Custom categories', 'Boards written for TTG and LearningMan'],
  ['upload', 'Uploaded this match', 'Fresh material you add below'],
];

// Anything the host has typed but not saved. Applied after a repaint so a
// roster change can't roll their edits back.
function captureEdits() {
  const out = {};
  document.querySelectorAll('#root input, #root select').forEach((el) => {
    if (!el.id) return;
    out[el.id] = el.type === 'checkbox' ? el.checked : el.value;
  });
  return out;
}
function restoreEdits(saved) {
  for (const [id, v] of Object.entries(saved || {})) {
    const el = document.getElementById(id);
    if (!el || el.type === 'file') continue;
    if (el.type === 'checkbox') el.checked = v; else el.value = v;
  }
}

function render(keepEdits) {
  const edits = keepEdits ? captureEdits() : null;
  const est = estimate(), s = S.settings;
  root.innerHTML = `
  <div class="hero">${markFull(84)}<h1>Set up a Rumble</h1></div>
  <div class="tag">Read the room code aloud. Only people who have it can join.
    <a class="manual" href="/handbook" target="_blank" rel="noopener">Handbook &mdash; rules, mechanics and the design behind them &#8599;</a></div>

  <div class="card"><h2>Room code</h2>
    <div class="code">
      <span class="big" id="rc">${code}</span>
      <div class="side">
        Players go to <code>${location.origin}/join</code> and enter this code.<br>
        Or send them <code>${location.origin}/j/${code}</code> — the code is filled in, they still confirm it.
      </div>
    </div>
  </div>

  <div class="card"><h2>Signed up <span id="rn" style="color:var(--brass)">${S.roster.length}</span></h2>
    <div class="who" id="who"></div>
    ${est ? `<p class="est" style="margin:14px 0 0">With ${S.roster.length} players: entry every <b>${est.iv}</b> clues${
        est.auto ? ' (auto)' : ''}, roughly <b>${est.mins} minutes</b>, about ${est.clues} clues.${est.rough ? ' Rough at this size.' : ''}</p>`
      : `<p class="note" style="margin:14px 0 0">Three players minimum.</p>`}
    <div id="warn"></div>
  </div>

  <div class="card"><h2>Robot players</h2>
    <p class="note" style="margin:-4px 0 12px">For testing, or for filling out a thin roster.
    They buzz on a real clock with reaction times drawn from their skill, so the race fills in
    the way it does with people. The console tells you whether each one is about to be right.</p>
    <div class="row">
      <div class="f"><label>How many</label>
        <input type="number" id="botcount" value="6" min="1" max="30" style="width:78px">
        <span class="hint">up to 30 in the room altogether</span></div>
      <div class="f"><label>Buzzer scale</label>
        <select id="botprofile">
          <option value="observed" selected>Matt's model (as written)</option>
          <option value="broadcast">Show statistics (3,339 real games)</option>
          <option value="measured">This game's own players</option>
        </select><span class="hint">click a robot below to change its standard</span></div>
      <div class="f"><label>Standard</label>
        <select id="botlevel">
          <option value="">Mixed</option>
          <option value="rookie">All rookie</option>
          <option value="normie">All normie</option>
          <option value="champ">All champ</option>
          <option value="superchamp">All superchamp</option>
          <option value="elite">All elite</option>
        </select><span class="hint">mixed draws across the range</span></div>
      <button class="alt" id="addbots">Add robots</button>
      ${(S.roster || []).some((p) => p.isBot) ? '<button class="alt" id="rmbots">Remove all robots</button>' : ''}
    </div>
    <div class="botlist" id="botlist"></div>
  </div>

  <div class="card"><h2>Clue material</h2>
    <div class="mix">${SRC.map(([k, t, d]) => {
      const pct = mix[k] ?? 0, avail = S.available[k] || 0;
      const [lo, hi] = s.seasonRange || S.seasons;
      const desc = d ?? `Seasons ${lo}–${hi}, media clues removed`;
      return `<div class="src ${pct > 0 ? 'on' : 'off'}" data-src="${k}">
        <div class="t"><span>${t}</span><span class="pct num" data-pct="${k}">${pct}%</span></div>
        <div class="n">${avail ? fmt(avail) + ' categories' : 'none available'} — ${desc}</div>
        <input type="range" min="0" max="100" step="5" value="${pct}" data-w="${k}" ${avail ? '' : 'disabled'}>
      </div>`; }).join('')}</div>
    <p class="note" style="margin:10px 0 0">The mix always totals 100%. Raise one and the others give way.</p>
    <div class="row" style="margin-top:14px">
      <div class="f"><label>Archive seasons</label>
        <div class="row" style="gap:6px">
          <input type="number" id="s-lo" value="${(s.seasonRange || S.seasons)[0]}" min="${S.seasons[0]}" max="${S.seasons[1]}" style="width:78px">
          <input type="number" id="s-hi" value="${(s.seasonRange || S.seasons)[1]}" min="${S.seasons[0]}" max="${S.seasons[1]}" style="width:78px">
        </div>
        <span class="hint">${S.seasons[0]} is 2005, ${S.seasons[1]} is ${2004 + S.seasons[1] - S.seasons[0] + 1}</span></div>
      <button class="alt" id="mine">Use only my own material</button>
    </div>
  </div>

  <div class="card"><h2>Add fresh material</h2>
    <div class="up" id="drop">
      Drop files here, or <label style="color:var(--brass);cursor:pointer;text-decoration:underline">choose
      <input type="file" id="file" multiple accept=".json,.csv" hidden></label><br>
      <span style="font-size:11.5px">j-trivia.org JSON &nbsp;·&nbsp; jparty.tv CSV</span>
    </div>
    <div class="queued" id="queued"></div>
    <div class="row" style="margin-top:10px;align-items:center">
      <button class="upbtn" id="upbtn" disabled>Upload</button>
      <span class="note" id="qnote">Nothing waiting.</span>
    </div>
    <div class="files" id="files"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card"><h2>Rules</h2>
    <div class="row">
      ${num('startScore', 'Starting score', s.startScore, 'what every entrant walks in with')}
      ${num('ceiling', 'Score ceiling', s.ceiling, 'clips every live score')}
      <div class="f"><label>Ceiling change / clue</label>
        <select id="decayMode">
          <option value="auto" ${s.ceilingDecayPerClue == null ? 'selected' : ''}>Auto</option>
          <option value="fixed" ${s.ceilingDecayPerClue == null ? '' : 'selected'}>Set a number</option>
        </select><span class="hint">auto holds the ceiling steady while overtime is on</span></div>
      <div class="f" id="decaywrap" style="${s.ceilingDecayPerClue == null ? 'display:none' : ''}">
        <label>Per clue</label>
        <input type="number" id="ceilingDecayPerClue" value="${s.ceilingDecayPerClue ?? -40}" step="5" style="width:96px">
        <span class="hint">negative decays &mdash; favours late draws</span></div>
      <div class="f"><label>Ceiling floor</label>
        <select id="floorMode">
          <option value="auto" ${s.ceilingFloor == null ? 'selected' : ''}>Auto — match the starting score</option>
          <option value="fixed" ${s.ceilingFloor == null ? '' : 'selected'}>Set a number</option>
        </select><span class="hint">can never sit below the starting score</span></div>
      <div class="f" id="floorwrap" style="${s.ceilingFloor == null ? 'display:none' : ''}">
        <label>Floor</label>
        <input type="number" id="ceilingFloor" value="${s.ceilingFloor ?? s.startScore}" style="width:104px">
        <span class="hint">&nbsp;</span></div>
    </div>
    <div class="row" style="margin-top:14px">
      <div class="f"><label>New entrant frequency</label>
        <select id="entryMode">
          <option value="auto" ${s.entryInterval == null ? 'selected' : ''}>Auto</option>
          <option value="fixed" ${s.entryInterval == null ? '' : 'selected'}>Every N clues</option>
        </select><span class="hint">auto scales to the roster and target length</span></div>
      <div class="f" id="ivwrap" style="${s.entryInterval == null ? 'display:none' : ''}">
        <label>N</label><input type="number" id="entryInterval" value="${s.entryInterval ?? 5}" min="1" max="30" style="width:80px">
        <span class="hint">clues between entries</span></div>
      ${num('targetMinutes', 'Target length (min)', s.targetMinutes, 'used when entry is automatic')}
      <div class="f"><label>Stumper deduction</label>
        <select id="stumperFraction">
          ${[['0','off'],['0.25','quarter value'],['0.5','half value'],['1','full value']]
            .map(([v, t]) => `<option value="${v}" ${Number(s.stumperFraction) === Number(v) ? 'selected' : ''}>${t}</option>`).join('')}
        </select><span class="hint">when nobody gets a clue</span></div>
      <div class="f"><label>Scoring</label>
        <select id="potScoring">
          <option value="true" ${s.potScoring ? 'selected' : ''}>Collect from each opponent</option>
          <option value="false" ${s.potScoring ? '' : 'selected'}>Flat clue value</option>
        </select><span class="hint">flat scoring hands the win to the last draw</span></div>
    </div>
  </div>

  <div class="card"><h2>Advanced mechanics</h2>
    <p class="note" style="margin:-4px 0 14px">All off by default. They change how the game plays,
    not just how it looks — and they lean on keyboard controls, so think twice if the field is on phones.</p>
    ${adv('topRope', 'Top rope', s.topRope,
      'A player can climb up between clues. That clue is worth double to them in both directions — '
      + 'and their winnings ignore the ceiling, so the leaders have a reason to risk it too.')}
    ${adv('targeting', 'Targeting', s.targeting,
      'Aim at one player. Get it right and the whole pot comes out of them alone, everyone else spared. '
      + 'Get it wrong and they answer, and you pay the whole pot yourself. Visible to the room.')}
    ${adv('bounties', 'Bounties', s.bounties,
      'A player waiting in the queue can put part of their own stake on somebody\'s head. Whoever '
      + 'knocks them out collects. Survive to the end and you keep it — knock out the person who '
      + 'placed it and you keep it too.')}
    ${adv('revival', 'Revival', s.revival,
      'Eliminated players go back to the queue instead of out. Expect the match to run about half '
      + 'again as long.')}
    <div class="row" id="revrow" style="${s.revival ? '' : 'display:none'};margin-top:4px">
      ${num('revivalLimit', 'Lives each', s.revivalLimit, 'how many times one player can come back')}
      <div class="f"><label>Return on</label>
        <select id="revivalFraction">
          ${[['0.25','a quarter of the stake'],['0.5','half the stake'],['0.75','three quarters'],['1','the full stake']]
            .map(([v,t]) => `<option value="${v}" ${Number(s.revivalFraction) === Number(v) ? 'selected' : ''}>${t}</option>`).join('')}
        </select><span class="hint">lower makes a second life shorter</span></div>
    </div>
  </div>

  <div class="card"><h2>Recording</h2>
    <label class="rec"><input type="checkbox" id="recordMatch" ${s.recordMatch ? 'checked' : ''}>
      <span><b>Record detailed match data</b>
      <span class="hint2">Every clue, every buzz time, the score of everyone in the ring, entries,
      eliminations, corrections, and how the length compared with the estimate. Downloadable as JSON
      when the match ends. Off by default — a recorded match keeps more in memory.</span></span></label>
  </div>

  <div class="card"><h2>Timing</h2>
    <div class="row">
      ${num('delay', 'Zoom delay (ms)', s.delay, 'holds the buzzers to match your audio')}
      ${num('lockout', 'Early-buzz lockout (ms)', s.lockout, 'penalty for jumping the lights')}
      ${num('secondsPerClue', 'Seconds per clue', s.secondsPerClue, 'your pace, used for estimates')}
    </div>
    <p class="note" style="margin:12px 0 0">Sockets beat Zoom audio by roughly 150&ndash;200&nbsp;ms. The delay holds every
    buzzer until your voice actually arrives, and it anchors spectator times to the same instant.</p>
  </div>

  <div class="foot">
    <button class="go" id="start" ${S.roster.length < 3 ? 'disabled' : ''}>Start the Rumble</button>
    <button class="alt" id="save">Save settings</button>
    <span class="note" id="savemsg"></span>
    <span class="note num" style="margin-left:auto">v${S.version || '?'} &middot; room ${code}</span>
  </div>`;

  renderRoster(); renderWarnings(); renderFiles(); wire();
  if (edits) restoreEdits(edits);
}

const adv = (k, label, on, blurb) =>
  `<label class="rec adv"><input type="checkbox" id="${k}" ${on ? 'checked' : ''}>
    <span><b>${label}</b><span class="hint2">${blurb}</span></span></label>`;

const num = (k, label, val, hint) =>
  `<div class="f"><label>${label}</label>
    <input type="number" id="${k}" value="${val}" style="width:118px">
    <span class="hint">${hint}</span></div>`;

// Somebody signing up. Counted rather than event-driven, so a state resend
// cannot chime twice for the same person, and never on the first paint — the
// host should not hear six chimes because six people were already waiting.
let lastRosterCount = null;
function joinChime(n) {
  if (lastRosterCount != null && n > lastRosterCount) sfx.play('join');
  lastRosterCount = n;
}

function renderRoster() {
  const w = document.getElementById('who'), n = document.getElementById('rn');
  if (!w) return;
  joinChime(S.roster.length);
  n.textContent = S.roster.length;
  renderWarnings();
  w.innerHTML = S.roster.length
    ? S.roster.map((p) => `<span class="chip${p.connected ? '' : ' off'}${p.isBot ? ' bot' : ''}"${
        p.isBot ? ` data-bot="${p.token}" tabindex="0" role="button"` : ''}${
        p.bot ? ` title="${p.bot} — click to change"` : ''}>${
        p.isBot ? brainAvatar(p.level || 'normie', 24)
          : avatarOf(p) ? `<img src="${avatarOf(p)}" alt="">`
          : p.tokenArt ? weaponToken(p.tokenArt.art, 24, p.tokenArt.colour) : ''}${p.name}${
        p.isBot ? `<em class="lvl">${p.level || ''}</em>` : ''}</span>`).join('')
    : '<span class="note">Nobody yet. Read them the code.</span>';
  const b = document.getElementById('start');
  if (b) b.disabled = S.roster.length < 3;
}

function renderWarnings() {
  const w = document.getElementById('warn');
  if (!w) return;
  const ws = warnings();
  w.innerHTML = ws.map((x, i) => `<div class="wrn ${x.level}">
    <span>${x.text}</span>${x.fix ? `<button class="wfix" data-fix="${i}">${x.fix}</button>` : ''}</div>`).join('');
  w.querySelectorAll('[data-fix]').forEach((b) => b.onclick = async () => {
    const v = ws[Number(b.dataset.fix)].target;
    document.getElementById('targetMinutes').value = v;
    await save(true); render();
  });
}

function renderFiles() {
  const f = document.getElementById('files');
  if (!f) return;
  f.innerHTML = (S.uploads || []).map((u, i) =>
    `<div class="file"><span>${u.name}</span><span class="n">${u.categories} categories</span>
     <button class="x" data-del="${i}" aria-label="Remove ${u.name}">&times;</button></div>`).join('');
  f.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    S = await api(`/api/match/${code}/material/${b.dataset.del}`, { method: 'DELETE' });
    render();
  });
}

function collect() {
  const g = (id) => document.getElementById(id);
  const auto = g('entryMode').value === 'auto';
  const iv = auto ? '' : g('entryInterval').value.trim();
  const decayAuto = g('decayMode').value === 'auto';
  const floorAuto = g('floorMode').value === 'auto';
  return {
    settings: {
      startScore: +g('startScore').value, ceiling: +g('ceiling').value,
      ceilingDecayPerClue: decayAuto ? null : +g('ceilingDecayPerClue').value,
      ceilingFloor: floorAuto ? null : +g('ceilingFloor').value,
      entryInterval: iv === '' ? null : +iv, targetMinutes: +g('targetMinutes').value,
      stumperFraction: +g('stumperFraction').value, potScoring: g('potScoring').value === 'true',
      delay: +g('delay').value, lockout: +g('lockout').value, secondsPerClue: +g('secondsPerClue').value,
      recordMatch: g('recordMatch').checked,
      topRope: g('topRope').checked, targeting: g('targeting').checked,
      bounties: g('bounties').checked, revival: g('revival').checked,
      revivalLimit: +g('revivalLimit').value || 1,
      revivalFraction: +g('revivalFraction').value,
      seasonRange: [+g('s-lo').value, +g('s-hi').value],
    },
    blend: Object.fromEntries(SRC.map(([k]) => [k, mix[k] || 0])),
  };
}

const LEVEL_BLURB = {
  rookie: 'quiet, and slow on the buzzer',
  normie: 'an ordinary contestant',
  champ: 'wins about as often as not',
  superchamp: 'six wins or more',
  elite: 'the very best',
};

// The draw is random, so a test field can come out all rookies. Any robot's
// standard can be changed until the match starts.
function editBot(token) {
  const p = (S.roster || []).find((x) => x.token === token);
  if (!p) return;
  document.querySelectorAll('.botedit').forEach((n) => n.remove());
  const el = document.createElement('div'); el.className = 'botedit';
  el.innerHTML = `<div class="bebox">
    <h3>${p.name}</h3>
    <div class="cur">${p.bot || ''}</div>
    ${['rookie', 'normie', 'champ', 'superchamp', 'elite'].map((l) =>
      `<button class="belvl${p.level === l ? ' on' : ''}" data-l="${l}">
        <span>${l}</span><span class="bd">${LEVEL_BLURB[l]}</span></button>`).join('')}
    <button class="rm" data-rm="1">Remove this robot</button>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = (e) => { if (e.target === el) close(); };
  el.querySelectorAll('[data-l]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try {
      S = await api(`/api/match/${code}/bots/${encodeURIComponent(token)}`,
        { method: 'PATCH', body: JSON.stringify({ level: b.dataset.l }) });
    } catch (err) { el.querySelector('.cur').textContent = err.message; }
    close(); render(true);
  });
  el.querySelector('[data-rm]').onclick = async () => {
    try {
      S = await api(`/api/match/${code}/bots/${encodeURIComponent(token)}`, { method: 'DELETE' });
    } catch (err) { el.querySelector('.cur').textContent = err.message; }
    close(); render(true);
  };
  addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); removeEventListener('keydown', esc); }
  });
}

async function save(quiet) {
  const m = document.getElementById('savemsg');
  try {
    S = await api(`/api/match/${code}`, { method: 'PATCH', body: JSON.stringify(collect()) });
    if (!quiet && m) {
      m.textContent = '\u2713 Settings saved';
      m.style.color = 'var(--live)';
      setTimeout(() => { m.textContent = ''; }, 2600);
    }
    return true;
  } catch (e) {
    if (m) { m.textContent = e.message; m.style.color = 'var(--alarm)'; }
    return false;
  }
}

function wire() {
  document.querySelectorAll('input[data-w]').forEach((sl) => {
    sl.oninput = () => setPct(sl.dataset.w, Number(sl.value));
    sl.onchange = () => save(true);
  });
  document.getElementById('mine').onclick = () => {
    const own = SRC.map(([k]) => k).filter((k) => k !== 'archive' && (S.available[k] || 0) > 0);
    if (!own.length) return;
    setPct('archive', 0);
    save();
  };
  const ab = document.getElementById('addbots');
  if (ab) ab.onclick = async () => {
    ab.disabled = true; ab.textContent = 'Adding\u2026';
    try {
      const r = await api(`/api/match/${code}/bots`, { method: 'POST', body: JSON.stringify({
        count: Number(document.getElementById('botcount').value) || 1,
        profile: document.getElementById('botprofile').value,
        level: document.getElementById('botlevel').value || undefined }) });
      S = r;
      lastBots = r.added || [];
    } catch (e) { document.getElementById('msg').textContent = e.message; }
    render(true);
  };
  document.querySelectorAll('[data-bot]').forEach((el) => {
    const open = () => editBot(el.dataset.bot);
    el.onclick = open;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
  const rb = document.getElementById('rmbots');
  if (rb) rb.onclick = async () => { S = await api(`/api/match/${code}/bots`, { method: 'DELETE' });
    lastBots = []; render(true); };
  const bl = document.getElementById('botlist');
  if (bl) bl.innerHTML = lastBots.map((b) => `<span>${b.name} &mdash; ${b.describe}</span>`).join('');

  document.getElementById('save').onclick = () => save();
  const rev = document.getElementById('revival');
  rev.onchange = () => {
    document.getElementById('revrow').style.display = rev.checked ? '' : 'none';
    S.settings.revival = rev.checked;
    renderWarnings();
    save(true);
  };
  ['topRope', 'targeting', 'bounties'].forEach((k) => {
    const el = document.getElementById(k);
    if (el) el.onchange = () => { S.settings[k] = el.checked; renderWarnings(); save(true); };
  });
  ['s-lo', 's-hi'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => save(true).then(() => render());
  });
  ['targetMinutes', 'secondsPerClue', 'entryInterval'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => {
      S.settings[id] = id === 'entryInterval' && el.value === '' ? null : +el.value;
      const e = estimate();
      const est = document.querySelector('.est');
      if (e && est) est.innerHTML = `With ${S.roster.length} players: entry every <b>${e.iv}</b> clues${
        e.auto ? ' (auto)' : ''}, roughly <b>${e.mins} minutes</b>, about ${e.clues} clues.${e.rough ? ' Rough at this size.' : ''}`;
      renderWarnings();
    };
  });
  [['entryMode', 'ivwrap'], ['decayMode', 'decaywrap'], ['floorMode', 'floorwrap']]
    .forEach(([sel, wrap]) => {
      const el = document.getElementById(sel);
      el.onchange = () => {
        document.getElementById(wrap).style.display = el.value === 'auto' ? 'none' : '';
        save(true).then(() => render());
      };
    });

  const drop = document.getElementById('drop'), file = document.getElementById('file');
  file.onchange = () => queueFiles([...file.files]);
  ['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => {
    ev.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => {
    ev.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', (ev) => queueFiles([...ev.dataTransfer.files]));
  document.getElementById('upbtn').onclick = () => upload();
  renderQueue();

  document.getElementById('start').onclick = async () => {
    if (!await save(true)) return;
    socket.emit('start-match');
    setTimeout(() => { location.href = `/host/${code}#${hostKey}`; }, 350);
  };
}

// Dropping a file only queues it. Uploading is a button press, so the host
// always knows whether their boards were actually processed.
let pending = [];

function queueFiles(files) {
  const fresh = files.filter((f) => !pending.some((p) => p.name === f.name && p.size === f.size));
  pending = pending.concat(fresh);
  renderQueue();
}

function renderQueue() {
  const q = document.getElementById('queued'), b = document.getElementById('upbtn'),
        n = document.getElementById('qnote');
  if (!q) return;
  q.innerHTML = pending.map((f, i) =>
    `<span class="qf">${f.name}<button class="x" data-q="${i}" aria-label="Remove ${f.name}">&times;</button></span>`).join('');
  q.querySelectorAll('[data-q]').forEach((x) => x.onclick = () => {
    pending.splice(Number(x.dataset.q), 1); renderQueue();
  });
  b.disabled = pending.length === 0;
  b.textContent = pending.length ? `Upload ${pending.length} file${pending.length > 1 ? 's' : ''}` : 'Upload';
  n.textContent = pending.length
    ? 'Nothing is added until you press upload.'
    : 'Nothing waiting.';
}

async function upload() {
  const m = document.getElementById('msg'), b = document.getElementById('upbtn');
  const files = pending.slice();
  if (!files.length) return;
  b.disabled = true; b.classList.add('busy'); b.textContent = 'Uploading…';
  let added = 0, failed = 0;
  for (const f of files) {
    m.textContent = `Reading ${f.name}…`; m.className = 'msg';
    try {
      const content = await f.text();
      const r = await api(`/api/match/${code}/material`, { method: 'POST',
        body: JSON.stringify({ name: f.name, content, format: /\.csv$/i.test(f.name) ? 'csv' : 'json' }) });
      S = r; added += r.added;
      pending = pending.filter((p) => p !== f);
    } catch (e) {
      failed++;
      m.textContent = `${f.name}: ${e.message}`; m.className = 'msg bad';
    }
  }
  b.classList.remove('busy');
  if (!failed) {
    m.textContent = `${added} categories added from ${files.length} file${files.length > 1 ? 's' : ''}.`;
    m.className = 'msg good';
  }
  render();
}

boot().catch((e) => { root.innerHTML = `<p class="msg bad">${e.message}</p>`; });
</script>
</body>
</html>
