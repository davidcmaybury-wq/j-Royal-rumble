<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J! Royal Rumble — set up a match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;
--chalk:#EEEBE1;--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:4px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--chalk);font:400 15px/1.55 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums lining-nums}
.mq{font-family:"Anton",Impact,sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:840px;margin:0 auto;padding:26px 20px 70px}
h1{font:400 clamp(30px,6vw,50px)/1 "Anton",Impact,sans-serif;margin:0;color:var(--brass)}
.backhome{display:inline-block;color:var(--slate);font-size:13px;text-decoration:none;
margin-bottom:6px}
.backhome:hover{color:var(--brass)}
.hero{display:flex;align-items:center;gap:18px;margin-bottom:2px}
.hero svg{flex:none;border-radius:50%}
.tag{font-size:12.5px;color:var(--slate);margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}
.card h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--slate);margin:0 0 14px;font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.f .hint{font-size:11px;color:var(--slate);font-style:italic}
input[type=number],input[type=text],select{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
color:var(--chalk);padding:8px 10px;font:400 14px "IBM Plex Mono",monospace;min-width:0}
input[type=text].wide{font-family:"IBM Plex Sans",sans-serif}
select{font-family:"IBM Plex Sans",sans-serif}
.code{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.code .big{font:400 clamp(46px,12vw,86px)/.9 "Anton",Impact,sans-serif;color:var(--brass);letter-spacing:.09em}
.code .side{font-size:12.5px;color:var(--slate);line-height:1.7}
.code .side code{font-family:"IBM Plex Mono",monospace;color:var(--chalk);background:var(--ink);padding:2px 7px;border-radius:var(--r)}
.who{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 12px 4px 4px;background:var(--panel2);border-radius:20px;font-size:13px;
border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px}
.chip img,.chip svg{width:24px;height:24px;border-radius:50%;object-fit:cover;display:block;flex:none}
.chip.bot{border-style:dashed;color:var(--slate)}
.chip.bot{padding-left:4px}
.chip .lvl{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
color:var(--slate);margin-left:2px}
.chip.bot svg{flex:none;border-radius:50%}
.botlist{margin-top:12px;display:flex;flex-wrap:wrap;gap:5px}
.botlist span{font-size:11.5px;color:var(--slate);background:var(--ink);
border:1px solid var(--line);border-radius:var(--r);padding:4px 9px}
.chip:not(:has(img)){padding-left:12px}
.chip.off{opacity:.4}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.src{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--ink)}
.src.on{border-color:var(--brass)}
.src .t{display:flex;align-items:baseline;gap:8px;font-size:14px}
.src .pct{margin-left:auto;color:var(--brass);font-size:15px}
.src.off .pct{color:var(--slate)}
.src .n{font-size:11px;color:var(--slate);margin-top:3px}
.src input[type=range]{width:100%;margin-top:9px}
.src.off input[type=range]{opacity:.3}
.up{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--slate);font-size:13px}
.up.drag{border-color:var(--brass);color:var(--chalk)}
.queued{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px}
.qf{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
border-radius:20px;padding:5px 12px;font-size:12.5px}
.qf .x{color:var(--slate);padding:0 2px}.qf .x:hover{color:var(--alarm)}
.upbtn{padding:9px 22px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:14px}
.upbtn:disabled{opacity:.3;border-color:var(--line);color:var(--slate);cursor:default}
.upbtn.busy{opacity:.6;cursor:progress}
.files{margin-top:10px;display:flex;flex-direction:column;gap:5px}
.file{display:flex;align-items:center;gap:10px;background:var(--ink);border-radius:var(--r);padding:7px 11px;font-size:13px}
.file .n{color:var(--slate);font-size:12px;margin-left:auto}
.file .x{color:var(--slate);padding:0 4px}.file .x:hover{color:var(--alarm)}
.msg{font-size:12.5px;margin-top:9px}
.msg.bad{color:var(--alarm)}.msg.good{color:var(--live)}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,var(--ink) 24%);padding:22px 0 0;margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{padding:14px 32px;border:1px solid var(--brass);color:var(--brass);border-radius:var(--r);font-size:16px}
.go:disabled{opacity:.32;border-color:var(--line);color:var(--slate);cursor:default}
.alt{padding:12px 18px;border:1px solid var(--line);border-radius:var(--r);font-size:14px;color:var(--slate)}
.alt:hover{color:var(--chalk);border-color:var(--slate)}
.note{font-size:12px;color:var(--slate)}
.est{font-size:12.5px;color:var(--slate)}
.est b{color:var(--brass);font-weight:400}
.rec{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rec input{margin-top:4px;flex:none}
.rec b{font-weight:400}
.adv{padding:11px 0;border-top:1px solid var(--line)}
.adv:first-of-type{border-top:none;padding-top:0}
.hint2{display:block;font-size:12px;color:var(--slate);line-height:1.5;margin-top:4px}
.wrn{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px 12px;
border-radius:var(--r);font-size:12.5px;line-height:1.5;border-left:2px solid var(--line);background:var(--ink)}
.wrn.warn{border-left-color:var(--brass);color:var(--chalk)}
.wrn.note{border-left-color:var(--line);color:var(--slate)}
/* Red, for the things that will visibly skew a match. Never blocking — the
   host can run whatever they like, they just get told. */
.wrn.bad{border-left-color:var(--alarm);color:#F0A99E;background:#2A100D}
.wrn.bad .wfix{border-color:var(--alarm);color:#F0A99E}
.wrn.bad .wfix:hover{background:var(--alarm);color:var(--ink)}
.wfix{flex:none;align-self:center;border:1px solid var(--brass);color:var(--brass);
border-radius:var(--r);padding:5px 11px;font-size:12px;white-space:nowrap}
.wfix:hover{background:#3A2E0C}
.start{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}

.manual{display:inline-block;margin-top:7px;color:var(--brass);text-decoration:none;
border-bottom:1px solid #6A4509;font-size:13px}
.manual:hover{border-bottom-color:var(--brass)}
.watchcard .wt{color:var(--slate);font-size:13px;margin:0 0 12px;max-width:62ch;line-height:1.5}
/* The links under the roster: the watch screen sits alongside the join links
   rather than in a card of its own, because it is the same kind of thing. */
.verlink{color:var(--slate);text-decoration:none;border-bottom:1px dotted #3C486E}
.verlink:hover{color:var(--brass);border-bottom-color:var(--brass)}
.links{list-style:none;margin:14px 0 0;padding:0;border-top:1px solid var(--line);padding-top:12px}
.links li{font-size:13.5px;color:var(--slate);line-height:1.5}
/* The join link and the match length side by side: the two things a host sets
   before every single game. */
.playrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
@media (max-width:680px){.playrow{grid-template-columns:1fr}}
.lenbox{border-left:1px solid var(--line);padding-left:20px;min-width:190px}
.lenbox label{display:block;color:var(--chalk);font-weight:500;font-size:14.5px;
margin-bottom:7px}
.lenrow{display:flex;align-items:baseline;gap:8px}
.lenrow input{width:84px;padding:9px 10px;background:var(--ink);color:var(--brass);
border:1px solid var(--line);border-radius:var(--r);
font-family:"IBM Plex Mono",monospace;font-size:21px;text-align:center}
.lenrow input:focus{outline:none;border-color:var(--brass)}
.lenrow span{color:var(--slate);font-size:13px}
.lenhint{color:var(--slate);font-size:12px;margin-top:6px;line-height:1.4;min-height:2.4em}
/* Sits under the room code, above the links. Full width rather than beside the
   code, because a name is long and the four-letter code is the thing the eye
   should land on first. */
.hostbox{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.hostbox label{display:block;color:var(--chalk);font-weight:500;font-size:14.5px;
margin-bottom:7px}
.hostbox input{width:100%;max-width:320px;padding:9px 11px;background:var(--ink);
color:var(--chalk);border:1px solid var(--line);border-radius:var(--r);font-size:15px}
.hostbox input:focus{outline:none;border-color:var(--brass)}
.hostbox .hint{display:block;color:var(--slate);font-size:12px;margin-top:6px;line-height:1.4}
.links b{color:var(--chalk);font-weight:500}
.links .wrow{margin-top:8px}
.wrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.wrow code{background:var(--ink);border:1px solid var(--line);border-radius:var(--r);
padding:9px 13px;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--brass)}
.wrow .alt{text-decoration:none;display:inline-flex;align-items:center}

/* robot editor */
.chip.bot{cursor:pointer}
.chip.bot:hover{border-color:var(--brass)}
.botedit{position:fixed;inset:0;background:#0A0E1CE8;z-index:60;display:flex;
align-items:center;justify-content:center;padding:18px}
.bebox{background:var(--panel);border:1px solid var(--brass);border-radius:10px;
padding:16px 18px;width:100%;max-width:340px;box-shadow:0 20px 60px #000b}
.bebox h3{margin:0 0 3px;font:400 18px "IBM Plex Sans",sans-serif;color:var(--chalk)}
.bebox .cur{font-size:12px;color:var(--slate);margin-bottom:13px;line-height:1.5}
.belvl{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;
border-radius:var(--r);background:var(--ink);margin-bottom:5px;font-size:14px;
border:1px solid var(--line);text-align:left;color:var(--chalk);cursor:pointer}
.belvl:hover{border-color:var(--brass)}
.belvl.on{border-color:var(--brass);color:var(--brass)}
.belvl .bd{font-size:11px;color:var(--slate);margin-left:auto;text-align:right}
.bebox .rm{width:100%;margin-top:9px;padding:10px;border:1px solid var(--line);
border-radius:var(--r);font-size:13px;color:var(--slate);background:none;cursor:pointer}
.bebox .rm:hover{border-color:var(--alarm);color:var(--alarm)}

/* --- quick / expert setup -------------------------------------------------
   Everything expert renders in both modes and is hidden with CSS rather than
   left out of the markup. collect() reads every control by id on save, so a
   card that is genuinely absent takes the Save button down with it — and the
   host would see a dead button, which is the exact failure this project keeps
   finding. Hiding also means switching modes cannot lose an edit. */
.mode-quick .expert-only{display:none}
.mode-expert .quick-only{display:none}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);
overflow:hidden;margin-bottom:18px}
.modebtn{padding:7px 16px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
color:var(--slate);background:none}
.modebtn:hover{color:var(--chalk)}
.modebtn.sel{background:var(--panel2);color:var(--brass)}
.qgrid{display:flex;gap:14px;flex-wrap:wrap}
.qsf{flex:1 1 230px;min-width:230px}
.qsf label{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
color:var(--slate);margin-bottom:5px}
.qsf select{width:100%}
.qwhat{font-size:11.5px;color:var(--slate);font-style:italic;margin:7px 0 0;min-height:2.6em}
.qbots{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px;
padding-top:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="note">Loading…</p></div>
<script src="/socket.io/socket.io.js"></script>
<script type="module">
import { estimate as estimateFor, warnings as warningsFor } from '/estimate.js';
import { brainAvatar } from '/brand.js';
import { markBanner } from '/banner.js';
import { weaponToken } from '/tokens.js';
import { avatar as wrestlerAvatar } from '/wrestlers.js';
import * as sfx from '/sound.js';
const socket = io({ transports: ['websocket'] });
let code = location.pathname.split('/')[2] || '';
let hostKey = location.hash.slice(1);
let lastBots = [];
let S = null, msg = null, mix = { archive: 100, original: 0, upload: 0 };
const root = document.getElementById('root');

// Quick unless this host has said otherwise, remembered on their own machine.
// Per browser rather than per match: it is a preference about how somebody
// likes to set a game up, not a property of the game.
const MODE_KEY = 'rumble:setupMode';
let MODE = 'quick';
try {
  const saved = localStorage.getItem(MODE_KEY);
  if (saved === 'quick' || saved === 'expert') MODE = saved;
} catch (e) { /* private browsing; quick is the right default anyway */ }
const setMode = (m) => {
  MODE = m;
  try { localStorage.setItem(MODE_KEY, m); } catch (e) {}
  root.className = 'wrap mode-' + m;
};
// The same host runs nearly every match, so asking for the name once and
// remembering it is the difference between a field that gets filled in and one
// that sits empty and makes the whole record useless. Same reasoning as the
// mode above: a property of the person, not of the game.
const HOST_KEY = 'rumble:hostName';
const savedHost = () => {
  try { return (localStorage.getItem(HOST_KEY) || '').slice(0, 40); }
  catch (e) { return ''; }
};
const rememberHost = (n) => {
  try {
    if (n) localStorage.setItem(HOST_KEY, n);
    else localStorage.removeItem(HOST_KEY);
  } catch (e) { /* private browsing; they can retype it */ }
};
// Host-supplied and rendered into an attribute, so a stray quote would break
// the card rather than just look wrong.
const attr = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n ?? 0).toLocaleString();

const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts,
    headers: { 'content-type': 'application/json', 'x-host-key': hostKey, ...(opts.headers || {}) } });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'request failed');
  return j;
};

sfx.preload();
// Browsers hold audio until the page has been interacted with. The host will
// have clicked something on this page long before anyone joins.
sfx.armUnlock();

async function boot() {
  if (!code) {
    const m = await (await fetch('/api/match', { method: 'POST',
      headers: { 'content-type': 'application/json' }, body: '{}' })).json();
    code = m.gameId; hostKey = m.hostKey;
    history.replaceState(null, '', `/setup/${code}#${hostKey}`);
  }
  S = await api(`/api/match/${code}`);
  mix = toPct(S.blend, S.available);
  socket.emit('watch-setup', { gameId: code, hostKey }, () => {});
  socket.on('state', (s) => { if (s.roster) { S.roster = s.roster; renderRoster(); } });
  render();
}

// Pictures arrive once and are cached here; state pushes only say whether a
// player has one — thirty data URLs on every push was most of the traffic.
//
// These live at module scope on purpose. An earlier patch inserted them inside
// boot(), which put avatarOf out of reach of renderRoster: the roster silently
// stopped drawing, and because renderRoster threw, wire() never ran either and
// the start button went dead with it.
const AVATARS = new Map();
const avatarOf = (p) => (p && p.hasAvatar ? AVATARS.get(p.token) : null) || null;

// Repaint only the roster. A full render() rebuilds every input from the last
// saved state, which would discard anything the host had typed.
socket.on('avatar', ({ token, dataUrl }) => {
  AVATARS.set(token, dataUrl);
  renderRoster();
});

// Blend weights on the server are relative; the host thinks in percentages.
// --- quick setup ----------------------------------------------------------
//
// Two dropdowns instead of forty controls. Most nights the host wants a shape,
// not a settings page, and the full card is a wall of switches to somebody
// setting up a game with people already waiting.
//
// The presets write into the real controls rather than living beside them, so
// switching to Expert shows exactly what the preset did and nothing is hidden
// from the host. There is no separate quick-mode code path in collect().

// The six that are on unless a host turns them off.
const STANDARD_RULES = ['longevity', 'comeback', 'targeting', 'categorySweep',
  'giftFromQueue', 'anonymousNext'];
// The five that are off unless a host turns them on.
const ADVANCED_RULES = ['topRope', 'stables', 'savePlayer', 'bounties', 'revival'];

const rules = (on) => Object.fromEntries(
  [...STANDARD_RULES, ...ADVANCED_RULES].map((k) => [k, on.includes(k)]));

// The rule sets are named for the shape of match they produce, and the first
// two are named for the mode the room will see on screen. That has to stay
// true: a set called Tournament that left the comeback on would put ARCADE MODE
// on every screen in the room, which is how it was first written here.
const RULESETS = {
  tournament: {
    label: 'Tournament',
    // Two things out, and they go together.
    //
    // Targeting is the one standard rule the room aims deliberately, so taking
    // it out leaves the result to the buzzer — at the cost of the room's only
    // reliable answer to somebody running away with the match.
    //
    // The comeback goes with it, which is what makes this Tournament rather
    // than a variant of Arcade: no player is ranked with time off their press,
    // so buzz order is buzz speed and the times are published.
    what: 'The fairest shape and the least merciful. No targeting, so nobody can be ganged '
        + 'up on, and no comeback, so the fastest press wins every race and the times are '
        + 'public. Screens read TOURNAMENT.',
    set: rules(STANDARD_RULES.filter((k) => k !== 'targeting' && k !== 'comeback')),
  },
  arcade: {
    label: 'Arcade',
    what: 'The normal game: targeting, longevity, category sweeps, gifts from the queue, and '
        + 'one foot on the floor for anybody knocked out before they got going. Because that '
        + 'reorders the race, the room sees places rather than times — each player still sees '
        + 'their own. Screens read ARCADE.',
    set: rules(STANDARD_RULES),
  },
  chaos: {
    label: 'Chaos',
    what: 'Arcade plus everything else — top rope, stables, saves, bounties and revival. '
        + 'Expect a long match and a keyboard-heavy one. Screens read ARCADE.',
    set: rules([...STANDARD_RULES, ...ADVANCED_RULES]),
  },
};

const SPEEDS = {
  blitz: {
    label: 'Blitz',
    what: 'A new player every 5 clues, whatever the roster. The ring fills fast and stays full.',
    // A fixed interval, so the target length stops driving the pacing and is
    // left alone rather than being given a number that does nothing.
    set: { entryInterval: 5 },
  },
  standard: {
    label: 'Standard',
    what: 'Paced to finish in about 20 minutes — entries scale to however many turn up.',
    set: { entryInterval: null, targetMinutes: 20 },
  },
  extended: {
    label: 'Extended',
    what: 'Paced to about 40 minutes. More clues each, and the draw matters more.',
    set: { entryInterval: null, targetMinutes: 40 },
  },
};

// Which preset the current settings correspond to, or '' for none.
//
// Derived rather than remembered: a host who picks Tournament, switches to
// Expert and turns targeting back on must not still be looking at a dropdown
// that says Tournament. It reads "Custom" the moment the settings stop
// matching, which is the honest answer.
function presetOf(kind) {
  const s = S.settings || {};
  if (kind === 'rules') {
    for (const [k, p] of Object.entries(RULESETS)) {
      if (Object.entries(p.set).every(([id, on]) => !!s[id] === on)) return k;
    }
    return '';
  }
  for (const [k, p] of Object.entries(SPEEDS)) {
    if (Object.entries(p.set).every(([id, v]) => (s[id] ?? null) === v)) return k;
  }
  return '';
}

function toPct(blend, avail) {
  const usable = SRC.map(([k]) => k).filter((k) => (avail[k] || 0) > 0);
  const total = usable.reduce((n, k) => n + (blend[k] || 0), 0);
  if (!total) {
    const first = usable[0] || 'archive';
    return Object.fromEntries(SRC.map(([k]) => [k, k === first ? 100 : 0]));
  }
  const out = {}, raw = {};
  usable.forEach((k) => { raw[k] = (blend[k] || 0) / total * 100; });
  usable.forEach((k) => { out[k] = Math.round(raw[k] / 5) * 5; });
  SRC.forEach(([k]) => { if (!(k in out)) out[k] = 0; });
  return settle(out, usable[0]);
}

// Rounding to 5% steps can leave the total at 95 or 105; push the slack onto
// whichever source the host wasn't touching.
function settle(m, absorb) {
  const keys = SRC.map(([k]) => k);
  let diff = 100 - keys.reduce((n, k) => n + m[k], 0);
  if (!diff) return m;
  const order = [absorb, ...keys.filter((k) => k !== absorb)]
    .filter((k) => (S.available[k] || 0) > 0);
  for (const k of order) {
    const next = Math.min(100, Math.max(0, m[k] + diff));
    diff -= next - m[k];
    m[k] = next;
    if (!diff) break;
  }
  return m;
}

// Moving one slider takes the difference proportionally from the others, so
// the host never has to do arithmetic to make the numbers add up.
function setPct(key, value) {
  const others = SRC.map(([k]) => k)
    .filter((k) => k !== key && (S.available[k] || 0) > 0);
  const v = Math.max(0, Math.min(100, value));
  const remain = 100 - v;
  const sum = others.reduce((n, k) => n + mix[k], 0);
  const next = { ...mix, [key]: v };
  if (!others.length) { next[key] = 100; }
  else if (sum === 0) {
    const each = Math.floor(remain / others.length / 5) * 5;
    others.forEach((k, i) => { next[k] = i === 0 ? remain - each * (others.length - 1) : each; });
  } else {
    others.forEach((k) => { next[k] = Math.round(mix[k] / sum * remain / 5) * 5; });
  }
  SRC.forEach(([k]) => { if ((S.available[k] || 0) === 0) next[k] = 0; });
  mix = settle(next, others[0] || key);
  paintMix();
}

function paintMix() {
  SRC.forEach(([k]) => {
    const box = document.querySelector(`.src[data-src="${k}"]`);
    if (!box) return;
    const pct = mix[k] || 0;
    box.querySelector(`[data-pct="${k}"]`).textContent = pct + '%';
    const sl = box.querySelector('input[type=range]');
    if (Number(sl.value) !== pct) sl.value = pct;
    box.classList.toggle('on', pct > 0);
    box.classList.toggle('off', pct === 0);
  });
}

// Read the form, not the last saved settings.

// back — so typing 10 into the target and looking at the warnings got you an
// answer about 30, complaining it could not stretch to a number you had just
// stopped asking for. The estimate is a live preview; it has to read what is
// on screen.
function liveSettings() {
  try { return { ...S.settings, ...collect().settings }; }
  catch { return S.settings; }          // before the form exists
}
// One settings read, one estimate, used for both the line and the warnings.
// Two reads could land either side of a save and disagree.
function preview() {
  const s = liveSettings();
  const e = estimateFor(S.roster.length, s);
  return { s, e, warnings: warningsFor(S.roster.length, s, e) };
}

  document.querySelectorAll('#root input, #root select').forEach((el) => {
    if (!el.id) return;
    out[el.id] = el.type === 'checkbox' ? el.checked : el.value;

}
function restoreEdits(saved) {
  for (const [id, v] of Object.entries(saved || {})) {

    if (!el || el.type === 'file') continue;
    if (el.type === 'checkbox') el.checked = v; else el.value = v;
  }
}

  `<label class="rec adv"><input type="checkbox" id="${k}" ${on ? 'checked' : ''}>

// Somebody signing up. Counted rather than event-driven, so a state resend
// cannot chime twice for the same person, and never on the first paint — the
// host should not hear six chimes because six people were already waiting.
let lastRosterCount = null;
function joinChime(n) {
  if (lastRosterCount != null && n > lastRosterCount) sfx.play('join');
  lastRosterCount = n;
}

function renderRoster() {
  const w = document.getElementById('who'), n = document.getElementById('rn');
  if (!w) return;
  // Humans only. Adding your own robots is not an arrival worth a chime — and
  // six of them at once made the setup screen ring like a till.
  joinChime(S.roster.filter((p) => !p.isBot).length);
  n.textContent = S.roster.length;
  renderWarnings();
  w.innerHTML = S.roster.length
    ? S.roster.map((p) => `<span class="chip${p.connected ? '' : ' off'}${p.isBot ? ' bot' : ''}"${
        p.isBot ? ` data-bot="${p.token}" tabindex="0" role="button"` : ''}${
        p.bot ? ` title="${p.bot} — click to change"` : ''}>${
        p.isBot ? brainAvatar(p.level || 'normie', 24)
          : avatarOf(p) ? `<img src="${avatarOf(p)}" alt="">`
          : p.look ? wrestlerAvatar(p.look, 24)
             : p.tokenArt ? weaponToken(p.tokenArt.art, 24, p.tokenArt.colour) : ''}${p.name}${
        p.isBot ? `<em class="lvl">${p.level || ''}</em>` : ''}</span>`).join('')
    : '<span class="note">Nobody yet. Read them the code.</span>';
  // Both links get the same treatment; the host reads out one and pastes the
  // other, and which is which changes by the night.
  const copier = (btnId, url) => {
    const b = document.getElementById(btnId);
    if (!b) return;
    b.onclick = async () => {
      try {
        await navigator.clipboard.writeText(url);
        b.textContent = 'Copied';
        setTimeout(() => { b.textContent = 'Copy'; }, 1600);
      } catch (e) { b.textContent = 'Select it by hand'; }
    };
  };
  copier('copywatch', location.origin + '/watch/' + code);
  copier('copyjoin', location.origin + '/j/' + code);

  // Two boxes, one setting.
  //
  // The prominent one at the top and the one in Game setup are the same
  // number, so each writes to the other and both go through the same preview.
  // Left to themselves they would drift, and the host would have no way to
  // know which one the match was actually using.
  const lenTop = document.getElementById('targetMinutes2');
  const lenSetup = document.getElementById('targetMinutes');
  const syncLength = (from, to) => {
    if (!from || !to) return;
    from.oninput = () => {
      to.value = from.value;
      S.settings.targetMinutes = +from.value;
      const { e, warnings: ws } = preview();
      const hint = document.getElementById('lenhint');
      if (hint) {
        // With nobody signed up there is nothing to estimate against, so say
        // that rather than leaving an empty line where a number should be.
        hint.textContent = e
          ? `${S.roster.length} players, entry every ${e.iv} clues`
            + `${e.auto ? ' (auto)' : ''} — about ${e.clues} clues.`
          : 'Once people sign up this will estimate the clue count.';
      }
      const est = document.querySelector('.est');
      if (e && est) est.innerHTML = `With ${S.roster.length} players: entry every <b>${e.iv}</b> clues${
        e.auto ? ' (auto)' : ''}, roughly <b>${e.mins} minutes</b>, about ${e.clues} clues.${e.rough ? ' Rough at this size.' : ''}`;
      paintWarnings(ws);
    };
    from.onchange = () => save(true);
  };
  syncLength(lenTop, lenSetup);
  syncLength(lenSetup, lenTop);
  if (lenTop) lenTop.oninput.call(lenTop);   // paint the hint on first render
  const b = document.getElementById('start');
  if (b) b.disabled = S.roster.length < 3;
}

function renderWarnings() { paintWarnings(preview().warnings); }

function paintWarnings(ws) {
  const w = document.getElementById('warn');
  if (!w) return;
  w.innerHTML = ws.map((x, i) => `<div class="wrn ${x.level}">
    <span>${x.text}</span>${x.fix ? `<button class="wfix" data-fix="${i}">${x.fix}</button>` : ''}</div>`).join('');
  w.querySelectorAll('[data-fix]').forEach((b) => b.onclick = async () => {
    const x = ws[Number(b.dataset.fix)];
    if (x.interval != null) {
      // A fairness fix sets the interval directly and takes it off auto,
      // because auto is what produced the number being complained about.
      const iv = document.getElementById('entryInterval');
      if (iv) iv.value = x.interval;
    } else if (x.target != null) {
      document.getElementById('targetMinutes').value = x.target;
    }
    await save(true); render();
  });
}

function renderFiles() {
  const f = document.getElementById('files');
  if (!f) return;
  f.innerHTML = (S.uploads || []).map((u, i) =>
    `<div class="file"><span>${u.name}</span><span class="n">${u.categories} categories</span>
     <button class="x" data-del="${i}" aria-label="Remove ${u.name}">&times;</button></div>`).join('');
  f.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    S = await api(`/api/match/${code}/material/${b.dataset.del}`, { method: 'DELETE' });
    render();
  });
}

function collect() {
  const g = (id) => document.getElementById(id);
  const auto = g('entryMode').value === 'auto';
  const iv = auto ? '' : g('entryInterval').value.trim();
  const decayAuto = g('decayMode').value === 'auto';
  const ceilAuto = g('ceilingMode').value === 'auto';
  return {
    settings: {
      startScore: +g('startScore').value,
      // null means the engine scales it to the field, which is the right
      // default and what autoCeiling(n) exists for.
      ceiling: ceilAuto ? null : +g('ceiling').value,
      ceilingDecayPerClue: decayAuto ? null : +g('ceilingDecayPerClue').value,
      // The floor is always the starting score; there is no sensible reason to
      // cap a new entrant below what they walk in with.
      ceilingFloor: null,
      entryInterval: iv === '' ? null : +iv, targetMinutes: +g('targetMinutes').value,
      stumperFraction: +g('stumperFraction').value,
      delay: +g('delay').value, lockout: +g('lockout').value, secondsPerClue: +g('secondsPerClue').value,

      topRope: g('topRope').checked, targeting: g('targeting').checked,
      savePlayer: g('savePlayer').checked,
      comeback: g('comeback').checked,
      stables: g('stables').checked,
      bounties: g('bounties').checked, revival: g('revival').checked,
      longevity: g('longevity').checked,
      categorySweep: g('categorySweep').checked,
      giftFromQueue: g('giftFromQueue').checked,
      anonymousNext: g('anonymousNext').checked,
      revivalLimit: +g('revivalLimit').value || 1,
      revivalFraction: +g('revivalFraction').value,
      seasonRange: [+g('s-lo').value, +g('s-hi').value],
    },
    blend: Object.fromEntries(SRC.map(([k]) => [k, mix[k] || 0])),
    // Beside the settings rather than inside them: it is not a rule and the
    // engine never sees it. The server trims and caps it again — this trim is
    // so the box is remembered the same way it is sent.
    hostName: g('hostName').value.trim(),
  };
}

const LEVEL_BLURB = {
  rookie: 'quiet, and slow on the buzzer',
  normie: 'an ordinary contestant',
  champ: 'wins about as often as not',
  superchamp: 'six wins or more',
  elite: 'the very best',
};

// The draw is random, so a test field can come out all rookies. Any robot's
// standard can be changed until the match starts.
function editBot(token) {
  const p = (S.roster || []).find((x) => x.token === token);
  if (!p) return;
  document.querySelectorAll('.botedit').forEach((n) => n.remove());
  const el = document.createElement('div'); el.className = 'botedit';
  el.innerHTML = `<div class="bebox">
    <h3>${p.name}</h3>
    <div class="cur">${p.bot || ''}</div>
    ${['rookie', 'normie', 'champ', 'superchamp', 'elite'].map((l) =>
      `<button class="belvl${p.level === l ? ' on' : ''}" data-l="${l}">
        <span>${l}</span><span class="bd">${LEVEL_BLURB[l]}</span></button>`).join('')}
    <button class="rm" data-rm="1">Remove this robot</button>
  </div>`;
  document.body.appendChild(el);
  const close = () => el.remove();
  el.onclick = (e) => { if (e.target === el) close(); };
  el.querySelectorAll('[data-l]').forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try {
      S = await api(`/api/match/${code}/bots/${encodeURIComponent(token)}`,
        { method: 'PATCH', body: JSON.stringify({ level: b.dataset.l }) });
    } catch (err) { el.querySelector('.cur').textContent = err.message; }
    close(); render(true);
  });
  el.querySelector('[data-rm]').onclick = async () => {
    try {
      S = await api(`/api/match/${code}/bots/${encodeURIComponent(token)}`, { method: 'DELETE' });
    } catch (err) { el.querySelector('.cur').textContent = err.message; }
    close(); render(true);
  };
  addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') { close(); removeEventListener('keydown', esc); }
  });
}

async function save(quiet) {
  const m = document.getElementById('savemsg');
  try {
    const body = collect();
    // Remembered on the way out rather than on every keystroke, so a half-typed
    // name never becomes the stored one.
    rememberHost(body.hostName);
    S = await api(`/api/match/${code}`, { method: 'PATCH', body: JSON.stringify(body) });
    if (!quiet && m) {
      m.textContent = '\u2713 Settings saved';
      m.style.color = 'var(--live)';
      setTimeout(() => { m.textContent = ''; }, 2600);
    }
    return true;
  } catch (e) {
    if (m) { m.textContent = e.message; m.style.color = 'var(--alarm)'; }
    return false;
  }
}

function wire() {
  // --- quick / expert -----------------------------------------------------
  //
  // Switching modes only changes a class: every control is in the page in both
  // modes, so nothing is re-created and nothing in flight is lost.
  document.getElementById('mquick').onclick = () => { setMode('quick'); render(true); };
  document.getElementById('mexpert').onclick = () => { setMode('expert'); render(true); };

  // A preset writes into the real controls and saves, so Expert always shows
  // the truth about what is switched on.
  //
  // The order matters and is easy to get wrong. collect() reads the DOM, not
  // S.settings, so saving before the repaint would collect the controls the
  // preset was meant to replace and write the old values straight back. And the
  // repaint has to be render(), never render(true): keepEdits captures every
  // control first and restores it afterwards, which would undo the preset just
  // as thoroughly. Paint, then save, then paint again so the estimate and the
  // warnings are computed from what the server actually kept.
  const applyPreset = async (table, key) => {
    const p = table[key];
    if (!p) return;                     // "Custom" is a readout, not a choice
    Object.assign(S.settings, p.set);
    render();
    await save(true);
    render();
  };
  const rs = document.getElementById('ruleset');
  if (rs) rs.onchange = () => applyPreset(RULESETS, rs.value);
  const sp = document.getElementById('speed');
  if (sp) sp.onchange = () => applyPreset(SPEEDS, sp.value);

  const qa = document.getElementById('qaddbots');
  if (qa) qa.onclick = async () => {
    qa.disabled = true; qa.textContent = 'Adding…';
    try {
      // The measured scale, not the model's own: measured is anchored on buzz
      // times recorded here, and the observed scale makes robots very nearly
      // unbeatable for a human. A quick setup should not hand the host that.
      const r = await api(`/api/match/${code}/bots`, { method: 'POST',
        body: JSON.stringify({ count: 6, profile: 'measured' }) });
      S = r; lastBots = r.added || [];
    } catch (e) { qa.textContent = e.message; return; }
    render(true);
  };
  const qr = document.getElementById('qrmbots');
  if (qr) qr.onclick = async () => {
    S = await api(`/api/match/${code}/bots`, { method: 'DELETE' });
    lastBots = []; render(true);
  };
  const qbl = document.getElementById('qbotlist');
  if (qbl) qbl.innerHTML = lastBots.map((b) => `<span>${b.name} &mdash; ${b.describe}</span>`).join('');

  document.querySelectorAll('input[data-w]').forEach((sl) => {
    sl.oninput = () => setPct(sl.dataset.w, Number(sl.value));
    sl.onchange = () => save(true);
  });
  document.getElementById('mine').onclick = () => {
    const own = SRC.map(([k]) => k).filter((k) => k !== 'archive' && (S.available[k] || 0) > 0);
    if (!own.length) return;
    setPct('archive', 0);
    save();
  };
  const ab = document.getElementById('addbots');
  if (ab) ab.onclick = async () => {
    ab.disabled = true; ab.textContent = 'Adding\u2026';
    try {
      const r = await api(`/api/match/${code}/bots`, { method: 'POST', body: JSON.stringify({
        count: Number(document.getElementById('botcount').value) || 1,
        profile: document.getElementById('botprofile').value,
        level: document.getElementById('botlevel').value || undefined }) });
      S = r;
      lastBots = r.added || [];
    } catch (e) { document.getElementById('msg').textContent = e.message; }
    render(true);
  };
  document.querySelectorAll('[data-bot]').forEach((el) => {
    const open = () => editBot(el.dataset.bot);
    el.onclick = open;
    el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });
  const rb = document.getElementById('rmbots');
  if (rb) rb.onclick = async () => { S = await api(`/api/match/${code}/bots`, { method: 'DELETE' });
    lastBots = []; render(true); };
  const bl = document.getElementById('botlist');
  if (bl) bl.innerHTML = lastBots.map((b) => `<span>${b.name} &mdash; ${b.describe}</span>`).join('');

  document.getElementById('save').onclick = () => save();
  // On change rather than on input: saving per keystroke would PATCH the match
  // once per letter, and `change` still fires when they tab away or hit start.
  const hn = document.getElementById('hostName');
  if (hn) hn.onchange = () => save(true);
  const rev = document.getElementById('revival');
  rev.onchange = () => {
    document.getElementById('revrow').style.display = rev.checked ? '' : 'none';
    S.settings.revival = rev.checked;
    renderWarnings();
    save(true);
  };
  ['topRope', 'targeting', 'bounties'].forEach((k) => {
    const el = document.getElementById(k);
    if (el) el.onchange = () => { S.settings[k] = el.checked; renderWarnings(); save(true); };
  });
  ['s-lo', 's-hi'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => save(true).then(() => render());
  });
  ['targetMinutes', 'secondsPerClue', 'entryInterval'].forEach((id) => {
    const el = document.getElementById(id);
    if (el) el.oninput = () => {
      S.settings[id] = id === 'entryInterval' && el.value === '' ? null : +el.value;
      // One preview, both surfaces, so they cannot drift apart.
      const { e, warnings: ws } = preview();
      const est = document.querySelector('.est');
      if (e && est) est.innerHTML = `With ${S.roster.length} players: entry every <b>${e.iv}</b> clues${
        e.auto ? ' (auto)' : ''}, roughly <b>${e.mins} minutes</b>, about ${e.clues} clues.${e.rough ? ' Rough at this size.' : ''}`;
      paintWarnings(ws);
    };
  });
  [['entryMode', 'ivwrap'], ['decayMode', 'decaywrap'], ['ceilingMode', 'ceilwrap']]
    .forEach(([sel, wrap]) => {
      const el = document.getElementById(sel);
      el.onchange = () => {
        document.getElementById(wrap).style.display = el.value === 'auto' ? 'none' : '';
        save(true).then(() => render());
      };
    });

  const drop = document.getElementById('drop'), file = document.getElementById('file');
  file.onchange = () => queueFiles([...file.files]);
  ['dragenter', 'dragover'].forEach((e) => drop.addEventListener(e, (ev) => {
    ev.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((e) => drop.addEventListener(e, (ev) => {
    ev.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', (ev) => queueFiles([...ev.dataTransfer.files]));
  document.getElementById('upbtn').onclick = () => upload();
  renderQueue();

  document.getElementById('start').onclick = async () => {
    const b = document.getElementById('start');
    // A quiet save meant a failure here showed nothing at all and the button
    // simply did nothing — say what went wrong instead.
    if (!await save(false)) {
      b.textContent = 'Could not save the settings';
      setTimeout(() => { b.textContent = 'Start the Rumble'; }, 3000);
      return;
    }
    b.disabled = true;
    b.textContent = 'Starting...';
    // Wait for the server to confirm rather than navigating on a timer: if the
    // start is refused, landing on a console for a match that never began is
    // the least useful thing that can happen.
    let done = false;
    socket.emit('start-match', {}, (r) => {
      done = true;
      if (r && r.error) {
        b.disabled = false;
        b.textContent = r.error;
        setTimeout(() => { b.textContent = 'Start the Rumble'; }, 4000);
        return;
      }
      location.href = `/host/${code}#${hostKey}`;
    });
    // Older servers do not acknowledge; go anyway rather than hang.
    setTimeout(() => { if (!done) location.href = `/host/${code}#${hostKey}`; }, 1200);
  };
}

// Dropping a file only queues it. Uploading is a button press, so the host
// always knows whether their boards were actually processed.
let pending = [];

function queueFiles(files) {
  const fresh = files.filter((f) => !pending.some((p) => p.name === f.name && p.size === f.size));
  pending = pending.concat(fresh);
  renderQueue();
}

function renderQueue() {
  const q = document.getElementById('queued'), b = document.getElementById('upbtn'),
        n = document.getElementById('qnote');
  if (!q) return;
  q.innerHTML = pending.map((f, i) =>
    `<span class="qf">${f.name}<button class="x" data-q="${i}" aria-label="Remove ${f.name}">&times;</button></span>`).join('');
  q.querySelectorAll('[data-q]').forEach((x) => x.onclick = () => {
    pending.splice(Number(x.dataset.q), 1); renderQueue();
  });
  b.disabled = pending.length === 0;
  b.textContent = pending.length ? `Upload ${pending.length} file${pending.length > 1 ? 's' : ''}` : 'Upload';
  n.textContent = pending.length
    ? 'Nothing is added until you press upload.'
    : 'Nothing waiting.';
}

async function upload() {
  const m = document.getElementById('msg'), b = document.getElementById('upbtn');
  const files = pending.slice();
  if (!files.length) return;
  b.disabled = true; b.classList.add('busy'); b.textContent = 'Uploading…';
  let added = 0, failed = 0;
  for (const f of files) {
    m.textContent = `Reading ${f.name}…`; m.className = 'msg';
    try {
      const content = await f.text();
      const r = await api(`/api/match/${code}/material`, { method: 'POST',
        body: JSON.stringify({ name: f.name, content, format: /\.csv$/i.test(f.name) ? 'csv' : 'json' }) });
      S = r; added += r.added;
      pending = pending.filter((p) => p !== f);
    } catch (e) {
      failed++;
      m.textContent = `${f.name}: ${e.message}`; m.className = 'msg bad';
    }
  }
  b.classList.remove('busy');
  if (!failed) {
    m.textContent = `${added} categories added from ${files.length} file${files.length > 1 ? 's' : ''}.`;
    m.className = 'msg good';
  }
  render();
}

boot().catch((e) => { root.innerHTML = `<p class="msg bad">${e.message}</p>`; });
</script>
</body>
</html>
