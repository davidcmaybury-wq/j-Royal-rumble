<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J! Royal Rumble — control room</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0E1C;--panel:#131A30;--panel2:#1B2444;--line:#2A3556;--chalk:#EEEBE1;
--slate:#7C88AB;--brass:#D6A93F;--alarm:#E24A3C;--live:#4FB286;--r:5px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--chalk);
font:400 15px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding:24px 20px 60px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.top a{color:var(--slate);text-decoration:none;font-size:13px}
.top a:hover{color:var(--brass)}
h1{font-family:"Anton",Impact,sans-serif;font-size:30px;letter-spacing:.02em;margin:10px 0 2px}
h1 .j{color:var(--brass)}
.sub{color:var(--slate);font-size:13px;margin-bottom:20px}
h2{font-family:"Anton",Impact,sans-serif;font-size:16px;letter-spacing:.05em;
color:var(--brass);margin:26px 0 9px}
.warnbox{background:#2A1A08;border:1px solid #6A4A12;border-left-width:3px;
border-radius:var(--r);padding:12px 14px;font-size:13px;color:#E8C77A;margin-bottom:16px}
.warnbox code{font-family:"IBM Plex Mono",monospace;background:#00000044;padding:1px 5px;
border-radius:3px}
.askbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
padding:18px;max-width:340px}
.askbox label{display:block;font-size:13px;color:var(--slate);margin-bottom:8px}
.askrow{display:flex;gap:8px}
.askrow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);
border-radius:var(--r);padding:9px 11px;color:var(--chalk);font:inherit}
.askrow input:focus{outline:none;border-color:var(--brass)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
color:var(--slate);font-weight:400;padding:0 8px 7px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #1C2440}
tr:hover td{background:var(--panel)}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.code{font-family:"IBM Plex Mono",monospace;letter-spacing:.1em;color:var(--chalk)}
.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;
border-radius:3px;border:1px solid var(--line);color:var(--slate)}
.tag.live{border-color:var(--live);color:var(--live)}
.tag.lobby{border-color:var(--brass);color:var(--brass)}
.idle{color:var(--slate)}
.idle.warm{color:var(--brass)}
.idle.hot{color:var(--alarm)}
button{font:inherit;background:none;border:1px solid var(--line);color:var(--slate);
border-radius:var(--r);padding:5px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--alarm);color:var(--alarm)}
button.confirm{border-color:var(--alarm);color:var(--ink);background:var(--alarm);font-weight:500}
a.open{color:var(--slate);text-decoration:none;font-size:12.5px;margin-right:10px}
a.open:hover{color:var(--brass)}
/* A download is the reason most people open this page, so it looks like a
   button rather than a word in the margin. */
a.dl{display:inline-block;border:1px solid var(--line);border-radius:var(--r);
padding:5px 12px;color:var(--slate);text-decoration:none;font-size:13px}
a.dl:hover{border-color:var(--brass);color:var(--brass)}
.sz{color:#3C486E;font-size:11.5px;margin-left:8px;font-family:"IBM Plex Mono",monospace}
.none{color:var(--slate);font-size:13.5px;padding:14px 0}
/* Reports read as a list of things somebody said, not a table of rows. */
.rep{border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);
padding:12px 14px;margin-bottom:9px;background:var(--panel)}
.rep.bug{border-left-color:var(--alarm)}
.rep.idea{border-left-color:var(--live)}
.rhead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;margin-bottom:7px}
.tag.bug{border-color:var(--alarm);color:var(--alarm)}
.tag.idea{border-color:var(--live);color:var(--live)}
.rwho{color:var(--chalk);font-size:13.5px}
.rmeta{color:var(--slate);font-size:11.5px;font-family:"IBM Plex Mono",monospace}
.rwhen{margin-left:auto;color:#3C486E;font-size:11.5px}
.rtext{color:#C9CCD9;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
#bulk{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.foot{margin-top:30px;color:#3C486E;font-size:12px}
</style></head>
<body><div class="wrap">
  <div class="top"><a href="/">&larr; J! Royal Rumble</a><span class="foot" id="ver"></span></div>
  <h1><span class="j">J!</span> CONTROL ROOM</h1>
  <div class="sub" id="sub">Loading...</div>
  <div id="guard"></div>

  <h2>Matches on this server</h2>
  <div id="live"></div>

  <h2>Take a copy</h2>
  <div id="bulk"></div>

  <h2>What people have told us</h2>
  <div id="reports"></div>

  <h2>Saved logs</h2>
  <div id="logs"></div>

  <div class="foot" id="foot"></div>
</div>

<script type="module">
const $ = (id) => document.getElementById(id);
// The password is asked for once and kept for the tab. It travels in a request
// header, never the URL, so it stays out of server logs and referrers. The
// fragment is still honoured so a bookmarked /control#word keeps working.
let key = location.hash.slice(1) || sessionStorage.getItem('rumble-admin') || '';
const auth = () => (key ? { 'x-admin-key': key } : {});

function askKey(msg) {
  $('sub').textContent = '';
  $('guard').innerHTML = `<div class="askbox">
    <label for="pw">${msg || 'Password'}</label>
    <div class="askrow"><input type="password" id="pw" autocomplete="current-password">
      <button id="pwgo" class="confirm">Open</button></div></div>`;
  const go = () => {
    key = $('pw').value.trim();
    sessionStorage.setItem('rumble-admin', key);
    if (location.hash) history.replaceState(null, '', '/control');
    load();
  };
  $('pwgo').onclick = go;
  $('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('pw').focus();
}
let pending = null;               // the match awaiting a second click

const ago = (s) => s < 60 ? s + 's'
  : s < 3600 ? Math.round(s / 60) + ' min'
  : (s / 3600).toFixed(1) + ' hr';

async function load() {
  let d;
  try {
    const r = await fetch('/api/control', { headers: auth() });
    d = await r.json();
    if (d.error) throw new Error(d.error);
  } catch (e) {
    $('live').innerHTML = ''; $('logs').innerHTML = ''; $('foot').textContent = '';
    if (e.message === 'bad admin key') {
      askKey(key ? 'That password is wrong. Try again.' : 'Password');
    } else {
      $('sub').textContent = 'Could not reach the server.';
    }
    return;
  }

  $('ver').textContent = 'v' + d.version;
  $('sub').textContent = `Up ${ago(d.uptimeSeconds)}. Matches with no activity for `
    + `${d.idleMinutes} minutes end themselves.`;

  $('guard').innerHTML = '';

  const ms = d.matches || [];
  $('live').innerHTML = !ms.length
    ? '<div class="none">Nothing running.</div>'
    : `<table><tr><th>Room</th><th>State</th><th>People</th><th>Clues</th>
       <th>Quiet for</th><th></th></tr>${ms.map((m) => {
      const heat = m.idleSeconds > 480 ? 'hot' : m.idleSeconds > 240 ? 'warm' : '';
      return `<tr>
        <td class="code">${m.id}</td>
        <td><span class="tag ${m.phase}">${m.phase}</span></td>
        <td class="num">${m.connected}/${m.humans}${m.players > m.humans
          ? ` <span class="idle">+${m.players - m.humans} bots</span>` : ''}</td>
        <td class="num">${m.clues}</td>
        <td class="num idle ${heat}">${ago(m.idleSeconds)}</td>
        <td style="text-align:right">
          <a class="open" href="/watch/${m.id}" target="_blank" rel="noopener">watch</a>
          <button data-end="${m.id}" class="${pending === m.id ? 'confirm' : ''}">${
            pending === m.id ? 'Really end it?' : 'End'}</button></td></tr>`;
    }).join('')}</table>`;

  for (const b of $('live').querySelectorAll('[data-end]')) {
    b.onclick = () => end(b.dataset.end);
  }

  const ls = d.logs || [];
  $('logs').innerHTML = !ls.length
    ? '<div class="none">No logs saved yet.</div>'
    : `<table><tr><th>When</th><th>Players</th><th>Clues</th><th>Length</th>
       <th>Winner</th><th></th></tr>
       ${ls.map((l) => `<tr>
        <td>${l.at ? new Date(l.at).toLocaleString() : '—'}${
          l.partial ? ' <span class="tag">partial</span>' : ''}</td>
        <td class="num">${l.players ?? '—'}</td>
        <td class="num">${l.clues ?? '—'}</td>
        <td class="num">${l.minutes != null ? Math.round(l.minutes) + ' min' : '—'}</td>
        <td>${l.winner || '—'}</td>
        <td style="text-align:right">
          <a class="dl" download="${l.file}"
             href="/api/logs/${encodeURIComponent(l.file)}?key=${encodeURIComponent(key)}"
             >Download</a>
          <span class="sz">${l.bytes ? Math.round(l.bytes / 1024) + 'KB' : ''}</span>
        </td></tr>`).join('')}</table>`;
  $('foot').textContent = `${ls.length} logs. Reloads every 5 seconds.`;

  // Reports. Escaped on the way in: this is text a stranger typed, going onto a
  // page the host opens.
  const esc = (x) => String(x == null ? '' : x)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const rs = d.reports || [];
  $('reports').innerHTML = !rs.length
    ? '<div class="none">Nothing reported yet.</div>'
    : rs.map((r) => `<div class="rep ${r.kind}">
        <div class="rhead">
          <span class="tag ${r.kind}">${r.kind === 'idea' ? 'idea' : 'bug'}</span>
          <span class="rwho">${esc(r.name) || 'somebody'}</span>
          <span class="rmeta">${esc(r.screen)}${r.gameId ? ' &middot; ' + esc(r.gameId) : ''}${
            r.clue != null ? ' &middot; clue ' + r.clue : ''}${
            r.version ? ' &middot; v' + esc(r.version) : ''}</span>
          <span class="rwhen">${r.at ? new Date(r.at).toLocaleString() : ''}</span>
        </div>
        <div class="rtext">${esc(r.text)}</div></div>`).join('');

  // The bulk download, with what is waiting.
  const since = d.newSince ? new Date(d.newSince).toLocaleDateString() : 'the beginning';
  $('bulk').innerHTML = `<a class="dl" href="/api/control/download?key=${encodeURIComponent(key)}"
      >Download what is new</a>
    <span class="sz">${d.newCount || 0} since ${since}</span>
    <a class="open" href="/api/control/download?all=1&key=${encodeURIComponent(key)}"
      >or everything</a>`;
}

// Two clicks, because ending somebody's match mid-clue is not undoable.
async function end(id) {
  if (pending !== id) {
    pending = id;
    await load();
    setTimeout(() => { if (pending === id) { pending = null; load(); } }, 5000);
    return;
  }
  pending = null;
  await fetch(`/api/control/${id}/end`, { method: 'POST', headers: auth() });
  await load();
}

load();
setInterval(() => { if (!pending) load(); }, 5000);
</script>
</body></html>
