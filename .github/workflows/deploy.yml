name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A step's `if` cannot read `secrets` — GitHub rejects the whole file with
      # "Unrecognized named-value: 'secrets'". Job-level env can, so the flag is
      # computed once here and the steps test that instead.
      HAVE_DEPLOY_KEY: ${{ secrets.AWS_SSH_KEY != '' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - name: Verify rules engine against tuning targets
        run: node test/harness.js
      - name: Length estimates and setup warnings
        run: node test/estimate.mjs
      - name: Pages bind only to elements that exist
        run: node test/pagerefs.mjs
      - name: Box score parser
        run: node test/boxparse.mjs
      - name: Box score collector, end to end
        run: node test/boxfetch.mjs
      - name: Robot players match observed play
        run: node tools/calibrate-bots.mjs
      - name: Advanced mechanics arithmetic
        run: node test/mechanics.mjs
      - name: Overtime resolves a stalled endgame
        run: node test/overtime.mjs
      - name: End-to-end match over sockets
        run: |
          node src/server.js & sleep 10
          node test/e2e.mjs
          node test/setup.mjs
          node test/buzzer.mjs
          node test/record.mjs
          node test/avatar.mjs
          node test/mechanics-live.mjs
          node test/perf.mjs
          node test/delay.mjs
          node test/escapes.mjs
          node test/themes.mjs
          node test/fullbuzzer.mjs
          node test/welcome.mjs
          node test/workflows.mjs
          node test/health.mjs
          node test/moved.mjs
          node test/wrestlers.mjs
          node test/mechanics2.mjs
          node test/latecomer.mjs
          node test/lag.mjs
          node test/logdetail.mjs
          node test/warmup.mjs
          node test/timeout.mjs
          node test/otvalue.mjs
          node test/watch.mjs
          node test/mechanics-ui.mjs
          node test/logstore.mjs
          node test/botcal.mjs
          node test/retoss.mjs
          node test/entry-countdown.mjs
          node test/tokens.mjs
          node test/bots.mjs
          node test/setup-bots.mjs
      # The live site moved to Lightsail, where deploying is a pull on the box.
      # This workflow keeps running the whole suite on every push, because that
      # is the safety net the move would otherwise have removed — a bare
      # `git pull` will happily deploy a broken commit.
      #
      # The Fly deploy is kept behind a switch rather than deleted, so the old
      # app can still be brought up to date if it is ever needed as a fallback.
      # Set the repository variable DEPLOY_FLY=true to re-enable it.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: vars.DEPLOY_FLY == 'true'
      - run: flyctl deploy --remote-only
        if: vars.DEPLOY_FLY == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Deploys to the Lightsail box once the suite is green, which is the
      # property the move off Fly had quietly lost: a bare `git pull` on the
      # box will happily ship a broken commit.
      #
      # Skipped entirely until AWS_SSH_KEY is set, so this workflow stays useful
      # as plain CI in the meantime. See infra/aws/README.md for the two-minute
      # setup.
      - name: Deploy to Lightsail
        if: env.HAVE_DEPLOY_KEY == 'true'
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          set +e            # diagnose failures rather than dying silently
          mkdir -p ~/.ssh

          # printf, not echo: a secret pasted without a trailing newline
          # produces a key OpenSSH rejects instantly as "invalid format", and
          # under `bash -e` the step dies in milliseconds saying nothing.
          printf '%s\n' "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy

          if ! ssh-keygen -y -f ~/.ssh/deploy > /dev/null 2>&1; then
            echo "::error::AWS_SSH_KEY is not a usable private key."
            echo "Paste the whole file including the BEGIN and END lines:"
            echo "  cat ~/.ssh/gh-deploy    (on the Lightsail box)"
            echo "Note it must be the PRIVATE half, not the .pub file."
            exit 1
          fi

          if [ -z "$AWS_HOST" ]; then
            echo "::error::AWS_HOST is not set. It should be the box's IP."
            exit 1
          fi

          # A secret pasted from a browser often carries a scheme, a trailing
          # slash, or invisible whitespace, and ssh answers only "hostname
          # contains invalid characters" without saying which. Clean it up
          # rather than making somebody guess.
          HOST=$(printf '%s' "$AWS_HOST" \
            | tr -d '[:space:]' \
            | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' \
                  -e 's#/.*$##' \
                  -e 's#^[^@]*@##' \
                  -e 's#:[0-9]*$##')

          if ! printf '%s' "$HOST" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$|^[A-Za-z0-9.-]+$'; then
            echo "::error::AWS_HOST is not a plain hostname or IP."
            echo "It should be just the address, e.g. 3.15.120.241 — no https://,"
            echo "no ubuntu@ prefix, no trailing slash or port."
            exit 1
          fi
          if [ "$HOST" != "$AWS_HOST" ]; then
            echo "Note: AWS_HOST had extra characters; using the cleaned value."
            echo "Worth fixing the secret so this step does not have to guess."
          fi

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # --wait rather than --force: if a match is being played the deploy
          # holds until it finishes rather than ending it under them.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ConnectTimeout=15 \
              ubuntu@"$HOST" \
              'bash /home/ubuntu/app/tools/deploy-remote.sh --wait'
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::Deploy failed (exit $rc)."
            case $rc in
              255) echo "SSH could not connect or authenticate. Check the public half is in";
                   echo "~/.ssh/authorized_keys on the box, and that AWS_HOST is right." ;;
              127) echo "deploy-remote.sh is not on the box yet. Pull once by hand:";
                   echo "  cd /home/ubuntu/app && git pull && npm install --omit=dev && sudo systemctl restart rumble" ;;
               75) echo "A match was still being played when the wait ran out." ;;
            esac
            exit $rc
          fi

      - name: How to deploy by hand
        if: env.HAVE_DEPLOY_KEY != 'true'
        run: |
          echo "Tests passed, but no AWS_SSH_KEY is set, so nothing was deployed."
          echo "SSH the Lightsail box (infra/aws/HOSTING.md), then:"
          echo "  bash /home/ubuntu/app/tools/deploy-remote.sh"
          echo "Set AWS_SSH_KEY and AWS_HOST to have this happen automatically." 
