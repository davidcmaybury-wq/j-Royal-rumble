name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install
      - name: Verify rules engine against tuning targets
        run: node test/harness.js
      - name: Length estimates and setup warnings
        run: node test/estimate.mjs
      - name: Pages bind only to elements that exist
        run: node test/pagerefs.mjs
      - name: Box score parser
        run: node test/boxparse.mjs
      - name: Box score collector, end to end
        run: node test/boxfetch.mjs
      - name: Robot players match observed play
        run: node tools/calibrate-bots.mjs
      - name: Advanced mechanics arithmetic
        run: node test/mechanics.mjs
      - name: Overtime resolves a stalled endgame
        run: node test/overtime.mjs
      - name: End-to-end match over sockets
        run: |
          node src/server.js & sleep 10
          node test/e2e.mjs
          node test/setup.mjs
          node test/buzzer.mjs
          node test/record.mjs
          node test/avatar.mjs
          node test/mechanics-live.mjs
          node test/perf.mjs
          node test/delay.mjs
          node test/escapes.mjs
          node test/bots.mjs
          node test/setup-bots.mjs
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
