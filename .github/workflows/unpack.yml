name: unpack

# Ship an update from a phone.
#
#   1. On github.com, open the incoming/ folder
#   2. Add file -> Upload files -> pick the .tar.gz -> Commit
#   3. This unpacks it over the tree, deletes the tarball, and commits
#   4. That commit triggers the normal deploy, tests and all
#
# No token, no secret, no shell. The upload page works in a mobile browser.
#
# One thing it cannot do: GITHUB_TOKEN is not allowed to modify files under
# .github/workflows, so those are skipped and listed in the run summary. That
# is rare and worth knowing about rather than failing silently over.

on:
  push:
    # Any archive, not just *.tar.gz. The download card renames the file on the
    # way to a phone, so what actually arrives is usually a bare .tar even
    # though it is gzipped inside. A filter that only matched .tar.gz would
    # never have fired once.
    paths: ['incoming/**']

permissions:
  contents: write

concurrency:
  group: unpack
  cancel-in-progress: false

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find the tarball
        id: find
        run: |
          FILE=$(ls -t incoming/*.tar incoming/*.tar.gz incoming/*.tgz 2>/dev/null | head -1 || true)
          if [ -z "$FILE" ]; then
            echo "nothing to unpack"
            echo "found=" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "found=$FILE" >> $GITHUB_OUTPUT
          echo "name=$(basename "$FILE")" >> $GITHUB_OUTPUT
          echo "Unpacking $FILE"

      - name: Unpack over the working tree
        if: steps.find.outputs.found != ''
        id: unpack
        run: |
          set -e
          FILE='${{ steps.find.outputs.found }}'

          # Look before leaping: refuse anything that tries to write outside
          # the repository, and note any workflow files we will have to skip.
          if tar taf "$FILE" | grep -qE '(^|/)\.\./'; then
            echo "::error::the archive contains paths that climb out of the tree"
            exit 1
          fi
          SKIPPED=$(tar taf "$FILE" | grep -E '^\./\.github/workflows/' || true)
          echo "skipped<<EOF" >> $GITHUB_OUTPUT
          echo "$SKIPPED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          mkdir -p /tmp/unpack
          # -a lets tar work out the compression, so .tar and .tar.gz both work.
          tar xaf "$FILE" -C /tmp/unpack
          rm -f "$FILE"

          # Copy over the top. Deliberately no deletion of anything the
          # archive lacks: the tarballs exclude the clue library and the
          # workflow directory, so a mirroring copy would wipe both. A stale
          # leftover file is a far smaller problem than a deleted library.
          rm -rf /tmp/unpack/.github/workflows
          rm -rf /tmp/unpack/node_modules /tmp/unpack/.git
          cp -a /tmp/unpack/. ./

          echo "--- changed ---"
          git status --short | head -40

      - name: Commit and let the deploy run
        if: steps.find.outputs.found != ''
        run: |
          if git diff --quiet && git diff --cached --quiet && \
             [ -z "$(git status --porcelain)" ]; then
            echo "the archive matched what was already here; nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack ${{ steps.find.outputs.name }}"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Unpacked \`${{ steps.find.outputs.name }}\`"
            echo ""
            if [ -n "${{ steps.unpack.outputs.skipped }}" ]; then
              echo "**Workflow files were skipped.** A GitHub token cannot change"
              echo "files under \`.github/workflows\`, so these need applying by hand:"
              echo ""
              echo '```'
              echo "${{ steps.unpack.outputs.skipped }}"
              echo '```'
            else
              echo "No workflow changes in this archive, so nothing was skipped."
            fi
          } >> $GITHUB_STEP_SUMMARY
