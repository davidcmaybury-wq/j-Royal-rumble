# Deploys to AWS when the repository variable DEPLOY_TARGET is 'aws'.
#
# Runs the same test suite as the Fly workflow, pushes the image to ECR, then
# tells the instance to pull and restart over SSM — no SSH keys, no open port
# 22, and the command output lands in the Actions log.
#
# Cutover is one switch: set the repo variable DEPLOY_TARGET=aws and both
# workflows change places (the Fly one checks the same variable and stands
# down). Set it back and you are on Fly again — the app itself has no idea
# where it is running.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  - the rumble-deployer user
#   AWS_REGION                                  - e.g. us-east-2
#   AWS_INSTANCE_ID                             - from the stack outputs
#   AWS_ECR_REPO                                - from the stack outputs
name: deploy-aws
on:
  push:
    branches: [main]
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: vars.DEPLOY_TARGET == 'aws'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install

      - name: Boot the server
        run: |
          node src/server.js &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/api/health && break
            sleep 1
          done

      - name: Offline suites
        run: |
          node test/mechanics.mjs
          node test/estimate.mjs
          node test/boxparse.mjs
          node test/wrestlers.mjs

      - name: Socket suites
        run: |
          node test/wrestlers.mjs
          node test/mechanics2.mjs
          node test/latecomer.mjs
          node test/lag.mjs
          node test/logdetail.mjs
          node test/warmup.mjs
          node test/timeout.mjs
          node test/otvalue.mjs
          node test/watch.mjs
          node test/mechanics-ui.mjs
          node test/overtime.mjs
          node test/logstore.mjs
          node test/retoss.mjs
          node test/entry-countdown.mjs
          node test/pagerefs.mjs
          node test/tokens.mjs
          node test/botcal.mjs
          node test/bots.mjs
          node test/setup-bots.mjs
          node test/setup.mjs
          node test/delay.mjs
          node test/record.mjs
          node test/buzzer.mjs
          node test/avatar.mjs
          node test/mechanics-live.mjs
          node test/perf.mjs
          node test/escapes.mjs

      - name: End-to-end match over sockets
        run: node test/e2e.mjs

      - name: Build and push the image
        run: |
          aws configure set aws_access_key_id "${{ secrets.AWS_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          aws configure set region "${{ secrets.AWS_REGION }}"
          aws ecr get-login-password | docker login --username AWS \
            --password-stdin "${{ secrets.AWS_ECR_REPO }}"
          docker build -t "${{ secrets.AWS_ECR_REPO }}:latest" \
                       -t "${{ secrets.AWS_ECR_REPO }}:${{ github.sha }}" .
          docker push --all-tags "${{ secrets.AWS_ECR_REPO }}"

      - name: Restart the instance onto the new image
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters commands=/usr/local/bin/rumble-deploy \
            --query Command.CommandId --output text)
          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
              --query Status --output text)
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}" \
              --query StandardErrorContent --output text; exit 1; }
            sleep 4
          done
          echo "timed out waiting for the deploy command" && exit 1
