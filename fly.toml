app = "j-royal-rumble"
# Chicago: the lowest worst-case latency for a field spread across the US.
# From sjc the East Coast pays ~75ms each way; from ord nowhere in the
# continental US is much over 50ms. Fall back to dfw if ord won't place —
# not back to sjc, which is often at capacity.
primary_region = "ord"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Matches live in memory, so this app must run exactly one machine and must
  # not be stopped between requests. Also run: fly scale count 1
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 120

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Match logs. Without this the logs are written to the machine's own disk,
# which survives a restart but is wiped by the next deploy — and this app
# deploys several times a day. Create the volume once:
#
#   fly volumes create rumble_data --size 1 --region ord
#
[mounts]
  source = "rumble_data"
  destination = "/data"
